<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Evia</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/evia-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/evia-180.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Evia">
  <style>
    :root {
      --evia-yellow: #f5c400;
      --bg: #ffffff;
      --eye-x: 0em;
      --eye-y: 0em;
      --char-tilt: 0deg;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      background: var(--bg);
      font-family: Arial, Helvetica, sans-serif;
      color: #1f1f1f;
    }

    button, textarea, input {
      font: inherit;
    }

    .screen {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      position: relative;
      overflow: hidden;
    }

    .evia-stage {
      position: absolute;
      left: 50%;
      top: 50%;
      font-size: clamp(123.75px, 34.5vw, 165px);
      width: 1em;
      height: 1em;
      transform: translate(-50%, -50%);
      transition:
        top 1100ms cubic-bezier(0.22, 1, 0.36, 1),
        font-size 1100ms cubic-bezier(0.22, 1, 0.36, 1);
      cursor: pointer;
      z-index: 2;
    }

    .screen.active .evia-stage {
      top: calc(max(18px, env(safe-area-inset-top)) + 28px);
      font-size: clamp(61.875px, 17.25vw, 82.5px);
    }

    .evia-float {
      position: relative;
      width: 1em;
      height: 1em;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: stageFloat 8s ease-in-out infinite;
    }

    .evia-float::before {
      content: "";
      position: absolute;
      inset: 0.10em;
      border-radius: 50%;
      background: radial-gradient(circle at center, rgba(245, 196, 0, 0.22), rgba(245, 196, 0, 0.08) 46%, rgba(245, 196, 0, 0) 76%);
      filter: blur(0.10em);
      transform: scale(1.12);
      animation: glowPulse 8s ease-in-out infinite;
      z-index: 0;
      pointer-events: none;
    }

    .evia-character {
      position: relative;
      width: 1em;
      height: 1em;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: rotate(var(--char-tilt));
      transition: transform 1400ms cubic-bezier(0.22, 1, 0.36, 1);
      z-index: 1;
      will-change: transform;
    }

    .evia-body {
      position: relative;
      width: 1em;
      height: 1em;
      border: 0.026em solid var(--evia-yellow);
      border-radius: 50%;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      filter:
        drop-shadow(0 0 0.038em rgba(245, 196, 0, 0.55))
        drop-shadow(0 0 0.105em rgba(245, 196, 0, 0.28))
        drop-shadow(0 0 0.22em rgba(245, 196, 0, 0.13));
      animation: bodyDrift 10s ease-in-out infinite;
      will-change: transform;
    }

    .eyes {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.105em;
      transform: translate(var(--eye-x), var(--eye-y));
      transition: transform 1200ms cubic-bezier(0.22, 1, 0.36, 1);
      will-change: transform;
    }

    .eye {
      width: 0.235em;
      height: 0.235em;
      border: 0.022em solid var(--evia-yellow);
      border-radius: 50%;
      background: transparent;
      transform-origin: center;
      transition: transform 150ms ease;
      will-change: transform;
      flex: 0 0 auto;
    }

    .evia-character.blink .eye {
      transform: scaleY(0.08);
    }

    .evia-float.talking {
      animation: talkingFloat 1050ms ease-in-out infinite;
    }

    .evia-character.talking {
      animation: talkingTilt 760ms ease-in-out infinite;
    }

    .evia-speech {
      position: absolute;
      left: 50%;
      top: calc(50% + clamp(88px, 24vw, 108px));
      width: min(calc(100vw - 42px), 430px);
      min-height: 50px;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 3px;
      color: rgba(45, 45, 45, 0.76);
      text-align: center;
      font-size: 15px;
      line-height: 1.35;
      letter-spacing: 0.005em;
      z-index: 4;
      pointer-events: none;
      transition: top 1100ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .screen.active .evia-speech {
      top: calc(max(18px, env(safe-area-inset-top)) + 88px);
    }

    .speech-line { width: 100%; min-height: 21px; line-height: 1.45; white-space: normal; }

    .course-title {
      position: absolute;
      left: 50%;
      top: calc(max(18px, env(safe-area-inset-top)) + 136px);
      width: min(calc(100vw - 42px), 430px);
      transform: translateX(-50%);
      color: rgba(45, 45, 45, 0.62);
      text-align: center;
      font-size: 12px;
      font-weight: 600;
      line-height: 1.3;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      z-index: 3;
      transition: opacity 320ms ease, visibility 0s linear 320ms;
    }

    .screen.active:not(.evidence-open) .course-title.has-title {
      opacity: 1;
      visibility: visible;
      transition: opacity 320ms ease, visibility 0s linear 0s;
    }

  .speech-line-reveal {
    opacity: 0; transform: translateX(-8px);
    -webkit-mask-image: linear-gradient(90deg,#000 0%,#000 66%,transparent 100%);
    mask-image: linear-gradient(90deg,#000 0%,#000 66%,transparent 100%);
    -webkit-mask-size: 240% 100%; mask-size: 240% 100%;
    -webkit-mask-position: 100% 0; mask-position: 100% 0;
    animation: speechLineReveal 720ms cubic-bezier(0.22,1,0.36,1) forwards;
  }

    .evia-character.accent-wobble { animation: accentWobble 1200ms cubic-bezier(0.22, 1, 0.36, 1); }
    .evia-character.accent-squish { animation: accentSquish 1150ms cubic-bezier(0.22, 1, 0.36, 1); }
    .evia-character.accent-lean { animation: accentLean 1350ms cubic-bezier(0.22, 1, 0.36, 1); }

    .back-button {
      position: absolute;
      left: max(14px, env(safe-area-inset-left));
      top: calc(max(14px, env(safe-area-inset-top)) + 8px);
      min-width: 72px;
      min-height: 42px;
      border-radius: 999px;
      border: 1.5px solid rgba(245, 196, 0, 0.38);
      background: rgba(250, 249, 242, 0.97);
      color: rgba(45, 45, 45, 0.68);
      padding: 0 16px;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 30;
      cursor: pointer;
    }

    .back-button.show { display: flex; }

    .pill-stack {
      position: absolute;
      left: 50%;
      top: calc(max(18px, env(safe-area-inset-top)) + 160px);
      width: min(calc(100vw - 40px), 460px);
      display: flex;
      flex-direction: column;
      gap: 12px;
      opacity: 0;
      visibility: hidden;
      transform: translate(-50%, 22px);
      pointer-events: none;
      transition:
        opacity 520ms ease,
        transform 820ms cubic-bezier(0.22, 1, 0.36, 1),
        visibility 0s linear 820ms;
      z-index: 1;
    }

    .screen.active.pills-ready:not(.evidence-open) .pill-stack {
      opacity: 1;
      visibility: visible;
      transform: translate(-50%, 0);
      pointer-events: auto;
      transition:
        opacity 520ms ease,
        transform 820ms cubic-bezier(0.22, 1, 0.36, 1),
        visibility 0s linear 0s;
    }

    .pill {
      width: 100%;
      min-height: 52px;
      border-radius: 999px;
      border: 1.5px solid rgba(245, 196, 0, 0.35);
      background: rgba(250, 249, 242, 0.96);
      box-shadow:
        0 8px 20px rgba(0, 0, 0, 0.05),
        inset 0 0 0 1px rgba(255, 255, 255, 0.72);
      display: flex;
      align-items: center;
      padding: 0 18px;
      color: rgba(45, 45, 45, 0.5);
      font-size: 14px;
      letter-spacing: 0.02em;
      transition:
        opacity 260ms ease,
        transform 430ms cubic-bezier(0.22, 1, 0.36, 1);
      cursor: pointer;
    }

    .pill.fade-out {
      opacity: 0;
      transform: translateY(-8px);
      pointer-events: none;
    }

    .pill.float-in {
      opacity: 0;
      transform: translateY(18px);
    }

    .pill-label {
      min-width: 0;
      flex: 1 1 auto;
    }

    .pill-progress-mark {
      width: 20px;
      height: 20px;
      margin-left: 12px;
      border-radius: 50%;
      flex: 0 0 auto;
      position: relative;
    }

    .pill-progress-ring {
      background: conic-gradient(var(--evia-yellow) var(--pill-progress, 0deg), rgba(245, 196, 0, 0.18) 0);
    }

    .pill-progress-ring::after {
      content: "";
      position: absolute;
      inset: 3px;
      border-radius: 50%;
      background: rgba(250, 249, 242, 0.98);
    }

    .pill-progress-tick {
      display: grid;
      place-items: center;
      background: var(--evia-yellow);
      color: #fff;
      font-size: 13px;
      line-height: 1;
      font-weight: 700;
    }

    .evidence-screen {
      position: absolute;
      left: 50%;
      top: calc(max(18px, env(safe-area-inset-top)) + 152px);
      bottom: calc(max(62px, env(safe-area-inset-bottom) + 62px) + 8px);
      width: min(calc(100vw - 28px), 520px);
      transform: translateX(-50%);
      display: none;
      grid-template-rows: 1fr 1fr;
      gap: 10px;
      z-index: 3;
    }

    .screen.evidence-open.evidence-ready .evidence-screen { display: grid; }

    .evidence-top {
      min-height: 0;
      display: grid;
      grid-template-rows: auto auto;
      align-content: start;
      gap: 10px;
    }

    .evidence-choice,
    .evidence-requirements,
    .capture-surface {
      border: 1.5px solid rgba(245, 196, 0, 0.35);
      background: rgba(250, 249, 242, 0.96);
      border-radius: 24px;
      box-shadow:
        0 8px 20px rgba(0, 0, 0, 0.05),
        inset 0 0 0 1px rgba(255, 255, 255, 0.72);
    }

    .evidence-choice {
      width: 100%;
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      gap: 4px;
      padding: 14px 18px;
      color: rgba(45, 45, 45, 0.68);
      text-align: left;
      cursor: pointer;
      overflow: visible;
      flex: 0 0 auto;
    }

    .evidence-choice-heading { font-size: 12px; font-weight: 600; color: rgba(45,45,45,.58); letter-spacing: .02em; }
    .evidence-choice-detail { width: 100%; display: flex; flex-direction: column; gap: 3px; }
    .evidence-choice-detail + .evidence-choice-detail { margin-top: 5px; padding-top: 7px; border-top: 1px solid rgba(245,196,0,.2); }
    .evidence-choice-type { font-size: 14px; font-weight: 600; color: rgba(45,45,45,.82); }
    .evidence-choice-label { font-size: 13px; font-weight: 600; color: rgba(45,45,45,.74); }
    .evidence-choice-instruction { font-size: 12px; line-height: 1.38; color: rgba(45,45,45,.66); }

    .evidence-requirements {
      min-height: 0;
      padding: 18px;
      overflow-y: auto;
      color: rgba(45, 45, 45, 0.68);
      line-height: 1.45;
    }

    .evidence-requirements h2 {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 10px;
      color: rgba(45, 45, 45, 0.82);
    }

    .evidence-requirements ul { margin: 0; padding-left: 19px; display: flex; flex-direction: column; gap: 7px; }
    .evidence-requirements li { padding-left: 2px; font-size: 13px; line-height: 1.38; }

    .capture-surface {
      width: 100%;
      height: 100%;
      min-height: 0;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: center;
      padding: 12px;
    }

    .capture-square {
      width: min(100%, 46vh);
      max-height: 100%;
      aspect-ratio: 1 / 1;
      margin: auto;
      border-radius: 20px;
      overflow: hidden;
      background: #111;
      position: relative;
    }

    .capture-square video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .recording-timer {
      position: absolute;
      left: 12px;
      top: 12px;
      min-width: 58px;
      min-height: 30px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.58);
      color: #fff;
      display: grid;
      place-items: center;
      padding: 0 10px;
      font-size: 13px;
      font-variant-numeric: tabular-nums;
      z-index: 2;
    }

    .capture-controls {
      position: absolute;
      left: 50%;
      bottom: 12px;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      z-index: 2;
    }

    .capture-button {
      min-height: 42px;
      border: 0;
      border-radius: 999px;
      padding: 0 16px;
      background: rgba(255, 255, 255, 0.92);
      color: #222;
      box-shadow: 0 5px 14px rgba(0, 0, 0, 0.12);
      cursor: pointer;
    }

    .capture-status {
      margin-top: 8px;
      min-height: 18px;
      text-align: center;
      font-size: 12px;
      color: rgba(45, 45, 45, 0.64);
    }

    .audio-panel {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }

    .microphone-mark {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: 2px solid var(--evia-yellow);
      display: grid;
      place-items: center;
      font-size: 28px;
      color: var(--evia-yellow);
    }

    .text-evidence {
      width: 100%;
      flex: 1 1 auto;
      min-height: 120px;
      resize: none;
      border: 0;
      outline: 0;
      background: transparent;
      padding: 14px;
      color: #333;
      font-size: 16px;
      line-height: 1.45;
    }

    .text-save-row {
      display: flex;
      justify-content: center;
      padding: 8px 0 2px;
    }

    .pill,.naxos-pill,.secondary-button,.capture-button,.reflection-pill,.chat-option{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .bottom-arches{position:absolute;left:0;right:0;bottom:0;height:64px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 86px minmax(0,1fr) minmax(0,1fr);align-items:end;gap:4px;padding:0 5px;z-index:8;pointer-events:none}
    .bottom-arches>button{pointer-events:auto}
    .status-arch{width:100%;height:54px;border-radius:58px 58px 0 0;border:1.5px solid rgba(245,196,0,.42);border-bottom:0;background:rgba(250,249,242,.97);box-shadow:0 -4px 14px rgba(0,0,0,.035),inset 0 0 0 1px rgba(255,255,255,.7);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:rgba(45,45,45,.65);padding:8px 3px 3px;cursor:default}
    .status-arch-value{max-width:100%;font-size:12px;line-height:1;font-weight:700;color:rgba(45,45,45,.72);white-space:nowrap;overflow:hidden}
    .status-arch-label{max-width:100%;font-size:9px;line-height:1.05;letter-spacing:.01em;white-space:nowrap;overflow:hidden}
    .bottom-arches .naxos-arch{position:relative;left:auto;bottom:auto;width:86px;height:62px;transform:none;align-self:end}
    .completion-panel{position:absolute;left:50%;top:calc(max(18px,env(safe-area-inset-top)) + 156px);bottom:72px;width:min(calc(100vw - 36px),430px);transform:translateX(-50%);display:none;align-items:flex-start;justify-content:center;z-index:6;pointer-events:none}
    .screen.completion-open .completion-panel{display:flex}
    .reflection-actions,.learn-reflection-box{width:100%;display:flex;flex-direction:column;gap:10px;pointer-events:auto}
    .reflection-actions[hidden],.learn-reflection-box[hidden],.flying-file[hidden]{display:none!important}
    .reflection-pill{width:100%;min-height:52px;border-radius:999px;border:1.5px solid rgba(245,196,0,.35);background:rgba(250,249,242,.96);box-shadow:0 8px 20px rgba(0,0,0,.05),inset 0 0 0 1px rgba(255,255,255,.72);color:rgba(45,45,45,.62);font-size:14px;padding:0 18px;cursor:pointer}
    .learn-reflection-box{border:1.5px solid rgba(245,196,0,.35);background:rgba(250,249,242,.96);border-radius:24px;padding:14px;box-shadow:0 8px 20px rgba(0,0,0,.05),inset 0 0 0 1px rgba(255,255,255,.72)}
    .learn-reflection-box textarea{width:100%;min-height:150px;resize:none;border:0;outline:0;background:transparent;color:#333;font-size:16px;line-height:1.45;padding:8px}
    .learn-reflection-actions{display:flex;justify-content:center}.learn-reflection-status{min-height:18px;text-align:center;font-size:12px;color:rgba(45,45,45,.62)}
    .flying-file{position:fixed;left:50%;top:43%;width:54px;height:68px;transform:translate(-50%,-50%) scale(1);border:2px solid rgba(245,196,0,.75);border-radius:8px;background:rgba(255,255,255,.98);box-shadow:0 10px 26px rgba(0,0,0,.12);opacity:0;pointer-events:none;z-index:40}
    .flying-file::before{content:"";position:absolute;right:-2px;top:-2px;width:18px;height:18px;border-left:2px solid rgba(245,196,0,.75);border-bottom:2px solid rgba(245,196,0,.75);background:#fff;clip-path:polygon(0 0,100% 100%,0 100%)}
    .flying-file::after{content:"";position:absolute;left:11px;right:11px;top:31px;height:2px;background:rgba(245,196,0,.55);box-shadow:0 8px 0 rgba(245,196,0,.38),0 16px 0 rgba(245,196,0,.25)}
    .flying-file.fly{animation:fileToPortfolio 1250ms cubic-bezier(.2,.8,.2,1) forwards}
    @keyframes fileToPortfolio{0%{top:43%;transform:translate(-50%,-50%) scale(.92);opacity:0}14%{opacity:1;transform:translate(-50%,-50%) scale(1)}72%{opacity:1}100%{top:calc(100dvh - 24px);transform:translate(-50%,-50%) scale(.16);opacity:0}}

    .naxos-menu {
      position: absolute;
      left: 50%;
      bottom: calc(max(58px, env(safe-area-inset-bottom) + 58px) + 14px);
      width: min(calc(100vw - 40px), 360px);
      display: flex;
      flex-direction: column;
      gap: 10px;
      opacity: 0;
      visibility: hidden;
      transform: translate(-50%, 18px);
      pointer-events: none;
      transition:
        opacity 300ms ease,
        transform 500ms cubic-bezier(0.22, 1, 0.36, 1),
        visibility 0s linear 500ms;
      z-index: 7;
    }

    .naxos-menu.open {
      opacity: 1;
      visibility: visible;
      transform: translate(-50%, 0);
      pointer-events: auto;
      transition:
        opacity 300ms ease,
        transform 500ms cubic-bezier(0.22, 1, 0.36, 1),
        visibility 0s linear 0s;
    }

    .naxos-pill {
      width: 100%;
      min-height: 48px;
      border-radius: 999px;
      border: 1.5px solid rgba(245, 196, 0, 0.35);
      background: rgba(250, 249, 242, 0.96);
      box-shadow:
        0 8px 20px rgba(0, 0, 0, 0.05),
        inset 0 0 0 1px rgba(255, 255, 255, 0.72);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 18px;
      color: rgba(45, 45, 45, 0.58);
      font-size: 14px;
      letter-spacing: 0.02em;
      cursor: pointer;
    }

    .naxos-arch {
      position: absolute;
      left: 50%;
      bottom: 0;
      width: 124px;
      height: 62px;
      border: 0;
      border-radius: 124px 124px 0 0;
      background: var(--evia-yellow);
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 8;
    }

    .naxos-scan-mark {
      position: relative;
      width: 30px;
      height: 30px;
    }

    .naxos-scan-mark::before,
    .naxos-scan-mark::after {
      content: "";
      position: absolute;
      inset: 0;
      border: 3px solid rgba(255, 255, 255, 0.96);
    }

    .naxos-scan-mark::before {
      clip-path: polygon(0 0, 38% 0, 38% 10%, 10% 10%, 10% 38%, 0 38%, 0 0, 62% 0, 100% 0, 100% 38%, 90% 38%, 90% 10%, 62% 10%);
    }

    .naxos-scan-mark::after {
      clip-path: polygon(0 62%, 10% 62%, 10% 90%, 38% 90%, 38% 100%, 0 100%, 0 62%, 62% 90%, 90% 90%, 90% 62%, 100% 62%, 100% 100%, 62% 100%);
    }

    .naxos-scan-dot {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 8px;
      height: 8px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.96);
      transform: translate(-50%, -50%);
    }

    .overlay-panel {
      position: absolute;
      inset: 0;
      z-index: 20;
      background: rgba(255, 255, 255, 0.98);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 78px 24px 24px;
    }

    .overlay-panel.open { display: flex; }

    .scanner-card,
    .portfolio-card {
      width: min(100%, 430px);
      max-height: calc(100dvh - 120px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .scanner-video-wrap {
      width: min(100%, 360px);
      aspect-ratio: 1 / 1;
      border-radius: 28px;
      overflow: hidden;
      background: #111;
      border: 2px solid rgba(245, 196, 0, 0.55);
    }

    .scanner-video-wrap video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .scanner-status,
    .portfolio-status {
      min-height: 20px;
      font-size: 13px;
      color: rgba(45, 45, 45, 0.66);
      text-align: center;
    }

    .scanner-actions,
    .portfolio-actions {
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    .secondary-button {
      min-height: 44px;
      border: 1.5px solid rgba(245, 196, 0, 0.45);
      border-radius: 999px;
      background: rgba(250, 249, 242, 0.96);
      padding: 0 20px;
      color: rgba(45, 45, 45, 0.72);
      cursor: pointer;
    }

    .portfolio-title {
      font-size: 18px;
      font-weight: 600;
      color: rgba(45, 45, 45, 0.82);
    }

    .portfolio-list {
      width: 100%;
      max-height: 50dvh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .portfolio-item {
      width: 100%;
      border: 1px solid rgba(245, 196, 0, 0.28);
      background: rgba(250, 249, 242, 0.9);
      border-radius: 18px;
      padding: 12px 14px;
    }

    .portfolio-item strong {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: rgba(45, 45, 45, 0.78);
      margin-bottom: 4px;
    }

    .portfolio-item span {
      display: block;
      font-size: 12px;
      line-height: 1.35;
      color: rgba(45, 45, 45, 0.58);
    }

    .portfolio-main {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .portfolio-item[role="button"] { cursor: pointer; }

    .portfolio-viewer {
      width: 100%;
      min-height: 0;
      display: none;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
      padding: 2px 2px 6px;
    }

    .portfolio-viewer.open { display: flex; }

    .portfolio-viewer-meta {
      font-size: 12px;
      line-height: 1.4;
      color: rgba(45, 45, 45, 0.62);
      white-space: pre-wrap;
    }

    .portfolio-preview {
      width: 100%;
      min-height: 160px;
      max-height: 52dvh;
      overflow: auto;
      border: 1px solid rgba(245, 196, 0, 0.28);
      background: rgba(250, 249, 242, 0.9);
      border-radius: 18px;
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .portfolio-preview img,
    .portfolio-preview video { max-width: 100%; max-height: 46dvh; border-radius: 12px; }
    .portfolio-preview audio { width: 100%; }
    .portfolio-preview-text { width: 100%; white-space: pre-wrap; font-size: 14px; line-height: 1.45; color: rgba(45,45,45,.78); }
    .portfolio-edit-textarea { width: 100%; min-height: 220px; resize: vertical; border: 1px solid rgba(245,196,0,.3); border-radius: 16px; padding: 12px; outline: 0; color: #333; background: rgba(250,249,242,.92); font-size: 14px; line-height: 1.45; }
    .portfolio-edit-textarea[hidden] { display: none; }
    .portfolio-viewer-actions { width: 100%; display: flex; justify-content: center; gap: 10px; }

    .evidence-choice.evidence-enter,
    .evidence-requirements.evidence-enter {
      opacity: 0;
      transform: translateY(18px);
      transition:
        opacity 320ms ease,
        transform 460ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .evidence-choice.evidence-enter.reveal-step,
    .evidence-requirements.evidence-enter.reveal-step {
      opacity: 1;
      transform: translateY(0);
    }

    .chat-button {
      position: absolute;
      right: max(14px, env(safe-area-inset-right));
      top: calc(max(14px, env(safe-area-inset-top)) + 8px);
      width: 44px;
      height: 44px;
      border: 0;
      background: transparent;
      display: grid;
      place-items: center;
      cursor: pointer;
      z-index: 15;
    }

    .chat-exit-button {
    position: absolute; right: max(14px, env(safe-area-inset-right));
    top: calc(max(14px, env(safe-area-inset-top)) + 8px);
    min-width: 72px; min-height: 42px; border-radius: 999px;
    border: 1.5px solid rgba(245,196,0,.38); background: rgba(250,249,242,.97);
    color: rgba(45,45,45,.68); padding: 0 16px; display: flex;
    align-items: center; justify-content: center; cursor: pointer; z-index: 31;
  }

  .chat-icon {
      position: relative;
      width: 28px;
      height: 22px;
      border: 2px solid rgba(45, 45, 45, 0.64);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.94);
    }

    .chat-icon::after {
      content: "";
      position: absolute;
      right: 3px;
      bottom: -5px;
      width: 8px;
      height: 8px;
      border-right: 2px solid rgba(45, 45, 45, 0.64);
      border-bottom: 2px solid rgba(45, 45, 45, 0.64);
      background: #fff;
      transform: skewY(-34deg) rotate(18deg);
    }

    .chat-card {
      width: min(100%, 480px);
      height: min(calc(100dvh - 118px), 690px);
      min-height: 360px;
      display: flex;
      flex-direction: column;
      background: #fff;
      border: 1px solid rgba(45, 45, 45, 0.1);
      border-radius: 26px;
      overflow: hidden;
    }

    .chat-header {
      min-height: 54px;
      display: flex;
      align-items: center;
      padding: 0 18px;
      border-bottom: 1px solid rgba(45, 45, 45, 0.08);
      font-size: 15px;
      font-weight: 600;
      color: rgba(45, 45, 45, 0.78);
    }

    .chat-scroll {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      padding: 16px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: rgba(247, 247, 247, 0.72);
    }

    .chat-row {
      width: 100%;
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }

    .chat-row.user {
      justify-content: flex-end;
    }

    .mini-evia {
      width: 32px;
      height: 32px;
      border: 2px solid var(--evia-yellow);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      flex: 0 0 auto;
      animation: miniEviaFloat 1800ms ease-in-out infinite;
    }

    .mini-evia span {
      width: 7px;
      height: 7px;
      border: 1.5px solid var(--evia-yellow);
      border-radius: 50%;
    }

    .chat-bubble {
      max-width: min(78%, 330px);
      border-radius: 18px 18px 18px 5px;
      background: #ececec;
      color: rgba(35, 35, 35, 0.82);
      padding: 10px 13px;
      font-size: 14px;
      line-height: 1.4;
      white-space: pre-wrap;
    }

    .chat-row.user .chat-bubble {
      border-radius: 18px 18px 5px 18px;
      background: rgba(245, 196, 0, 0.19);
    }

    .typing-bubble {
      min-width: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    .typing-bubble i {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(80, 80, 80, 0.55);
      animation: typingDot 1050ms ease-in-out infinite;
    }

    .typing-bubble i:nth-child(2) { animation-delay: 120ms; }
    .typing-bubble i:nth-child(3) { animation-delay: 240ms; }

    .chat-options {
      flex: 0 0 auto;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      padding: 10px 12px 14px;
      border-top: 1px solid rgba(45, 45, 45, 0.08);
      background: #fff;
    }

    .chat-options:empty { display: none; }

    .chat-option {
      min-height: 44px;
      border: 1.5px solid rgba(245, 196, 0, 0.4);
      border-radius: 999px;
      background: rgba(250, 249, 242, 0.98);
      color: rgba(45, 45, 45, 0.72);
      padding: 8px 12px;
      font-size: 13px;
      cursor: pointer;
    }

    @keyframes miniEviaFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-2px); }
    }

    @keyframes typingDot {
      0%, 70%, 100% { transform: translateY(0); opacity: 0.45; }
      35% { transform: translateY(-3px); opacity: 1; }
    }

    .learner-profile {
      width: 100%;
      min-height: 0;
      display: none;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
      padding: 2px 2px 6px;
    }

    .learner-profile.open { display: flex; }

    .profile-field {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .profile-field label {
      font-size: 12px;
      color: rgba(45, 45, 45, 0.64);
      padding-left: 4px;
    }

    .profile-field input {
      width: 100%;
      min-height: 46px;
      border-radius: 16px;
      border: 1.5px solid rgba(245, 196, 0, 0.34);
      background: rgba(250, 249, 242, 0.96);
      color: #333;
      padding: 0 14px;
      font-size: 16px;
      outline: 0;
    }

    .profile-note {
      font-size: 12px;
      line-height: 1.4;
      color: rgba(45, 45, 45, 0.56);
      text-align: center;
    }

    .profile-actions {
      display: flex;
      justify-content: center;
    }

    .profile-status {
      min-height: 18px;
      font-size: 12px;
      color: rgba(45, 45, 45, 0.62);
      text-align: center;
    }

    @keyframes talkingFloat {
      0%, 100% { transform: translateY(0) scale(1); }
      35% { transform: translateY(-5px) scale(1.012); }
      70% { transform: translateY(2px) scale(0.996); }
    }

    @keyframes talkingTilt {
      0%, 100% { transform: rotate(var(--char-tilt)); }
      35% { transform: rotate(calc(var(--char-tilt) - 1.8deg)); }
      70% { transform: rotate(calc(var(--char-tilt) + 1.5deg)); }
    }

    @keyframes speechLineReveal {
    0% { opacity:0; transform:translateX(-8px); -webkit-mask-position:100% 0; mask-position:100% 0; }
    20% { opacity:1; }
    100% { opacity:1; transform:translateX(0); -webkit-mask-position:0% 0; mask-position:0% 0; }
  }

    @keyframes stageFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    @keyframes glowPulse {
      0%, 100% { transform: scale(1.08); opacity: 0.8; }
      50% { transform: scale(1.16); opacity: 1; }
    }

    @keyframes bodyDrift {
      0%, 100% { transform: rotate(0deg) scale(1); }
      25% { transform: rotate(-0.6deg) scale(1.005, 0.995); }
      50% { transform: rotate(0.4deg) scale(0.995, 1.005); }
      75% { transform: rotate(-0.4deg) scale(1.003, 0.997); }
    }

    @keyframes accentWobble {
      0% { transform: rotate(var(--char-tilt)) scale(1); }
      20% { transform: rotate(calc(var(--char-tilt) - 3deg)) scale(1.01); }
      40% { transform: rotate(calc(var(--char-tilt) + 2.4deg)) scale(1.01); }
      60% { transform: rotate(calc(var(--char-tilt) - 1.5deg)) scale(1.005); }
      80% { transform: rotate(calc(var(--char-tilt) + 0.8deg)) scale(1.002); }
      100% { transform: rotate(var(--char-tilt)) scale(1); }
    }

    @keyframes accentSquish {
      0% { transform: rotate(var(--char-tilt)) scale(1); }
      25% { transform: rotate(calc(var(--char-tilt) - 1deg)) scale(1.05, 0.92); }
      55% { transform: rotate(calc(var(--char-tilt) + 1deg)) scale(0.95, 1.06); }
      100% { transform: rotate(var(--char-tilt)) scale(1); }
    }

    @keyframes accentLean {
      0% { transform: translateX(0) rotate(var(--char-tilt)) scale(1); }
      25% { transform: translateX(-0.02em) rotate(calc(var(--char-tilt) - 2deg)) scale(1.01); }
      60% { transform: translateX(0.01em) rotate(calc(var(--char-tilt) + 1deg)) scale(1.005); }
      100% { transform: translateX(0) rotate(var(--char-tilt)) scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      .evia-stage,
      .evia-float,
      .evia-float::before,
      .evia-body,
      .evia-character,
      .eyes,
      .eye,
      .pill-stack,
      .pill,
      .naxos-menu,
      .evia-speech,
      .speech-line-reveal,
      .mini-evia,
      .typing-bubble i,
      .evidence-enter {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <main class="screen" id="screen" aria-label="Evia home">
    <button class="back-button" id="backButton" type="button">Back</button>
    <button class="chat-button" id="chatButton" type="button" aria-label="Open Evia chat">
      <span class="chat-icon" aria-hidden="true"></span>
    </button>

    <div class="evia-stage" id="eviaStage" aria-label="Evia" role="button" tabindex="0">
      <div class="evia-float">
        <div class="evia-character" id="evia" aria-hidden="true">
          <div class="evia-body">
            <div class="eyes">
              <span class="eye"></span>
              <span class="eye"></span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="evia-speech" id="eviaSpeech" aria-live="polite" aria-atomic="true"></div>
    <div class="course-title" id="courseTitle" aria-live="polite"></div>

    <div class="pill-stack" id="pillStack" aria-label="Course menu"></div>

    <section class="evidence-screen" id="evidenceScreen" aria-label="Evidence">
      <div class="evidence-top" id="evidenceTop"></div>
      <div class="evidence-requirements" id="evidenceRequirements">
        <h2 id="requirementsHeading">Evidence Requirements</h2>
        <div id="requirementsText"></div>
      </div>
    </section>

    <section class="completion-panel" id="completionPanel" aria-label="Evidence completion">
      <div class="flying-file" id="flyingFile" hidden aria-hidden="true"></div>
      <div class="reflection-actions" id="reflectionActions" hidden><button class="reflection-pill" id="learnYes" type="button">Yes</button><button class="reflection-pill" id="learnNo" type="button">No</button></div>
      <div class="learn-reflection-box" id="learnReflectionBox" hidden><textarea id="learnReflectionText" aria-label="What did you learn?" placeholder="What did you learn while completing this task?"></textarea><div class="learn-reflection-actions"><button class="capture-button" id="saveLearnReflection" type="button">Save to Learn</button></div><div class="learn-reflection-status" id="learnReflectionStatus"></div></div>
    </section>

    <div class="naxos-menu" id="naxosMenu" aria-label="Naxos QR menu">
      <button class="naxos-pill" type="button" data-naxos-action="send">Send QR Code</button>
      <button class="naxos-pill" type="button" data-naxos-action="scan">Scan QR Code</button>
      <button class="naxos-pill" type="button" data-naxos-action="portfolio">My Portfolio</button>
    </div>

    <div class="bottom-arches" id="bottomArches" aria-label="Learner progress">
      <button class="status-arch" id="timeArch" type="button" aria-label="Time on course" tabindex="-1"><span class="status-arch-value" id="timeArchValue">--</span><span class="status-arch-label">Time</span></button>
      <button class="status-arch" id="courseArch" type="button" aria-label="Course progress" tabindex="-1"><span class="status-arch-value" id="courseArchValue">--</span><span class="status-arch-label">Course</span></button>
      <button class="naxos-arch" id="naxosArch" type="button" aria-label="Open Naxos QR and portfolio menu" aria-expanded="false"><span class="naxos-scan-mark" aria-hidden="true"><span class="naxos-scan-dot"></span></span></button>
      <button class="status-arch" id="attendanceArch" type="button" aria-label="Attendance" tabindex="-1"><span class="status-arch-value" id="attendanceArchValue">--</span><span class="status-arch-label">Attendance</span></button>
      <button class="status-arch" id="learnArch" type="button" aria-label="Learn entries" tabindex="-1"><span class="status-arch-value" id="learnArchValue">0</span><span class="status-arch-label">Learn</span></button>
    </div>

    <div class="overlay-panel" id="scannerPanel" aria-hidden="true">
      <div class="scanner-card">
        <div class="scanner-video-wrap"><video id="scannerVideo" playsinline muted></video></div>
        <div class="scanner-status" id="scannerStatus">Point the camera at a Naxos QR code.</div>
        <div class="scanner-actions">
          <button class="secondary-button" id="qrImageButton" type="button">Upload QR Image</button>
          <input id="qrImageInput" type="file" accept="image/*" hidden>
        </div>
      </div>
    </div>

    <div class="overlay-panel" id="chatPanel" aria-hidden="true">
      <button class="chat-exit-button" id="chatExitButton" type="button">Exit</button>
      <div class="chat-card">
        <div class="chat-header">Evia</div>
        <div class="chat-scroll" id="chatScroll" aria-live="polite"></div>
        <div class="chat-options" id="chatOptions" aria-label="Chat choices"></div>
      </div>
    </div>

    <div class="overlay-panel" id="portfolioPanel" aria-hidden="true">
      <div class="portfolio-card">
        <div class="portfolio-title" id="portfolioTitle">My Portfolio</div>
        <div class="portfolio-main" id="portfolioMain">
          <div class="portfolio-list" id="portfolioList"></div>
          <div class="portfolio-actions">
            <button class="secondary-button" id="learnerProfileButton" type="button">Learner Profile</button>
            <button class="secondary-button" id="downloadPortfolio" type="button">Download ZIP</button>
            <button class="secondary-button" id="uploadPortfolio" type="button">Upload Portfolio</button>
          </div>
          <div class="portfolio-status" id="portfolioStatus"></div>
        </div>

        <div class="portfolio-viewer" id="portfolioViewer">
          <div class="portfolio-viewer-meta" id="portfolioViewerMeta"></div>
          <div class="portfolio-preview" id="portfolioPreview"></div>
          <textarea class="portfolio-edit-textarea" id="portfolioEditTextarea" aria-label="Edit written evidence" hidden></textarea>
          <input id="portfolioEditFileInput" type="file" hidden>
          <div class="portfolio-viewer-actions">
            <button class="secondary-button" id="portfolioEditEvidence" type="button">Edit</button>
            <button class="secondary-button" id="portfolioDeleteEvidence" type="button">Delete</button>
          </div>
          <div class="portfolio-status" id="portfolioViewerStatus"></div>
        </div>

        <form class="learner-profile" id="learnerProfileForm">
          <div class="profile-field">
            <label for="profileFirstName">First name</label>
            <input id="profileFirstName" name="firstName" type="text" autocomplete="given-name">
          </div>
          <div class="profile-field">
            <label for="profileLastName">Last name</label>
            <input id="profileLastName" name="lastName" type="text" autocomplete="family-name">
          </div>
          <div class="profile-field">
            <label for="profileNickname">Nickname (optional)</label>
            <input id="profileNickname" name="nickname" type="text" autocomplete="nickname">
          </div>
          <div class="profile-field">
            <label for="profileStartDate">Course start date</label>
            <input id="profileStartDate" name="startDate" type="date">
          </div>
          <div class="profile-field">
            <label for="profileEndDate">Course end date</label>
            <input id="profileEndDate" name="endDate" type="date">
          </div>
          <div class="profile-field">
            <label for="profileAssessorName">Assessor name</label>
            <input id="profileAssessorName" name="assessorName" type="text" autocomplete="name">
          </div>
          <div class="profile-field">
            <label for="profileAssessorPhone">Assessor phone number</label>
            <input id="profileAssessorPhone" name="assessorPhone" type="tel" autocomplete="tel">
          </div>
          <div class="profile-field">
            <label for="profileSafeguardingPhone">Safeguarding phone number</label>
            <input id="profileSafeguardingPhone" name="safeguardingPhone" type="tel" autocomplete="tel">
          </div>
          <div class="profile-note">Evia uses your nickname when you add one; official evidence uses your first and last name.</div>
          <div class="profile-actions">
            <button class="secondary-button" type="submit">Save Profile</button>
          </div>
          <div class="profile-status" id="profileStatus"></div>
        </form>
      </div>
    </div>
  </main>

  <script>
    const screen = document.getElementById('screen');
    const evia = document.getElementById('evia');
    const eviaStage = document.getElementById('eviaStage');
    const eviaFloat = evia.closest('.evia-float');
    const eviaSpeech = document.getElementById('eviaSpeech');
    const courseTitle = document.getElementById('courseTitle');
    const backButton = document.getElementById('backButton');
    const chatButton = document.getElementById('chatButton');
    const chatExitButton = document.getElementById('chatExitButton');
    const chatPanel = document.getElementById('chatPanel');
    const chatScroll = document.getElementById('chatScroll');
    const chatOptions = document.getElementById('chatOptions');
    const pillStack = document.getElementById('pillStack');
    const evidenceScreen = document.getElementById('evidenceScreen');
    const evidenceTop = document.getElementById('evidenceTop');
    const evidenceRequirements = document.getElementById('evidenceRequirements');
    const requirementsHeading = document.getElementById('requirementsHeading');
    const requirementsText = document.getElementById('requirementsText');
    const naxosMenu = document.getElementById('naxosMenu');
    const naxosArch = document.getElementById('naxosArch');
    const timeArchValue = document.getElementById('timeArchValue');
    const courseArchValue = document.getElementById('courseArchValue');
    const attendanceArchValue = document.getElementById('attendanceArchValue');
    const learnArchValue = document.getElementById('learnArchValue');
    const completionPanel = document.getElementById('completionPanel');
    const flyingFile = document.getElementById('flyingFile');
    const reflectionActions = document.getElementById('reflectionActions');
    const learnYes = document.getElementById('learnYes');
    const learnNo = document.getElementById('learnNo');
    const learnReflectionBox = document.getElementById('learnReflectionBox');
    const learnReflectionText = document.getElementById('learnReflectionText');
    const saveLearnReflection = document.getElementById('saveLearnReflection');
    const learnReflectionStatus = document.getElementById('learnReflectionStatus');
    const scannerPanel = document.getElementById('scannerPanel');
    const scannerVideo = document.getElementById('scannerVideo');
    const scannerStatus = document.getElementById('scannerStatus');
    const qrImageButton = document.getElementById('qrImageButton');
    const qrImageInput = document.getElementById('qrImageInput');
    const portfolioPanel = document.getElementById('portfolioPanel');
    const portfolioTitle = document.getElementById('portfolioTitle');
    const portfolioMain = document.getElementById('portfolioMain');
    const portfolioList = document.getElementById('portfolioList');
    const portfolioStatus = document.getElementById('portfolioStatus');
    const portfolioViewer = document.getElementById('portfolioViewer');
    const portfolioViewerMeta = document.getElementById('portfolioViewerMeta');
    const portfolioPreview = document.getElementById('portfolioPreview');
    const portfolioEditTextarea = document.getElementById('portfolioEditTextarea');
    const portfolioEditFileInput = document.getElementById('portfolioEditFileInput');
    const portfolioEditEvidence = document.getElementById('portfolioEditEvidence');
    const portfolioDeleteEvidence = document.getElementById('portfolioDeleteEvidence');
    const portfolioViewerStatus = document.getElementById('portfolioViewerStatus');
    const learnerProfileButton = document.getElementById('learnerProfileButton');
    const learnerProfileForm = document.getElementById('learnerProfileForm');
    const profileFirstName = document.getElementById('profileFirstName');
    const profileLastName = document.getElementById('profileLastName');
    const profileNickname = document.getElementById('profileNickname');
    const profileStartDate = document.getElementById('profileStartDate');
    const profileEndDate = document.getElementById('profileEndDate');
    const profileAssessorName = document.getElementById('profileAssessorName');
    const profileAssessorPhone = document.getElementById('profileAssessorPhone');
    const profileSafeguardingPhone = document.getElementById('profileSafeguardingPhone');

    async function speak(lines) {
    stopTalking(true); const runId=speechRunId; const cleanLines=lines.filter(Boolean);
    if (!cleanLines.length) return true;
    if (window.matchMedia?.('(prefers-reduced-motion: reduce)').matches) { setSpeech(cleanLines); return true; }
    evia.classList.add('talking'); eviaFloat?.classList.add('talking'); startTalkExpressions();
    root.style.setProperty('--eye-x','0em'); root.style.setProperty('--eye-y','0em');
    for (let i=0;i<cleanLines.length;i+=1) {
      if (runId!==speechRunId) return false;
      const line=document.createElement('div'); line.className='speech-line speech-line-reveal';
      line.textContent=cleanLines[i]; eviaSpeech.appendChild(line); await wait(760);
      if (i<cleanLines.length-1) await wait(170);
    }
    if (runId!==speechRunId) return false; await wait(160); if (runId!==speechRunId) return false;
    stopTalkExpressions(); evia.classList.remove('talking'); eviaFloat?.classList.remove('talking'); blink(true); return true;
  }

    function cleanText(value) {

    function fitTextToElement(element, minimum = 9) {
      if (!element || !element.isConnected || element.offsetParent === null) return;
      const computed = getComputedStyle(element);
      const base = Number(element.dataset.fitBase || parseFloat(computed.fontSize) || 14);
      if (!element.dataset.fitBase) element.dataset.fitBase = String(base);
      element.style.fontSize = `${base}px`;
      let size = base;
      while (size > minimum && element.scrollWidth > element.clientWidth + 1) { size -= .5; element.style.fontSize = `${size}px`; }
    }
    function fitUiText(){requestAnimationFrame(()=>document.querySelectorAll('.pill,.naxos-pill,.secondary-button,.capture-button,.reflection-pill,.chat-option').forEach(el=>fitTextToElement(el)))}
    function startTextFitObserver(){const observer=new MutationObserver(()=>fitUiText());observer.observe(screen,{subtree:true,childList:true,characterData:true});window.addEventListener('resize',fitUiText);fitUiText()}

    function evidenceTypeDisplayLabel(value) {
      const raw = cleanText(value).toLowerCase();
      const labels = {
        video: 'Video', photos: 'Photos', photo: 'Photo', camera: 'Camera',
        audio: 'Audio', microphone: 'Audio', voice: 'Audio', reflection: 'Reflection',
        text: 'Written', written: 'Written', writing: 'Written', document: 'Document',
        witness: 'Witness statement', observation: 'Assessor observation'
      };
      return labels[raw] || cleanText(value);
    }

    function normaliseEvidenceDetail(item) {
      if (!item) return null;
      if (typeof item === 'string') return { displayType: '', label: cleanText(item), instruction: '' };
      if (typeof item !== 'object') return null;
      const rawType = cleanText(item.type || item.method || item.evidenceType);
      return {
        displayType: cleanText(item.displayType || item.typeLabel) || evidenceTypeDisplayLabel(rawType),
        label: cleanText(item.label || item.name || item.title),
        instruction: cleanText(item.instruction || item.description || item.guidance || item.text)
      };
    }

    function normaliseEvidenceOption(option, fallbackLabel) {
      if (!option) return null;
      if (typeof option === 'string') return { label: option.trim() || fallbackLabel, type: 'text', displayType: '', instruction: '', details: [] };
      if (typeof option !== 'object') return null;
      const label = cleanText(option.label || option.name || option.title) || fallbackLabel;
      const rawType = cleanText(option.type || option.method || option.evidenceType).toLowerCase();
      let type = 'text';
      if (['camera', 'video', 'photo', 'photos'].includes(rawType)) type = 'camera';
      if (['audio', 'microphone', 'voice', 'reflection'].includes(rawType)) type = 'audio';
      if (['text', 'written', 'writing'].includes(rawType)) type = 'text';
      const details = Array.isArray(option.details) ? option.details.map(normaliseEvidenceDetail).filter(Boolean) : [];
      return {
        label,
        type,
        displayType: cleanText(option.displayType || option.typeLabel) || evidenceTypeDisplayLabel(rawType),
        instruction: cleanText(option.instruction || option.description || option.guidance || option.text),
        details
      };
    }

    function normaliseNode(node, depth) {
      if (!node) return null;
      if (typeof node === 'string') return { label: node.trim() };
      if (typeof node !== 'object') return null;

      const label = cleanText(node.label || node.name || node.title || node.wording);
      if (!label) return null;

      const rawChildren = node.children || node.items || node.pills || node.sections || node.options || [];
      const children = Array.isArray(rawChildren)
        ? rawChildren.map((child) => normaliseNode(child, depth + 1)).filter(Boolean).slice(0, 5)
        : [];

      const normalised = { label };
      if (children.length && depth < 3) normalised.children = children;

      if (depth >= 3 || !children.length) {
        const recommendedSource = node.recommended || node.recommendedEvidence || (Array.isArray(node.preferred) ? {
          label: node.preferred.map((item) => cleanText(item?.label || item?.type)).filter(Boolean).join(' + '),
          type: node.preferred[0]?.type, details: node.preferred
        } : null);
        const alternativeSource = node.alternative || node.alternativeEvidence || (Array.isArray(node.alternatives) && node.alternatives.length ? {
          label: cleanText(node.alternatives[0]?.label) || 'Alternative',
          type: node.alternatives[0]?.type, details: node.alternatives
        } : null);
        normalised.recommended = normaliseEvidenceOption(recommendedSource, 'Recommended');
        normalised.alternative = normaliseEvidenceOption(alternativeSource, 'Alternative');

        const requirementObject = node.evidenceRequirements && typeof node.evidenceRequirements === 'object' && !Array.isArray(node.evidenceRequirements) ? node.evidenceRequirements : null;
        const rawRequirementItems = node.requirementItems || node.requirementsItems || node.capture || requirementObject?.items || requirementObject?.bullets || (Array.isArray(node.evidenceRequirements) ? node.evidenceRequirements : []);
        const requirementItems = Array.isArray(rawRequirementItems) ? rawRequirementItems.map(cleanText).filter(Boolean) : [];
        const requirementText = cleanText(node.requirements || (typeof node.evidenceRequirements === 'string' ? node.evidenceRequirements : '') || node.evidence || node.guidance);
        normalised.requirementsHeading = cleanText(node.requirementsHeading || requirementObject?.heading || requirementObject?.title);
        normalised.requirementItems = requirementItems;
        normalised.requirements = requirementItems.length ? requirementItems.join('\n') : requirementText;
        const rawTeachingPoints = node.teachingPoints || node.didYouKnow || node.teach || [];
        if (Array.isArray(rawTeachingPoints)) {
          normalised.teachingPoints = rawTeachingPoints.map(cleanText).filter(Boolean).slice(0, 3);
        }
      }

      return normalised;
    }

    function normaliseCoursePayload(payload) {
      const rootData = payload && typeof payload === 'object' && payload.course ? payload.course : payload;
      if (!rootData || typeof rootData !== 'object') return null;
      const rawItems = rootData.items || rootData.menu || rootData.sections || rootData.pills || rootData.children;
      if (!Array.isArray(rawItems)) return null;
      const items = rawItems.map((item) => normaliseNode(item, 1)).filter(Boolean).slice(0, 5);
      return items.length ? items : null;
    }

    function getItemsAtPath(path) {
      let items = courseItems;
      for (const index of path) {
        const node = items[index];
        if (!node || !Array.isArray(node.children)) return [];
        items = node.children;
      }
      return items.slice(0, 5);
    }

    function getLabelsForPath(path) {
      let items = courseItems;
      const labels = [];
      for (const index of path) {
        const node = items[index];
        if (!node) break;
        labels.push(node.label);
        items = Array.isArray(node.children) ? node.children : [];
      }
      return labels;
    }

    function evidencePathKey(path) {
      return JSON.stringify((Array.isArray(path) ? path : []).map(cleanText));
    }

    function loadCompletedEvidencePaths() {
      try {
        const saved = JSON.parse(localStorage.getItem('eviaCompletedEvidencePathsV1') || '[]');
        return new Set(Array.isArray(saved) ? saved.filter((item) => typeof item === 'string') : []);
      } catch (error) {
        return new Set();
      }
    }

    function saveCompletedEvidencePaths() {
      try {
        localStorage.setItem('eviaCompletedEvidencePathsV1', JSON.stringify([...completedEvidencePaths]));
      } catch (error) {
        // Completion still remains active for this session.
      }
    }

    function markEvidencePathComplete(path) {
      const key = evidencePathKey(path);
      if (key === '[]') return;
      completedEvidencePaths.add(key);
      saveCompletedEvidencePaths();
    }

    function clearEvidencePathComplete(path) {
      const key = evidencePathKey(path);
      if (key === '[]') return;
      completedEvidencePaths.delete(key);
      saveCompletedEvidencePaths();
    }

    function leafEvidencePaths(node, prefix) {
      const path = [...prefix, cleanText(node?.label)];
      const children = Array.isArray(node?.children) ? node.children.filter(Boolean) : [];
      if (!children.length) return [path];
      return children.flatMap((child) => leafEvidencePaths(child, path));
    }

    function pillCompletion(node, prefix) {
      const leaves = leafEvidencePaths(node, prefix);
      const total = leaves.length || 1;
      const completed = leaves.reduce((sum, path) => sum + (completedEvidencePaths.has(evidencePathKey(path)) ? 1 : 0), 0);
      return { completed, total, complete: completed >= total };
    }

    function renderPills(floatIn = false) {
      pillStack.innerHTML = '';
      const prefix = getLabelsForPath(menuPath);
      currentItems.forEach((item, index) => {
        const pill = document.createElement('div');
        pill.className = `pill${floatIn ? ' float-in' : ''}`;
        pill.dataset.index = String(index);
        pill.setAttribute('role', 'button');
        pill.setAttribute('tabindex', '0');

        const label = document.createElement('span');
        label.className = 'pill-label';
        label.textContent = item.label;
        pill.appendChild(label);

        const progress = pillCompletion(item, prefix);
        const mark = document.createElement('span');
        mark.setAttribute('aria-hidden', 'true');
        if (progress.complete) {
          mark.className = 'pill-progress-mark pill-progress-tick';
          mark.textContent = '✓';
        } else {
          mark.className = 'pill-progress-mark pill-progress-ring';
          mark.style.setProperty('--pill-progress', `${(progress.completed / progress.total) * 360}deg`);
        }
        pill.appendChild(mark);
        pill.setAttribute('aria-label', progress.complete ? `${item.label}, complete` : `${item.label}, ${progress.completed} of ${progress.total} complete`);
        pillStack.appendChild(pill);
      });

      if (floatIn) {
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            pillStack.querySelectorAll('.pill').forEach((pill) => pill.classList.remove('float-in'));
          });
        });

      updateBackButton();

    function openNextPillSet(selectedPill) {
      if (pillTransitionBusy) return;
      const selectedIndex = Number(selectedPill.dataset.index);
      const node = selectedNode(selectedIndex);
      if (!node) return;

      const opensEvidence = menuLevel >= 3 || !Array.isArray(node.children) || !node.children.length;
      pillTransitionBusy = true;
      const sourceLevel = menuLevel;
      const sourcePath = menuPath.join('.');
      const pills = [...pillStack.querySelectorAll('.pill')];
      pills.forEach((pill) => {
        if (pill !== selectedPill) pill.classList.add('fade-out');
      });

      setTimeout(() => {
        selectedPill.classList.add('fade-out');
        setTimeout(async () => {
          if (
            !screen.classList.contains('active') ||
            screen.classList.contains('evidence-open') ||
            menuLevel !== sourceLevel ||
            menuPath.join('.') !== sourcePath
          ) {
            pillTransitionBusy = false;
            return;
          }

          if (opensEvidence) {
            activeEvidencePath = [...getLabelsForPath(menuPath), node.label];
            pillTransitionBusy = false;
            await openEvidence(node);
            return;
          }

          menuPath.push(selectedIndex);
          menuLevel += 1;
          currentItems = node.children.slice(0, 5);
          screen.classList.remove('pills-ready');
          const targetLevel = menuLevel;
          const speechPromise = speak(menuSpeechLines(targetLevel));
          renderPills(true);
          screen.classList.add('pills-ready');
          const finished = await speechPromise;
          if (!finished || menuLevel !== targetLevel || screen.classList.contains('evidence-open')) {
            pillTransitionBusy = false;
            return;
          }
          pillTransitionBusy = false;
        }, 260);
      }, 260);
    }

    function resetPills() {
      menuLevel = 1;

    function appendEvidenceChoiceContent(button, heading, option) {
      const headingElement = document.createElement('div');
      headingElement.className = 'evidence-choice-heading';
      headingElement.textContent = heading;
      button.appendChild(headingElement);
      const details = Array.isArray(option?.details) && option.details.length
        ? option.details
        : [{ displayType: option?.displayType || '', label: option?.label || '', instruction: option?.instruction || '' }];
      details.forEach((detail) => {
        const cleanDetail = normaliseEvidenceDetail(detail);
        if (!cleanDetail) return;
        const wrap = document.createElement('div');
        wrap.className = 'evidence-choice-detail';
        if (cleanDetail.displayType) {
          const el = document.createElement('div'); el.className = 'evidence-choice-type'; el.textContent = cleanDetail.displayType; wrap.appendChild(el);
        }
        if (cleanDetail.label) {
          const el = document.createElement('div'); el.className = 'evidence-choice-label'; el.textContent = cleanDetail.label; wrap.appendChild(el);
        }
        if (cleanDetail.instruction) {
          const el = document.createElement('div'); el.className = 'evidence-choice-instruction'; el.textContent = cleanDetail.instruction; wrap.appendChild(el);
        }
        button.appendChild(wrap);
      });
    }

    function renderEvidenceChoices(animateIn = false) {
      stopCapture();
      captureMode = null;
      activeEvidenceMethod = null;
      evidenceTop.innerHTML = '';
      const choices = [
        ['Recommended', activeEvidence?.recommended],
        ['Alternative', activeEvidence?.alternative]
      ].filter(([, option]) => option && (cleanText(option.label) || (Array.isArray(option.details) && option.details.length)));
      choices.forEach(([heading, option]) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = `evidence-choice${animateIn ? ' evidence-enter' : ''}`;
        button.dataset.evidenceType = option.type || 'text';
        button.dataset.evidenceHeading = heading;
        button.dataset.evidenceLabel = option.label || heading;
        button.dataset.evidenceChoice = heading === 'Alternative' ? 'alternative' : 'recommended';
        appendEvidenceChoiceContent(button, heading, option);
        evidenceTop.appendChild(button);
      });
      evidenceTop.style.gridTemplateRows = choices.length === 1 ? 'auto' : 'auto auto';
      if (!animateIn) evidenceRequirements.classList.remove('evidence-enter', 'reveal-step');
      updateBackButton();
      return [...evidenceTop.querySelectorAll('.evidence-choice')];
    }

    async function revealEvidenceOptions() {
      const choices = renderEvidenceChoices(true);
      const requirementsVisible = evidenceRequirements.style.display !== 'none';
      evidenceRequirements.classList.toggle('evidence-enter', requirementsVisible);
      evidenceRequirements.classList.remove('reveal-step');
      screen.classList.add('evidence-ready');

      for (const choice of choices) {
        await wait(180);
        if (!screen.classList.contains('evidence-open')) return false;
        choice.classList.add('reveal-step');
        await wait(250);
      }

      if (requirementsVisible) {
        await wait(160);
        if (!screen.classList.contains('evidence-open')) return false;
        evidenceRequirements.classList.add('reveal-step');
      }
      return true;
    }

    function renderEvidenceRequirements(node) {
      const items = Array.isArray(node?.requirementItems) ? node.requirementItems.map(cleanText).filter(Boolean) : [];
      const text = cleanText(node?.requirements);
      const hasRequirements = items.length > 0 || Boolean(text);
      requirementsHeading.textContent = cleanText(node?.requirementsHeading) || (items.length ? 'What the evidence must show or explain' : 'Evidence Requirements');
      requirementsText.innerHTML = '';
      if (items.length) {
        const list = document.createElement('ul');
        items.forEach((item) => { const li = document.createElement('li'); li.textContent = item; list.appendChild(li); });

      return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;

    function openPortfolioDb() {
      return new Promise((resolve, reject) => {
        if (!('indexedDB' in window)) {
          reject(new Error('IndexedDB unavailable'));
          return;
        }
        const request = indexedDB.open('EviaPortfolio', 1);
        request.onupgradeneeded = () => {
          const db = request.result;
          if (!db.objectStoreNames.contains('evidence')) {
            const store = db.createObjectStore('evidence', { keyPath: 'id' });
            store.createIndex('createdAt', 'createdAt');
          }
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    async function addPortfolioEntry(entry) {
      const db = await openPortfolioDb();
      return new Promise((resolve, reject) => {
        const tx = db.transaction('evidence', 'readwrite');
        tx.objectStore('evidence').put(entry);
        tx.oncomplete = () => { db.close(); resolve(entry); };
        tx.onerror = () => { db.close(); reject(tx.error); };
      });
    }

    async function getPortfolioEntries() {
      const db = await openPortfolioDb();
      return new Promise((resolve, reject) => {
        const tx = db.transaction('evidence', 'readonly');
        const request = tx.objectStore('evidence').getAll();
        request.onsuccess = () => resolve((request.result || []).sort((a, b) => b.createdAt.localeCompare(a.createdAt)));
        request.onerror = () => reject(request.error);
        tx.oncomplete = () => db.close();
      });
    }

      return new Promise((resolve, reject) => {
        const tx = db.transaction('evidence', 'readwrite');

    function safeFilename(value) {
      return cleanText(value)
        .replace(/[^a-z0-9-_]+/gi, '-')

    function extensionForMime(mimeType, type) {
      if (type === 'text') return 'txt';
      if (type === 'photo') return /png/i.test(mimeType) ? 'png' : 'jpg';
      if (/mp4/i.test(mimeType)) return 'mp4';
      if (/ogg/i.test(mimeType)) return 'ogg';

    async function saveEvidenceBlob(blob, type, savedContext = null) {
      const createdAt = new Date().toISOString();
      const context = savedContext || captureEvidenceContext(type);
      const method = context.method;

      const extension = extensionForMime(blob.type, type);

      const entry = {
        id: `${Date.now()}-${Math.random().toString(36).slice(2, 9)}`,

        fileName: `${compactDate}-${safeFilename(label)}.${extension}`,
        path: context.path.slice(),

    function stripEvidenceConditionals(value) {
      return cleanText(value)
        .replace(/\bif\s+(?:a\s+)?video\s+is\s+not\s+practical\b[:,]?\s*/ig, '')
        .replace(/\bif\s+(?:a\s+)?video\s+(?:is\s+)?not\s+possible\b[:,]?\s*/ig, '')
        .trim();
    }

    function captureKindFromText(value, fallbackType = '') {
      const text = stripEvidenceConditionals(value).toLowerCase();
      if (/\bwitness\s+(?:testimony|statement)\b|\btestimony\b/.test(text)) return 'witness';
      const hasAudio = /\baudio\b|\bvoice\b|\bmicrophone\b|\breflection\b/.test(text);
      const hasWritten = /\bwritten\b|\bwrite\b|\btext\b|\btyping\b/.test(text);
      if (hasAudio && hasWritten && /\bor\b/.test(text)) return 'audio-or-text';
      if (/\bphotos?\b|\bcamera\b|\bimages?\b/.test(text)) return 'photo';
      if (/\bvideo\b/.test(text)) return 'video';
      if (hasAudio) return 'audio';
      if (hasWritten) return 'text';
      if (fallbackType === 'camera') return 'photo';
      if (fallbackType === 'audio') return 'audio';
      if (fallbackType === 'video') return 'video';
      if (fallbackType === 'witness') return 'witness';
      return fallbackType === 'text' ? 'text' : '';
    }

    function captureKindsFromDetail(detail, fallbackType = 'text') {
      const source = stripEvidenceConditionals(`${detail?.label || ''} ${detail?.instruction || ''}`);
      const additiveParts = source.split(/\b(?:plus|then|followed by)\b/i).map((part) => part.trim()).filter(Boolean);
      const parts = additiveParts.length > 1 ? additiveParts : [source];
      const kinds = parts.map((part) => captureKindFromText(part, '')).filter(Boolean);
      if (kinds.length) return kinds;
      const displayKind = captureKindFromText(detail?.displayType || '', '');
      return displayKind ? [displayKind] : [captureKindFromText(source, fallbackType) || 'text'];
    }

    function captureQuantity(detail, type) {
      const label = cleanText(detail?.label);
      const instruction = cleanText(detail?.instruction);
      const source = `${label} ${instruction}`;
      if (type === 'witness' || type === 'audio-or-text') return 1;
      const words = type === 'photo' ? 'photos?|images?'
        : type === 'video' ? 'videos?|recordings?'
        : type === 'audio' ? 'audio|recordings?|voice notes?'
        : 'written|text|statements?|entries';
      const direct = source.match(new RegExp(`\\b(\\d+)\\s*(?:x\\s*)?(?:-|\\s)?(?:${words})\\b`, 'i'));
      const leading = label.match(/^\s*(\d+)\b/);
      const raw = Number(direct?.[1] || leading?.[1] || 1);
      return Number.isFinite(raw) ? Math.max(1, Math.min(12, raw)) : 1;
    }

    function buildCapturePlan(option) {
      const details = Array.isArray(option?.details) && option.details.length
        ? option.details
        : [{ displayType: option?.displayType || '', label: option?.label || '', instruction: option?.instruction || '' }];
      const fallback = option?.type || 'text';
      const steps = [];
      details.forEach((detail) => {
        const cleanDetail = normaliseEvidenceDetail(detail) || detail || {};
        const types = captureKindsFromDetail(cleanDetail, fallback);
        types.forEach((type) => {
          const quantity = captureQuantity(cleanDetail, type);
          for (let index = 0; index < quantity; index += 1) {
            steps.push({ type, label: cleanText(cleanDetail.label) || evidenceTypeDisplayLabel(type), instruction: cleanText(cleanDetail.instruction), itemIndex: index + 1, itemTotal: quantity });
          }
        });
      });
      if (!steps.length) steps.push({ type: fallback === 'audio' ? 'audio' : fallback === 'camera' ? 'photo' : 'text', label: option?.label || 'Evidence', instruction: '', itemIndex: 1, itemTotal: 1 });
      return steps;
    }

    function clearCaptureSequence() {
      captureSessionId += 1;

    function captureStepStatus(step) {
      const typeName = step.type === 'photo' ? 'Photo'
        : step.type === 'video' ? 'Video'
        : step.type === 'audio' ? 'Audio'
        : step.type === 'witness' ? 'Witness testimony'
        : step.type === 'audio-or-text' ? 'Audio or written evidence'
        : 'Written evidence';
      if (step.itemTotal > 1) return `${typeName} ${step.itemIndex} of ${step.itemTotal}`;
      if (capturePlan.length > 1) return `${typeName} · step ${captureStepIndex + 1} of ${capturePlan.length}`;
      return typeName;
    }

        return;
      }
      await completeEvidenceExperience();
    }

    function witnessFileExtension(file) {

      const mime = cleanText(file?.type).toLowerCase();
      if (/pdf/.test(mime)) return 'pdf';
      if (/wordprocessingml/.test(mime)) return 'docx';
      if (/msword/.test(mime)) return 'doc';
      if (/png/.test(mime)) return 'png';
      if (/jpe?g/.test(mime)) return 'jpg';
      if (/text\//.test(mime)) return 'txt';
      return 'file';
    }
