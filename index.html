<style>:root{
 --ink:#101828;--muted:#667085;--line:#e7ebf0;--bg:#f5f7fa;--yellow:#e4b600;
 --soft:#fff8d7;--panel:#ffffff;--shadow:0 12px 32px rgba(16,24,40,.07);
}
html{background:#f5f7fa}
body{background:radial-gradient(circle at 100% -10%,#fff4c9 0,transparent 28rem),linear-gradient(180deg,#fff 0,#f5f7fa 72%);-webkit-font-smoothing:antialiased}
#app{padding-bottom:112px}
.topbar{height:112px;padding:25px 26px 14px;background:rgba(255,255,255,.78);backdrop-filter:blur(24px) saturate(150%);-webkit-backdrop-filter:blur(24px) saturate(150%);border-bottom:1px solid rgba(226,231,238,.82)}
.version{font-size:11px;letter-spacing:.12em;color:#a1a9b5;margin-bottom:9px}
h1{font-size:26px;letter-spacing:-.04em}
.profile-btn{width:42px;height:42px;border:1px solid #e4e8ed;box-shadow:0 3px 10px rgba(16,24,40,.06);font-size:18px}
.screen{width:min(100%,760px);padding:18px 22px 36px}
.bottom-nav{left:16px;right:16px;bottom:max(14px,env(safe-area-inset-bottom));height:76px;border:1px solid rgba(232,235,239,.9);border-radius:38px;box-shadow:0 16px 36px rgba(16,24,40,.13),0 2px 8px rgba(16,24,40,.04);background:rgba(255,255,255,.94);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);grid-template-columns:1fr 1fr 72px 1fr 1fr}
.bottom-nav button{height:66px;gap:6px;font-size:11px;letter-spacing:-.01em;color:#a0aaba;transition:color .2s ease,transform .2s ease}
.bottom-nav button.active{color:#172033}
.bottom-nav button:active{transform:scale(.94)}
.nav-icon{width:25px;height:21px}
.evia-fab{bottom:51px;width:48px;height:48px;border-width:3px;box-shadow:0 9px 20px rgba(16,24,40,.10);animation:eviaFloat 4.8s ease-in-out infinite;transition:transform .2s ease}
.evia-fab:active{transform:translateX(-50%) scale(.92)}
.evia-fab:after{left:10px;right:10px;bottom:-6px;height:7px;opacity:.55}
.evia-face{gap:5px}
.evia-face i{width:11px;height:14px;border:2.5px solid var(--yellow);border-radius:50%;transform-origin:center}
.evia-face i:after{display:none}
.evia-face i:first-child{animation:eyeLookA 7s ease-in-out infinite}
.evia-face i:nth-child(2){animation:eyeLookB 7s ease-in-out infinite}
@keyframes eyeLookA{0%,12%{transform:translate(0,0) rotate(0)}20%,31%{transform:translate(4px,1px) rotate(8deg)}40%,50%{transform:translate(-3px,-2px) rotate(-7deg)}61%,72%{transform:translate(2px,2px) rotate(5deg)}82%,100%{transform:translate(0,0) rotate(0)}}
@keyframes eyeLookB{0%,12%{transform:translate(0,0) rotate(0)}20%,31%{transform:translate(4px,1px) rotate(8deg)}40%,50%{transform:translate(-3px,-2px) rotate(-7deg)}61%,72%{transform:translate(2px,2px) rotate(5deg)}82%,100%{transform:translate(0,0) rotate(0)}}
@keyframes eviaFloat{0%,80%,100%{transform:translateX(-50%) translateY(0)}84%{transform:translateX(-50%) translateY(-7px)}88%{transform:translateX(-50%) translateY(0)}}
.card{border:1px solid rgba(226,231,238,.96);border-radius:20px;padding:17px;box-shadow:0 5px 18px rgba(16,24,40,.04);margin-bottom:10px}
.card h2{font-size:20px;letter-spacing:-.025em}
.card p{font-size:14px;color:#667085}
.course-picker{gap:7px;padding:2px 1px 10px;scrollbar-width:none}
.course-picker::-webkit-scrollbar{display:none}
.pill{padding:9px 13px;border-radius:18px;font-size:12px;background:rgba(255,255,255,.9);transition:all .2s}
.pill.active{background:#fff8d8;border-color:#ead277;color:#675600}
.unit-card{min-height:74px;padding:16px;transition:transform .15s,box-shadow .15s}
.unit-card:active{transform:scale(.985);box-shadow:none}
.unit-title{font-size:16px;letter-spacing:-.015em}
.unit-number{font-size:10px;letter-spacing:.09em;font-weight:700}
.arrow{font-size:25px;font-weight:300}
.section-title{font-size:10px;letter-spacing:.12em;margin:22px 2px 9px;color:#9aa3af}
.guidance{background:linear-gradient(180deg,#fffbed,#fff9df);border:1px solid #f1e5ac;border-radius:18px;padding:16px}
.guidance ul{font-size:13px;color:#665e42}
.dropzone{background:#fff;border:1px dashed #d9dee5;border-radius:17px;padding:22px 16px;color:#7e8999;transition:border .2s,background .2s}
.dropzone:active{background:#fafbfc}
.photo-grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
.thumb{border-radius:11px}
textarea,.learning-input input,.chat-row input{background:#fff;border:1px solid #dfe4ea;box-shadow:inset 0 1px 2px rgba(16,24,40,.02);font-size:14px;outline:none;transition:border .2s,box-shadow .2s}
textarea:focus,.learning-input input:focus,.chat-row input:focus{border-color:#bfc7d2;box-shadow:0 0 0 3px rgba(16,24,40,.04)}
textarea{min-height:170px}
.primary{border-radius:14px;background:linear-gradient(135deg,#182235,#111827);padding:13px 18px;box-shadow:0 7px 16px rgba(16,24,40,.16);transition:transform .15s,opacity .15s}
.primary:active{transform:scale(.98);opacity:.9}
.secondary{border-radius:13px;background:#f2f4f7;padding:11px 15px;font-size:13px}
.secondary:disabled{cursor:not-allowed;opacity:.48}
.portfolio-intro{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;background:linear-gradient(135deg,#fff 0%,#fffdf4 100%)}
.portfolio-intro .section-title{margin-top:0}
.pdf-button{flex:0 0 auto;background:#172033;color:#fff;box-shadow:0 5px 12px rgba(16,24,40,.12)}
.code{min-width:36px;font-size:10px;padding:5px 6px}
.ksbtext{font-size:12.5px;line-height:1.48}
.status{white-space:nowrap}
.overlay{background:rgba(15,23,42,.20);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.sheet{padding:20px 20px max(20px,env(safe-area-inset-bottom));border-radius:26px 26px 0 0;box-shadow:0 -18px 45px rgba(16,24,40,.16)}
.chat{background:#f7f8fa}
@media(max-width:520px){
 .screen{padding-left:17px;padding-right:17px}
 .topbar{padding-left:21px;padding-right:21px}
 .bottom-nav{left:10px;right:10px}
}
@media(min-width:800px){.bottom-nav{max-width:680px;left:50%;right:auto;width:680px;transform:translateX(-50%)}}
@media(prefers-reduced-motion:reduce){
 .evia-fab,.evia-face i{animation:none!important}
 *,*::before,*::after{scroll-behavior:auto!important;transition:none!important}
}

/* Refined app-wide UI: quiet hierarchy, compact controls and consistent profile surfaces. */
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Roboto,Arial,sans-serif;letter-spacing:-.01em}
.topbar{box-shadow:0 1px 0 rgba(16,24,40,.025)}
.topbar h1{font-weight:700}
.screen{padding-top:16px}
.card{background:rgba(255,255,255,.92);box-shadow:0 2px 12px rgba(16,24,40,.035)}
.card p{line-height:1.45}
.primary,.secondary,.pill,.chat-pill,.rating-pill,.stage-camera{transition:transform .16s ease,box-shadow .16s ease,background .16s ease}
.primary:hover,.secondary:hover,.pill:hover,.chat-pill:hover,.rating-pill:hover,.stage-camera:hover{box-shadow:0 4px 12px rgba(16,24,40,.07)}
.profile-overlay{position:fixed;z-index:70;inset:0;background:rgba(15,23,42,.22);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;align-items:flex-end;justify-content:center}
.profile-sheet{width:min(760px,100%);max-height:92vh;overflow:auto;background:rgba(255,255,255,.98);border:1px solid rgba(226,231,238,.9);border-radius:28px 28px 0 0;padding:22px 22px max(24px,env(safe-area-inset-bottom));box-shadow:0 -20px 55px rgba(16,24,40,.16)}
.profile-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px}
.profile-kicker{font-size:10px;letter-spacing:.13em;color:#9aa3af;font-weight:800}
.profile-head h2{margin:4px 0 0;font-size:23px;letter-spacing:-.035em}
.profile-close{width:36px;height:36px;border-radius:50%;background:#f2f4f7;color:#687386;font-size:22px;line-height:1}
.profile-avatar-row{display:flex;align-items:center;gap:15px;padding:14px;border:1px solid #edf0f3;border-radius:20px;background:#fafbfc;margin-bottom:18px}
.profile-photo{width:72px;height:72px;flex:0 0 72px;border-radius:50%;display:block;object-fit:cover;border:2px solid #fff;box-shadow:0 4px 14px rgba(16,24,40,.10);background:#f1f3f6}
.profile-placeholder{display:grid;place-items:center;color:#98a2b3;font-size:26px}
.profile-avatar-row strong{display:block;font-size:14px}
.profile-avatar-row p{margin:4px 0 10px;font-size:12px;color:#7b8797}
.profile-upload{display:inline-flex;align-items:center;justify-content:center;padding:9px 12px;border-radius:12px;background:#172033;color:#fff;font-size:12px;font-weight:700;cursor:pointer}
.profile-upload input{display:none}
.profile-fields{display:grid;gap:12px}
.profile-fields label,.profile-dates label{display:grid;gap:7px;font-size:11px;font-weight:750;color:#667085}
.profile-fields input{width:100%;min-height:44px;border:1px solid #dfe4ea;border-radius:13px;padding:10px 12px;background:#fff;outline:none}
.profile-dates{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.profile-block{margin-top:22px}
.profile-block>p{font-size:12px;color:#7b8797;line-height:1.5}
.course-options{display:grid;gap:7px;margin-top:9px}
.course-option{width:100%;display:flex;justify-content:space-between;align-items:center;padding:13px 14px;border:1px solid #e5e9ee;border-radius:14px;background:#fff;text-align:left;font-size:13px;font-weight:650}
.course-option.selected{border-color:#ead277;background:#fffbed}
.signature-wrap{position:relative;margin-top:9px;border:1px solid #dfe4ea;border-radius:16px;overflow:hidden;background:#fff}
#signature-pad{display:block;width:100%;height:auto;touch-action:none}
#clear-signature{position:absolute;right:9px;top:9px;padding:7px 10px;border-radius:10px;background:#f2f4f7;font-size:11px;font-weight:700;color:#667085}
.profile-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:22px}
.profile-actions button{width:100%}
@media(max-width:520px){
 .profile-sheet{padding-left:17px;padding-right:17px;border-radius:24px 24px 0 0}
 .profile-avatar-row{padding:12px}
 .profile-photo{width:64px;height:64px;flex-basis:64px}
}

/* Signal-strength evidence indicator and refined navigation. */
.unit-strength-bars{
  display:inline-flex;
  align-items:flex-end;
  gap:4px;
  height:22px;
  padding:2px 0;
}
.signal-bar{
  display:block;
  width:7px;
  border-radius:2px;
  background:#e7ebf0;
  transition:background .2s ease,transform .2s ease;
}
.signal-bar-1{height:8px}
.signal-bar-2{height:14px}
.signal-bar-3{height:20px}
.signal-bar.filled{background:var(--yellow)}
.bottom-nav{
  height:72px;
  border-radius:36px;
  grid-template-columns:1fr 1fr 66px 1fr 1fr;
  padding:3px 7px;
  box-shadow:0 12px 30px rgba(16,24,40,.11),0 2px 7px rgba(16,24,40,.035);
}
.bottom-nav button{
  height:64px;
  gap:5px;
  border-radius:30px;
  color:#9ba5b3;
  font-size:10px;
  font-weight:650;
  transition:color .18s ease,background .18s ease,transform .18s ease;
}
.bottom-nav button.active{
  color:var(--yellow);
  background:#fffaf0;
}
.bottom-nav button.active .nav-icon{
  transform:translateY(-1px) scale(1.04);
}
.nav-icon{
  width:23px;
  height:21px;
  transition:transform .18s ease,color .18s ease;
}
.book,.folder,.bookmark{border-width:1.8px}
.book:after{border-left-width:1.8px}
.folder:before{border-width:1.8px;border-bottom:0}
.bars{border-bottom-width:1.8px}
.bars:before,.bars:after{border-width:1.8px;border-bottom:0}
.bookmark{border-width:1.8px;border-bottom:0}
.bookmark:after{border-left-width:1.8px;border-bottom-width:1.8px}
.bottom-nav button:active{transform:scale(.96)}
@media(max-width:520px){
 .bottom-nav{height:70px;border-radius:35px;padding:3px 6px}
 .bottom-nav button{height:62px;font-size:10px}
 .nav-icon{width:22px;height:20px}
}

/* Progress overview and apprentice-friendly KSB grid. */
.progress-overview{padding:18px}
.progress-metric{margin:16px 0}
.progress-metric-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:7px}
.progress-metric-head strong{font-size:14px;letter-spacing:-.015em}
.progress-metric-head span{font-size:11px;color:#7d8795;text-align:right}
.progress-track{height:9px;border-radius:999px;background:#edf0f3;overflow:hidden}
.progress-track span{display:block;height:100%;border-radius:inherit;background:var(--yellow);transition:width .35s ease}
.progress-note{margin-top:14px;padding-top:13px;border-top:1px solid #eef0f3;font-size:11px;line-height:1.45;color:#7d8795}
.ksb-overview{padding:18px}
.ksb-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:14px}
.ksb-tile{position:relative;min-width:0;aspect-ratio:1.35;border:1px solid #e3e7ed;background:#f8f9fb;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#657184;font-weight:750;font-size:13px;cursor:pointer;transition:transform .16s ease,background .16s ease,border-color .16s ease}

.ksb-grid-help{margin:13px 0 0;color:#8a94a3;font-size:11px;text-align:center}
.ksb-modal-overlay{position:fixed;inset:0;z-index:3000;background:rgba(20,28,42,.22);display:flex;align-items:flex-end;justify-content:center;padding:14px}

.ksb-modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
.ksb-modal-head h2{margin:3px 0 0;font-size:21px}
.ksb-modal-section{padding:14px 0;border-top:1px solid #edf0f3}
.ksb-modal-section p{margin:7px 0 0;line-height:1.5}
.ksb-evidence-item{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid #f0f2f4}
.ksb-evidence-item:last-child{border-bottom:0}
.ksb-evidence-item span{font-size:11px;color:#8a94a3;text-align:right}
.ksb-empty{color:#8a94a3}

.ksb-met{color:#2f7d3b;font-weight:750}
.ksb-not-met{color:#9a6b00;font-weight:700}
@media(max-width:520px){
 .progress-metric-head{display:block}
 .progress-metric-head span{display:block;text-align:left;margin-top:3px}
 .ksb-grid{gap:6px}
 .ksb-tile{border-radius:10px;font-size:12px}
 .ksb-tile i{width:16px;height:16px;font-size:10px}
 .ksb-modal-overlay{padding:0}
 .ksb-modal{border-radius:24px 24px 0 0;max-height:86vh}
}


/* Premium course/unit surface — compact hierarchy, subtle Evia yellow accents and calm motion. */
.unit-card{
  min-height:56px;
  padding:12px 14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  border-radius:17px;
  background:linear-gradient(135deg,rgba(255,255,255,.98),rgba(255,252,241,.96));
  border-color:rgba(226,231,238,.86);
  box-shadow:0 3px 12px rgba(16,24,40,.035);
  position:relative;
  overflow:hidden;
  transition:transform .22s cubic-bezier(.2,.8,.2,1),box-shadow .22s ease,border-color .22s ease,background .22s ease;
}
.unit-card::before{
  content:"";
  position:absolute;
  left:0;
  top:11px;
  bottom:11px;
  width:3px;
  border-radius:0 3px 3px 0;
  background:linear-gradient(180deg,rgba(228,182,0,.12),rgba(228,182,0,.72),rgba(228,182,0,.12));
  opacity:.75;
  transition:opacity .22s ease;
}
.unit-card:active{
  transform:scale(.985);
  box-shadow:0 2px 7px rgba(16,24,40,.025);
}
.unit-card:hover{
  border-color:rgba(228,182,0,.34);
  box-shadow:0 7px 20px rgba(16,24,40,.055);
}
.unit-card:hover::before{opacity:1}
.unit-title{
  font-size:16px;
  line-height:1.25;
  font-weight:650;
  min-width:0;
}
.unit-strength-bars{
  flex:0 0 auto;
  height:20px;
  gap:3px;
  padding:0;
  opacity:.92;
}
.signal-bar{
  width:6px;
  border-radius:3px;
  transform:skewX(-7deg);
  background:linear-gradient(180deg,#edf0f3,#e2e6eb);
  transition:background .3s ease,transform .3s ease,opacity .3s ease;
}
.signal-bar-1{height:7px}
.signal-bar-2{height:13px}
.signal-bar-3{height:19px}
.signal-bar.filled{
  background:linear-gradient(180deg,#f4d45a,var(--yellow));
}
.unit-card .unit-strength-bars[aria-label="No evidence"] .signal-bar{opacity:.72}
.card{
  transition:transform .22s cubic-bezier(.2,.8,.2,1),box-shadow .22s ease,border-color .22s ease;
}
.card:not(.unit-card):hover{
  border-color:rgba(228,182,0,.18);
  box-shadow:0 6px 20px rgba(16,24,40,.05);
}
.section-title{color:#9a8a3b}
.progress-track span{
  background:linear-gradient(90deg,#e4b600,#f0ca35);
  box-shadow:0 0 10px rgba(228,182,0,.18);
}
.progress-metric{position:relative}
.progress-metric::after{
  content:"";
  display:block;
  width:34px;
  height:2px;
  margin-top:9px;
  border-radius:2px;
  background:linear-gradient(90deg,var(--yellow),transparent);
  opacity:.55;
}
.ksb-tile{
  aspect-ratio:1/1;
  min-height:0;
  padding:10px;
  background:linear-gradient(145deg,#fbfcfd,#f5f7f9);
  transition:transform .2s cubic-bezier(.2,.8,.2,1),background .25s ease,border-color .25s ease,box-shadow .25s ease;
}
.ksb-tile:hover{box-shadow:0 5px 15px rgba(16,24,40,.06)}
.ksb-tile.met{
  background:linear-gradient(145deg,#f5fbf6,#edf7ef);
  box-shadow:inset 0 0 0 1px rgba(67,160,71,.03);
}
.ksb-tile{flex-direction:column;align-items:center;justify-content:flex-start;padding-top:13px}.ksb-statuses{position:absolute;inset:0;display:block;pointer-events:none}.ksb-tile .ksb-statuses i{position:absolute;right:auto;top:auto;bottom:7px;width:18px;height:18px;box-shadow:0 2px 5px rgba(67,160,71,.16)}.ksb-tile .ksb-statuses i:not(.ksb-supporting-dot){left:50%;transform:translateX(-50%)}.ksb-tile .ksb-supporting-dot{position:absolute!important;right:6px!important;top:5px!important;bottom:auto!important;left:auto!important;width:auto!important;height:auto!important;flex:0 0 auto;border-radius:0;background:none!important;color:#e4b600;box-shadow:none!important;font-size:13px!important;font-weight:800;line-height:1}
.bottom-nav{box-shadow:0 15px 38px rgba(16,24,40,.105),0 3px 9px rgba(16,24,40,.035)}
.bottom-nav button.active{
  color:#d0a700;
  background:linear-gradient(180deg,#fffdf6,#fff8df);
}
.primary{background:linear-gradient(135deg,#1d2739,#111827 70%,#0d1420)}
.pill.active{
  background:linear-gradient(180deg,#fffdf3,#fff6cf);
  box-shadow:inset 0 0 0 1px rgba(228,182,0,.08),0 3px 9px rgba(228,182,0,.08);
}
.profile-btn{background:linear-gradient(145deg,#fff,#fffdf5)}
.overlay,.profile-overlay,.ksb-modal-overlay{transition:opacity .22s ease,backdrop-filter .22s ease}
.sheet,.profile-sheet,.ksb-modal{animation:eviaSheetIn .28s cubic-bezier(.2,.8,.2,1)}
@keyframes eviaSheetIn{
  from{opacity:0;transform:translateY(14px)}
  to{opacity:1;transform:translateY(0)}
}


/* Thin-line navigation icon system: polished silhouettes, no emoji glyphs. */
.bottom-nav .nav-icon{
  width:24px;
  height:22px;
  display:grid;
  place-items:center;
  color:currentColor;
  transform-origin:center;
}
.bottom-nav .nav-icon svg{
  width:22px;
  height:22px;
  display:block;
  overflow:visible;
}
.bottom-nav .nav-icon svg path{
  fill:none;
  stroke:currentColor;
  stroke-width:1.55;
  stroke-linecap:round;
  stroke-linejoin:round;
  vector-effect:non-scaling-stroke;
}
.bottom-nav button.active .nav-icon svg path{
  stroke-width:1.7;
}
@media(max-width:520px){
  .bottom-nav .nav-icon{width:22px;height:20px}
  .bottom-nav .nav-icon svg{width:21px;height:21px}
}

/* Maths & English profile controls */
.study-check{display:flex;align-items:center;gap:12px;min-height:50px;padding:12px 14px;margin-top:8px;border:1px solid #e4e7ec;border-radius:14px;background:#fff;cursor:pointer;font-weight:700}.study-check input{width:20px;height:20px;accent-color:#e6b800}.study-check span{font-size:14px}.review-list{display:grid;gap:10px}.review-card{display:flex;align-items:center;justify-content:space-between;gap:12px}.review-card h3{margin:0;font-size:16px}.review-card p{margin:4px 0 0;color:#667085;font-size:12px}.target-item{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:12px;border:1px solid #e4e7ec;border-radius:12px;background:#fff;margin:8px 0}.target-item strong{display:block}.target-item p{margin:4px 0;color:#667085;font-size:12px}.target-item small{color:#667085}.target-item b{font-size:12px;white-space:nowrap}.target-item.overdue{border-color:#e57373}.target-item.overdue small,.target-item.overdue b{color:#c62828}.target-item.complete{border-color:#7abf87}.target-item.complete small,.target-item.complete b{color:#267a35}.review-sheet{max-height:82vh;overflow:auto}.review-content{padding-bottom:10px}.review-actions{display:flex;justify-content:flex-end;margin-top:10px}.test-response{display:block;width:100%;min-height:110px;margin:10px 0;padding:12px;border:1px solid #dfe3e8;border-radius:14px;font:inherit;resize:vertical}.chat-pill.correct,.rating-pill.correct{border-color:#74b87d;background:#f0faf2}.chat-pill.wrong,.rating-pill.wrong{border-color:#df7777;background:#fff3f3}.review-report{margin-top:8px}.review-report h3{margin:12px 0 6px}.portfolio-reviews{margin-top:12px}.portfolio-review-title{font-weight:800;font-size:15px}.portfolio-review-meta{font-size:12px;color:#667085;margin-top:3px}
/* Full review detail rows */
.review-detail{margin:8px 0;border:1px solid #e4e7ec;border-radius:14px;background:#fff;overflow:hidden}.review-detail summary{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:13px;cursor:pointer;list-style:none}.review-detail summary::-webkit-details-marker{display:none}.review-detail summary span{font-size:10px;color:#7b8797;text-align:right}.review-detail>p{margin:0;padding:0 13px 10px;color:#667085;font-size:11px}.review-detail-row{padding:10px 13px;border-top:1px solid #eef0f3;font-size:11px}.review-detail-row strong{display:block;color:#475467}.review-detail-row span{display:block;color:#8a94a3;margin-top:2px}.review-detail-row p{margin:6px 0 0;white-space:pre-wrap;color:#667085;line-height:1.45}


/* Review mini-session controls: match Evia's existing interactive chat UI. */
.rating-options{display:grid;gap:9px;margin:10px 0}
.rating-pill{width:100%;padding:13px 15px;border:1px solid #e3e7ed;border-radius:15px;background:#fff;text-align:left;cursor:pointer;color:#172033;box-shadow:0 2px 8px rgba(16,24,40,.035);font-size:14px;line-height:1.4}
.rating-pill:active{transform:scale(.985)}
.rating-pill:disabled{cursor:default;opacity:1}
.rating-pill.correct{border-color:#74b87d;background:#f0faf2}
.rating-pill.wrong{border-color:#df7777;background:#fff3f3}
.review-lesson-block{margin:10px 0 14px}
.review-lesson-block .bubble{max-width:92%}
.micro-teach{margin-top:12px;padding:14px;border:1px solid #edf0f4;border-radius:18px;background:#fff;box-shadow:0 3px 12px rgba(16,24,40,.045)}
.micro-teach .tag{font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:800;color:#9a7b00;margin-bottom:7px}
.micro-result{margin-top:9px;font-size:13px;line-height:1.4}
.review-text-block{margin:10px 0 14px}

/* KSB status positioning: keep the tick centred in every tile and the supporting dot top-right. */
.ksb-statuses{position:absolute!important;inset:0!important;right:auto!important;bottom:auto!important;display:block!important;}
.ksb-tile .ksb-statuses i:not(.ksb-supporting-dot){
  position:absolute!important;
  left:50%!important;
  right:auto!important;
  top:auto!important;
  bottom:7px!important;
  transform:translateX(-50%)!important;
}
.ksb-tile .ksb-statuses .ksb-supporting-dot{
  position:absolute!important;
  left:auto!important;
  right:6px!important;
  top:5px!important;
  bottom:auto!important;
}


/* Portfolio tiles — Apple / Samsung Health inspired metric-card surface. */
.portfolio-app-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
  margin-top:4px;
  width:100%;
  box-sizing:border-box;
}
.portfolio-app-tile{
  position:relative;
  min-width:0;
  min-height:112px;
  padding:14px;
  border:1px solid rgba(226,231,238,.96);
  border-radius:24px;
  background:linear-gradient(145deg,#ffffff 0%,#fbfcfd 68%,#fffdf3 100%);
  box-shadow:0 5px 18px rgba(16,24,40,.045);
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
  text-align:left;
  overflow:hidden;
  cursor:pointer;
  transition:transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s ease,border-color .2s ease;
}
.portfolio-app-tile::before{
  content:"";
  position:absolute;
  width:58px;
  height:58px;
  right:-20px;
  top:-20px;
  border-radius:50%;
  background:rgba(228,182,0,.09);
}
.portfolio-app-tile::after{
  content:"";
  position:absolute;
  left:18px;
  right:18px;
  bottom:0;
  height:3px;
  border-radius:3px 3px 0 0;
  background:linear-gradient(90deg,rgba(228,182,0,.72),rgba(228,182,0,.08));
  opacity:.65;
}
.portfolio-app-tile:active{
  transform:scale(.975);
  box-shadow:0 3px 10px rgba(16,24,40,.035);
}
.portfolio-app-tile:hover{
  transform:translateY(-2px);
  border-color:rgba(228,182,0,.28);
  box-shadow:0 9px 24px rgba(16,24,40,.065);
}
.portfolio-app-count{
  position:relative;
  z-index:1;
  display:block;
  font-size:27px;
  line-height:1;
  font-weight:750;
  letter-spacing:-.055em;
  color:#16834a;
}
.portfolio-app-count::after{
  content:" saved";
  margin-left:4px;
  font-size:10px;
  font-weight:650;
  letter-spacing:.01em;
  color:#98a2b3;
}
.portfolio-app-name{
  position:relative;
  z-index:1;
  display:block;
  max-width:92%;
  font-size:14px;
  line-height:1.28;
  font-weight:700;
  letter-spacing:-.02em;
  color:#344054;
}
.portfolio-app-special{
  background:linear-gradient(145deg,#ffffff 0%,#fafbfc 100%);
}
.portfolio-app-special .portfolio-app-count{
  font-size:27px;
}
.portfolio-intro + .portfolio-app-grid{
  margin-top:14px;
}
@media(max-width:520px){
  .portfolio-app-grid{gap:10px}
  .portfolio-app-tile{
    min-height:106px;
    padding:13px;
    border-radius:22px;
  }
  .portfolio-app-count{font-size:25px}
  .portfolio-app-name{font-size:13px}
  .portfolio-app-count::after{font-size:9px}
}
@media(min-width:800px){
  .portfolio-app-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
}

function unitStrengthForCourse(unitName){
 const es=evidence.filter(e=>e.c===course&&e.u===unitName);
 if(!es.length)return null;
 const photos=es.reduce((n,e)=>n+(Array.isArray(e.photoIds)?e.photoIds.length:(Array.isArray(e.p)?e.p.length:0)),0);
 const words=es.reduce((n,e)=>n+String(e.w||"").trim().split(/\s+/).filter(Boolean).length,0);

 return photoLevel==="strong"&&textLevel==="strong"?"strong":photoLevel==="weak"||textLevel==="weak"?"weak":"good";
}

}

function chat(){
 const profileBtn=$("#profile-btn");
 if(profileBtn)profileBtn.style.display="none";
 const fab=$("#evia-fab");
 fab.classList.add("chat-active");
 const options=[
  ["Portfolio check",""],
  ["Test me",""],
  ["Progress review",""],
  ["Confidence check",""]
 ];
 $("#modal-root").innerHTML='<div class="overlay"><section class="sheet chat-sheet"><div class="sheet-head"><div><div class="chat-kicker">EVIA</div><h2>What would you like to do?</h2></div><button class="close" id="x" aria-label="Close">×</button></div><div class="chat" id="chat"><div class="bubble evia">I can help you review your learning, evidence and confidence.</div><div class="chat-options">'+options.map((o,i)=>'<button class="chat-pill" data-chat-option="'+i+'"><strong>'+o[0]+'</strong></button>').join("")+'</div></div></section></div>';
 $("#x").onclick=()=>{ $("#modal-root").innerHTML=""; fab.classList.remove("chat-active"); const profileBtn=$("#profile-btn"); if(profileBtn && ["learning","course","progress","portfolio"].includes(screen))profileBtn.style.display="flex"; };
 const scroll=()=>$("#chat").scrollTop=$("#chat").scrollHeight;
 const addBubble=v=>$("#chat").insertAdjacentHTML("beforeend",'<div class="bubble user">'+esc(v)+'</div>');
 const thinking=()=>{
   const el=document.createElement("div");
   el.className="bubble evia evia-thinking";
   el.innerHTML='<span class="thinking-label">Evia is thinking</span><span class="thinking-dots"><i></i><i></i><i></i></span>';
   $("#chat").appendChild(el);scroll();return el;
 };
 const eviaReply=(html,delay=900)=>{
   const t=thinking();
   setTimeout(()=>{t.outerHTML='<div class="bubble evia" data-thought-complete="1">'+html+'</div>';scroll()},delay);
 };
 const chatObserver=new MutationObserver(mutations=>{mutations.forEach(m=>m.addedNodes.forEach(node=>{if(!(node instanceof HTMLElement))return;const list=[];if(node.matches&&node.matches(".bubble.evia"))list.push(node);if(node.querySelectorAll)list.push(...node.querySelectorAll(".bubble.evia"));list.forEach(el=>{if(el.classList.contains("evia-thinking")||el.dataset.thoughtComplete==="1"||el.dataset.thoughtQueued==="1")return;el.dataset.thoughtQueued="1";const html=el.innerHTML;el.className="bubble evia evia-thinking";el.innerHTML='<span class="thinking-label">Evia is thinking</span><span class="thinking-dots"><i></i><i></i><i></i></span>';scroll();setTimeout(()=>{el.className="bubble evia";el.dataset.thoughtComplete="1";el.innerHTML=html;scroll()},1200);});}));});chatObserver.observe($("#chat"),{childList:true,subtree:true});
 const firstName=()=>{
   const p=JSON.parse(localStorage.getItem("evia7-profile")||"{}");
   return String(p.name||"").trim().split(/\s+/)[0]||"";
 };
 const confidence=()=>{
   const bank=confidenceQuestions();
   if(!bank.length){eviaReply("I do not have any practical skill areas loaded for this course yet.");return}
   let index=0;
   const session={id:"confidence-"+Date.now(),course,startedAt:new Date().toISOString(),scores:[]};
   const ask=()=>{
     const q=bank[Math.floor(Math.random()*bank.length)];
     const t=thinking();
     setTimeout(()=>{
       t.outerHTML='<div class="bubble evia">'+esc(q[1])+'</div><div class="rating-options">'+
         ["Need more training","Know the basics","Quite confident","I\'ve mastered this"].map((label,n)=>'<button class="rating-pill" data-rating="'+(n+1)+'"><strong>'+label+'</strong></button>').join("")+
         '</div>';
       scroll();
       document.querySelectorAll("[data-rating]").forEach(b=>b.onclick=()=>{
         const score=Number(b.dataset.rating);
         addBubble("I’d rate myself "+b.querySelector("strong").textContent.toLowerCase()+".");
         session.scores.push({area:q[0],score,question:q[1],answeredAt:new Date().toISOString()});
         document.querySelectorAll(".rating-options").forEach(x=>x.remove());
         index++;
         if(index<3){ask();return}
         const yesNo='<div class="bubble evia">Would you like to do 3 more?</div><div class="rating-options"><button class="rating-pill" data-more="yes"><strong>Yes</strong></button><button class="rating-pill" data-more="no"><strong>No</strong></button></div>';
         $("#chat").insertAdjacentHTML("beforeend",yesNo);scroll();
         document.querySelectorAll("[data-more]").forEach(b=>b.onclick=()=>{
           addBubble(b.dataset.more==="yes"?"Yes":"No");
           document.querySelectorAll("[data-more]").forEach(x=>x.parentElement&&x.parentElement.remove());
           if(b.dataset.more==="yes"){
             index=3;
             const askMore=()=>{
               const q2=bank[index];
               const t2=thinking();
               setTimeout(()=>{
                 t2.outerHTML='<div class="bubble evia">'+esc(q2[1])+'</div><div class="rating-options">'+
                   ["Need more training","Know the basics","Quite confident","I\'ve mastered this"].map((label,n)=>'<button class="rating-pill" data-rating-more="'+(n+1)+'"><strong>'+label+'</strong></button>').join("")+
                   '</div>';scroll();
                 document.querySelectorAll("[data-rating-more]").forEach(btn=>btn.onclick=()=>{
                   const score2=Number(btn.dataset.ratingMore);
                   addBubble("I’d rate myself "+btn.querySelector("strong").textContent.toLowerCase()+".");
                   session.scores.push({area:q2[0],score:score2,question:q2[1],answeredAt:new Date().toISOString()});
                   document.querySelectorAll(".rating-options").forEach(x=>x.remove());
                   index++;
                   if(index<6){askMore();return}
                   saveConfidenceHistory([...confidenceHistory(),session]);
                   eviaReply("That confidence check is complete. I’ve saved all 6 ratings for your progress review. They are for reflection, not assessment.");
                 });
               },900);
             };
             askMore();
           }else{
             saveConfidenceHistory([...confidenceHistory(),session]);
             eviaReply("That confidence check is complete. I’ve saved your 3 ratings for your progress review. They are for reflection, not assessment.");
           }
         });
       });
     },900);
   };
   ask();
 };
 const portfolioReview=()=>{
   const entries=evidence.filter(e=>e.c===course);
   const startedNames=new Set(entries.map(e=>e.u));
   const rows=data().u.map((u,i)=>{
     const es=entries.filter(e=>e.u===u[0]);
     if(!es.length)return null;
     const photos=es.reduce((n,e)=>n+(Array.isArray(e.photoIds)?e.photoIds.length:(Array.isArray(e.p)?e.p.length:0)),0);
     const words=es.reduce((n,e)=>n+String(e.w||"").trim().split(/\s+/).filter(Boolean).length,0);
     const photoLevel=photos<=4?"weak":photos<=9?"good":"strong";
   const textLevel=words<=49?"weak":words<=99?"good":"strong";
   const levelValue={weak:1,good:2,strong:3};
   const average=(levelValue[photoLevel]+levelValue[textLevel])/2;
   const overall=average<1.5?"weak":average<2.5?"good":"strong";
   let advice="";
   if(photoLevel==="weak"&&textLevel==="weak")advice="Collect more photos and add more written detail towards this unit.";
   else if(photoLevel==="weak")advice="Collect more photos towards this unit.";
   else if(textLevel==="weak")advice="Add more written detail towards this unit.";
   else if(overall==="strong")advice="You have built a strong evidence base for this unit.";
   else advice="This is a good evidence base. You can strengthen it further with more photos or written detail.";

   }).filter(Boolean);
   const remaining=Math.max(0,data().u.length-startedNames.size);
   const label=x=>x.charAt(0).toUpperCase()+x.slice(1);
   const lines=rows.map(r=>'<div class="bubble evia"><strong>'+esc(r.name)+'</strong><br>Evidence: '+label(r.overall)+' · '+r.photos+' photos · '+r.words+' words.<br>'+esc(r.advice)+'</div>').join("");
   eviaReply('<strong>Portfolio check</strong><br>I’ve reviewed the units you have started and saved evidence for. '+(rows.length?"Here is the current evidence strength:":"There is no saved evidence yet.")+lines+'<br><br><strong>Units remaining:</strong> '+remaining+' of '+data().u.length+'.');
 };
 const progressReview=()=>{
   const entries=evidence.filter(e=>e.c===course);
   const units=data().u.length;
   const covered=new Set(entries.map(e=>e.u)).size;
   const completion=units?Math.round(covered/units*100):0;
   const p=JSON.parse(localStorage.getItem("evia7-profile")||"{}");
   const startDate=p.start?new Date(p.start+"T00:00:00"):null;
   const endDate=p.end?new Date(p.end+"T23:59:59"):null;
   let timeText="I don’t have your apprenticeship dates recorded yet.";
   if(startDate&&!isNaN(startDate)&&endDate&&!isNaN(endDate)&&endDate>startDate){
     const now=Math.min(Date.now(),endDate.getTime());
     const elapsed=Math.max(0,Math.min(1,(now-startDate.getTime())/(endDate.getTime()-startDate.getTime())));
     const elapsedPct=Math.round(elapsed*100);
     timeText="About "+elapsedPct+"% of your planned course time has elapsed, compared with "+completion+"% of units having saved evidence.";
   }
   const totalOTJ=hours.reduce((n,x)=>n+Number(x.n||0),0);
   const history=confidenceHistory().filter(x=>x.course===course&&Array.isArray(x.scores));
   const current=history[history.length-1], previous=history[history.length-2];
   const currentMap=new Map((current?current.scores:[]).map(x=>[x.area,x.score]));
   const previousMap=new Map((previous?previous.scores:[]).map(x=>[x.area,x.score]));
   const confident=[...(current?current.scores:[])].sort((a,b)=>b.score-a.score).slice(0,3);
   const less=[...(current?current.scores:[])].sort((a,b)=>a.score-b.score).slice(0,3);
   const changes=(current?current.scores:[]).map(x=>previousMap.has(x.area)?{area:x.area,delta:x.score-previousMap.get(x.area)}:null).filter(Boolean);
   const changeText=changes.length?changes.map(x=>esc(x.area)+" "+(x.delta>0?"↑":x.delta<0?"↓":"→")+" "+Math.abs(x.delta)).join(", "):"No previous confidence check is available yet for comparison.";
   let guidance="Focus next on the practical units you have not yet captured evidence for, while using another job to strengthen weaker portfolio areas.";
   if(completion===100) guidance="You have saved evidence against every unit. Use your next jobs to strengthen weaker evidence areas and revisit any low-confidence practical skills.";
   if(!entries.length) guidance="Start by capturing evidence from your next practical job, then use the confidence check to identify the practical skills you want to revisit.";
   const name=firstName();
   eviaReply('<strong>Progress review'+(name?", "+esc(name):"")+'</strong><br>'+
     'Evidence completion: '+completion+'% ('+covered+'/'+units+' units). '+timeText+'<br>'+
     'Off-the-job learning: '+totalOTJ.toFixed(2)+' hours across '+hours.length+' learning entries.<br>'+
     (current?'<br><strong>Most confident areas:</strong> '+confident.map(x=>esc(x.area)).join(", ")+'.<br><strong>Areas to work on:</strong> '+less.map(x=>esc(x.area)).join(", ")+'.<br><strong>Change since your previous check:</strong> '+changeText:'<br>No confidence check has been completed yet.')+
     '<br><br><strong>Next direction:</strong> '+guidance);
 };
 document.querySelectorAll("[data-chat-option]").forEach(b=>b.onclick=()=>{
   const choice=options[Number(b.dataset.chatOption)];
   addBubble(choice[0]);
   if(choice[0]==="Portfolio check")portfolioReview();
   else if(choice[0]==="Progress review"){
     if(window.eviaProgressReview)window.eviaProgressReview();
     else progressReview();
   }
   else if(choice[0]==="Confidence check")confidence();
   else window.eviaTestMe();
   scroll();
 });
}

      await Promise.all(registrations.map(r => r.unregister()));
      if ("caches" in window) {
        const keys = await caches.keys();
        await Promise.all(keys.map(k => caches.delete(k)));
      }
    } catch(e) {

    }
  });
})();
