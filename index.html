<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Evia</title>
  <style>
    :root {
      --evia-yellow: #f5c400;
      --bg: #ffffff;
      --eye-x: 0em;
      --eye-y: 0em;
      --char-tilt: 0deg;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      background: var(--bg);
      font-family: Arial, Helvetica, sans-serif;
      color: #1f1f1f;
    }

    button, textarea {
      font: inherit;
    }

    .screen {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      position: relative;
      overflow: hidden;
    }

    .evia-stage {
      position: absolute;
      left: 50%;
      top: 50%;
      font-size: clamp(123.75px, 34.5vw, 165px);
      width: 1em;
      height: 1em;
      transform: translate(-50%, -50%);
      transition:
        top 1100ms cubic-bezier(0.22, 1, 0.36, 1),
        font-size 1100ms cubic-bezier(0.22, 1, 0.36, 1);
      cursor: pointer;
      z-index: 2;
    }

    .screen.active .evia-stage {
      top: calc(max(18px, env(safe-area-inset-top)) + 28px);
      font-size: clamp(61.875px, 17.25vw, 82.5px);
    }

    .evia-float {
      position: relative;
      width: 1em;
      height: 1em;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: stageFloat 8s ease-in-out infinite;
    }

    .evia-float::before {
      content: "";
      position: absolute;
      inset: 0.10em;
      border-radius: 50%;
      background: radial-gradient(circle at center, rgba(245, 196, 0, 0.22), rgba(245, 196, 0, 0.08) 46%, rgba(245, 196, 0, 0) 76%);
      filter: blur(0.10em);
      transform: scale(1.12);
      animation: glowPulse 8s ease-in-out infinite;
      z-index: 0;
      pointer-events: none;
    }

    .evia-character {
      position: relative;
      width: 1em;
      height: 1em;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: rotate(var(--char-tilt));
      transition: transform 1400ms cubic-bezier(0.22, 1, 0.36, 1);
      z-index: 1;
      will-change: transform;
    }

    .evia-body {
      position: relative;
      width: 1em;
      height: 1em;
      border: 0.026em solid var(--evia-yellow);
      border-radius: 50%;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      filter:
        drop-shadow(0 0 0.038em rgba(245, 196, 0, 0.55))
        drop-shadow(0 0 0.105em rgba(245, 196, 0, 0.28))
        drop-shadow(0 0 0.22em rgba(245, 196, 0, 0.13));
      animation: bodyDrift 10s ease-in-out infinite;
      will-change: transform;
    }

    .eyes {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.105em;
      transform: translate(var(--eye-x), var(--eye-y));
      transition: transform 1200ms cubic-bezier(0.22, 1, 0.36, 1);
      will-change: transform;
    }

    .eye {
      width: 0.235em;
      height: 0.235em;
      border: 0.022em solid var(--evia-yellow);
      border-radius: 50%;
      background: transparent;
      transform-origin: center;
      transition: transform 150ms ease;
      will-change: transform;
      flex: 0 0 auto;
    }

    .evia-character.blink .eye {
      transform: scaleY(0.08);
    }

    .evia-character.accent-wobble {
      animation: accentWobble 1200ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .evia-character.accent-squish {
      animation: accentSquish 1150ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .evia-character.accent-lean {
      animation: accentLean 1350ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .pill-stack {
      position: absolute;
      left: 50%;
      top: calc(max(18px, env(safe-area-inset-top)) + 112px);
      width: min(calc(100vw - 40px), 460px);
      display: flex;
      flex-direction: column;
      gap: 12px;
      opacity: 0;
      visibility: hidden;
      transform: translate(-50%, 22px);
      pointer-events: none;
      transition:
        opacity 520ms ease,
        transform 820ms cubic-bezier(0.22, 1, 0.36, 1),
        visibility 0s linear 820ms;
      z-index: 1;
    }

    .screen.active:not(.evidence-open) .pill-stack {
      opacity: 1;
      visibility: visible;
      transform: translate(-50%, 0);
      pointer-events: auto;
      transition:
        opacity 520ms ease 360ms,
        transform 820ms cubic-bezier(0.22, 1, 0.36, 1) 360ms,
        visibility 0s linear 360ms;
    }

    .pill {
      width: 100%;
      min-height: 52px;
      border-radius: 999px;
      border: 1.5px solid rgba(245, 196, 0, 0.35);
      background: rgba(250, 249, 242, 0.96);
      box-shadow:
        0 8px 20px rgba(0, 0, 0, 0.05),
        inset 0 0 0 1px rgba(255, 255, 255, 0.72);
      display: flex;
      align-items: center;
      padding: 0 18px;
      color: rgba(45, 45, 45, 0.5);
      font-size: 14px;
      letter-spacing: 0.02em;
      transition:
        opacity 260ms ease,
        transform 430ms cubic-bezier(0.22, 1, 0.36, 1);
      cursor: pointer;
    }

    .pill.fade-out {
      opacity: 0;
      transform: translateY(-8px);
      pointer-events: none;
    }

    .pill.float-in {
      opacity: 0;
      transform: translateY(18px);
    }

    .pill::before {
      content: "";
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(245, 196, 0, 0.72);
      margin-right: 12px;
      flex: 0 0 auto;
    }

    .evidence-screen {
      position: absolute;
      left: 50%;
      top: calc(max(18px, env(safe-area-inset-top)) + 112px);
      bottom: calc(max(62px, env(safe-area-inset-bottom) + 62px) + 8px);
      width: min(calc(100vw - 28px), 520px);
      transform: translateX(-50%);
      display: none;
      grid-template-rows: 1fr 1fr;
      gap: 10px;
      z-index: 3;
    }

    .screen.evidence-open .evidence-screen {
      display: grid;
    }

    .evidence-top {
      min-height: 0;
      display: grid;
      grid-template-rows: 1fr 1fr;
      gap: 10px;
    }

    .evidence-choice,
    .evidence-requirements,
    .capture-surface {
      border: 1.5px solid rgba(245, 196, 0, 0.35);
      background: rgba(250, 249, 242, 0.96);
      border-radius: 24px;
      box-shadow:
        0 8px 20px rgba(0, 0, 0, 0.05),
        inset 0 0 0 1px rgba(255, 255, 255, 0.72);
    }

    .evidence-choice {
      width: 100%;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px 18px;
      color: rgba(45, 45, 45, 0.68);
      cursor: pointer;
    }

    .evidence-choice strong {
      font-weight: 600;
    }

    .evidence-requirements {
      min-height: 0;
      padding: 18px;
      overflow-y: auto;
      color: rgba(45, 45, 45, 0.68);
      line-height: 1.45;
    }

    .evidence-requirements h2 {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 10px;
      color: rgba(45, 45, 45, 0.82);
    }

    .capture-surface {
      width: 100%;
      height: 100%;
      min-height: 0;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: center;
      padding: 12px;
    }

    .capture-square {
      width: min(100%, 46vh);
      max-height: 100%;
      aspect-ratio: 1 / 1;
      margin: auto;
      border-radius: 20px;
      overflow: hidden;
      background: #111;
      position: relative;
    }

    .capture-square video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .capture-controls {
      position: absolute;
      left: 50%;
      bottom: 12px;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      z-index: 2;
    }

    .capture-button {
      min-height: 42px;
      border: 0;
      border-radius: 999px;
      padding: 0 16px;
      background: rgba(255, 255, 255, 0.92);
      color: #222;
      box-shadow: 0 5px 14px rgba(0, 0, 0, 0.12);
    }

    .audio-panel {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }

    .microphone-mark {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: 2px solid var(--evia-yellow);
      display: grid;
      place-items: center;
      font-size: 28px;
      color: var(--evia-yellow);
    }

    .text-evidence {
      width: 100%;
      height: 100%;
      min-height: 120px;
      resize: none;
      border: 0;
      outline: 0;
      background: transparent;
      padding: 14px;
      color: #333;
      font-size: 16px;
      line-height: 1.45;
    }

    .naxos-menu {
      position: absolute;
      left: 50%;
      bottom: calc(max(58px, env(safe-area-inset-bottom) + 58px) + 14px);
      width: min(calc(100vw - 40px), 360px);
      display: flex;
      flex-direction: column;
      gap: 10px;
      opacity: 0;
      visibility: hidden;
      transform: translate(-50%, 18px);
      pointer-events: none;
      transition:
        opacity 300ms ease,
        transform 500ms cubic-bezier(0.22, 1, 0.36, 1),
        visibility 0s linear 500ms;
      z-index: 7;
    }

    .naxos-menu.open {
      opacity: 1;
      visibility: visible;
      transform: translate(-50%, 0);
      pointer-events: auto;
      transition:
        opacity 300ms ease,
        transform 500ms cubic-bezier(0.22, 1, 0.36, 1),
        visibility 0s linear 0s;
    }

    .naxos-pill {
      width: 100%;
      min-height: 48px;
      border-radius: 999px;
      border: 1.5px solid rgba(245, 196, 0, 0.35);
      background: rgba(250, 249, 242, 0.96);
      box-shadow:
        0 8px 20px rgba(0, 0, 0, 0.05),
        inset 0 0 0 1px rgba(255, 255, 255, 0.72);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 18px;
      color: rgba(45, 45, 45, 0.58);
      font-size: 14px;
      letter-spacing: 0.02em;
      cursor: pointer;
    }

    .naxos-arch {
      position: absolute;
      left: 50%;
      bottom: 0;
      width: 124px;
      height: 62px;
      border: 0;
      border-radius: 124px 124px 0 0;
      background: var(--evia-yellow);
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 8;
    }

    .naxos-scan-mark {
      position: relative;
      width: 30px;
      height: 30px;
    }

    .naxos-scan-mark::before,
    .naxos-scan-mark::after {
      content: "";
      position: absolute;
      inset: 0;
      border: 3px solid rgba(255, 255, 255, 0.96);
    }

    .naxos-scan-mark::before {
      clip-path: polygon(0 0, 38% 0, 38% 10%, 10% 10%, 10% 38%, 0 38%, 0 0, 62% 0, 100% 0, 100% 38%, 90% 38%, 90% 10%, 62% 10%);
    }

    .naxos-scan-mark::after {
      clip-path: polygon(0 62%, 10% 62%, 10% 90%, 38% 90%, 38% 100%, 0 100%, 0 62%, 62% 90%, 90% 90%, 90% 62%, 100% 62%, 100% 100%, 62% 100%);
    }

    .naxos-scan-dot {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 8px;
      height: 8px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.96);
      transform: translate(-50%, -50%);
    }

    .scanner-panel {
      position: absolute;
      inset: 0;
      z-index: 20;
      background: rgba(255, 255, 255, 0.98);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .scanner-panel.open {
      display: flex;
    }

    .scanner-card {
      width: min(100%, 430px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .scanner-video-wrap {
      width: min(100%, 360px);
      aspect-ratio: 1 / 1;
      border-radius: 28px;
      overflow: hidden;
      background: #111;
      border: 2px solid rgba(245, 196, 0, 0.55);
    }

    .scanner-video-wrap video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .scanner-status {
      min-height: 20px;
      font-size: 13px;
      color: rgba(45, 45, 45, 0.66);
      text-align: center;
    }

    .scanner-close {
      min-height: 44px;
      border: 1.5px solid rgba(245, 196, 0, 0.45);
      border-radius: 999px;
      background: rgba(250, 249, 242, 0.96);
      padding: 0 20px;
      color: rgba(45, 45, 45, 0.72);
    }

    @keyframes stageFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    @keyframes glowPulse {
      0%, 100% { transform: scale(1.08); opacity: 0.8; }
      50% { transform: scale(1.16); opacity: 1; }
    }

    @keyframes bodyDrift {
      0%, 100% { transform: rotate(0deg) scale(1); }
      25% { transform: rotate(-0.6deg) scale(1.005, 0.995); }
      50% { transform: rotate(0.4deg) scale(0.995, 1.005); }
      75% { transform: rotate(-0.4deg) scale(1.003, 0.997); }
    }

    @keyframes accentWobble {
      0% { transform: rotate(var(--char-tilt)) scale(1); }
      20% { transform: rotate(calc(var(--char-tilt) - 3deg)) scale(1.01); }
      40% { transform: rotate(calc(var(--char-tilt) + 2.4deg)) scale(1.01); }
      60% { transform: rotate(calc(var(--char-tilt) - 1.5deg)) scale(1.005); }
      80% { transform: rotate(calc(var(--char-tilt) + 0.8deg)) scale(1.002); }
      100% { transform: rotate(var(--char-tilt)) scale(1); }
    }

    @keyframes accentSquish {
      0% { transform: rotate(var(--char-tilt)) scale(1); }
      25% { transform: rotate(calc(var(--char-tilt) - 1deg)) scale(1.05, 0.92); }
      55% { transform: rotate(calc(var(--char-tilt) + 1deg)) scale(0.95, 1.06); }
      100% { transform: rotate(var(--char-tilt)) scale(1); }
    }

    @keyframes accentLean {
      0% { transform: translateX(0) rotate(var(--char-tilt)) scale(1); }
      25% { transform: translateX(-0.02em) rotate(calc(var(--char-tilt) - 2deg)) scale(1.01); }
      60% { transform: translateX(0.01em) rotate(calc(var(--char-tilt) + 1deg)) scale(1.005); }
      100% { transform: translateX(0) rotate(var(--char-tilt)) scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      .evia-stage,
      .evia-float,
      .evia-float::before,
      .evia-body,
      .evia-character,
      .eyes,
      .eye,
      .pill-stack,
      .pill,
      .naxos-menu {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <main class="screen" id="screen" aria-label="Evia home">
    <div class="evia-stage" id="eviaStage" aria-label="Evia" role="button" tabindex="0">
      <div class="evia-float">
        <div class="evia-character" id="evia" aria-hidden="true">
          <div class="evia-body">
            <div class="eyes">
              <span class="eye"></span>
              <span class="eye"></span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="pill-stack" id="pillStack" aria-label="Course menu"></div>

    <section class="evidence-screen" id="evidenceScreen" aria-label="Evidence">
      <div class="evidence-top" id="evidenceTop"></div>
      <div class="evidence-requirements" id="evidenceRequirements">
        <h2>Evidence Requirements</h2>
        <div id="requirementsText"></div>
      </div>
    </section>

    <div class="naxos-menu" id="naxosMenu" aria-label="Naxos QR menu">
      <button class="naxos-pill" type="button" data-naxos-action="send">Send QR Code</button>
      <button class="naxos-pill" type="button" data-naxos-action="scan">Scan QR Code</button>
      <button class="naxos-pill" type="button" data-naxos-action="portfolio">My Portfolio</button>
    </div>

    <button class="naxos-arch" id="naxosArch" type="button" aria-label="Open Naxos QR menu" aria-expanded="false">
      <span class="naxos-scan-mark" aria-hidden="true"><span class="naxos-scan-dot"></span></span>
    </button>

    <div class="scanner-panel" id="scannerPanel" aria-hidden="true">
      <div class="scanner-card">
        <div class="scanner-video-wrap"><video id="scannerVideo" playsinline muted></video></div>
        <div class="scanner-status" id="scannerStatus">Point the camera at a Naxos QR code.</div>
        <button class="scanner-close" id="scannerClose" type="button">Close</button>
      </div>
    </div>
  </main>

  <script>
    const screen = document.getElementById('screen');
    const evia = document.getElementById('evia');
    const eviaStage = document.getElementById('eviaStage');
    const pillStack = document.getElementById('pillStack');
    const evidenceScreen = document.getElementById('evidenceScreen');
    const evidenceTop = document.getElementById('evidenceTop');
    const evidenceRequirements = document.getElementById('evidenceRequirements');
    const requirementsText = document.getElementById('requirementsText');
    const naxosMenu = document.getElementById('naxosMenu');
    const naxosArch = document.getElementById('naxosArch');
    const scannerPanel = document.getElementById('scannerPanel');
    const scannerVideo = document.getElementById('scannerVideo');
    const scannerStatus = document.getElementById('scannerStatus');
    const scannerClose = document.getElementById('scannerClose');
    const root = document.documentElement;

    const looks = [
      { x: 0, y: 0, tilt: 0 },
      { x: -0.038, y: 0, tilt: -1.2 },
      { x: 0.038, y: 0, tilt: 1.2 },
      { x: 0, y: -0.029, tilt: 0 },
      { x: 0, y: 0.029, tilt: 0.3 },
      { x: -0.029, y: -0.019, tilt: -1.6 },
      { x: 0.029, y: -0.019, tilt: 1.6 },
      { x: -0.029, y: 0.019, tilt: -1 },
      { x: 0.029, y: 0.019, tilt: 1 }
    ];

    const accents = ['accent-wobble', 'accent-squish', 'accent-lean'];
    const placeholderCourse = Array.from({ length: 5 }, (_, a) => ({
      label: `Placeholder ${a + 1}`,
      children: Array.from({ length: 5 }, (_, b) => ({
        label: `Placeholder ${a + 1}.${b + 1}`,
        children: Array.from({ length: 5 }, (_, c) => ({
          label: `Placeholder ${a + 1}.${b + 1}.${c + 1}`,
          recommended: { label: 'Recommended', type: 'camera' },
          alternative: { label: 'Alternative', type: 'text' },
          requirements: 'Evidence requirements placeholder'
        }))
      }))
    }));

    let accentBusy = false;
    let lastLook = 0;
    let menuLevel = 1;
    let menuPath = [];
    let pillTransitionBusy = false;
    let currentItems = placeholderCourse;
    let courseItems = loadSavedCourse() || placeholderCourse;
    let activeEvidence = null;
    let captureStream = null;
    let recorder = null;
    let recordedChunks = [];
    let scannerStream = null;
    let scannerFrame = null;
    let scannerBusy = false;

    function pickDifferentLook() {
      let next = lastLook;
      while (next === lastLook) next = Math.floor(Math.random() * looks.length);
      lastLook = next;
      return looks[next];
    }

    function applyLook() {
      if (accentBusy) return;
      const look = pickDifferentLook();
      root.style.setProperty('--eye-x', `${look.x}em`);
      root.style.setProperty('--eye-y', `${look.y}em`);
      root.style.setProperty('--char-tilt', `${look.tilt}deg`);
    }

    function blink(doubleBlink = false) {
      evia.classList.add('blink');
      setTimeout(() => {
        evia.classList.remove('blink');
        if (doubleBlink) {
          setTimeout(() => {
            evia.classList.add('blink');
            setTimeout(() => evia.classList.remove('blink'), 130);
          }, 110);
        }
      }, 130);
    }

    function runAccent() {
      if (accentBusy || screen.classList.contains('active')) return;
      accentBusy = true;
      const accent = accents[Math.floor(Math.random() * accents.length)];
      evia.classList.add(accent);
      const duration = accent === 'accent-lean' ? 1350 : accent === 'accent-squish' ? 1150 : 1200;
      setTimeout(() => {
        evia.classList.remove(accent);
        accentBusy = false;
      }, duration + 50);
    }

    function scheduleLooks() {
      applyLook();
      setTimeout(scheduleLooks, 2800 + Math.random() * 2200);
    }

    function scheduleBlinks() {
      blink(Math.random() < 0.22);
      setTimeout(scheduleBlinks, 3200 + Math.random() * 2600);
    }

    function scheduleAccents() {
      runAccent();
      setTimeout(scheduleAccents, 6200 + Math.random() * 2600);
    }

    function loadSavedCourse() {
      try {
        const saved = localStorage.getItem('eviaNaxosCourse');
        return saved ? JSON.parse(saved) : null;
      } catch (error) {
        return null;
      }
    }

    function saveCourse(items) {
      try {
        localStorage.setItem('eviaNaxosCourse', JSON.stringify(items));
      } catch (error) {
        // The imported course still remains active for this session.
      }
    }

    function cleanText(value) {
      return typeof value === 'string' ? value.trim() : '';
    }

    function normaliseEvidenceOption(option, fallbackLabel) {
      if (!option) return null;
      if (typeof option === 'string') {
        return { label: option.trim() || fallbackLabel, type: 'text' };
      }
      if (typeof option !== 'object') return null;
      const label = cleanText(option.label || option.name || option.title) || fallbackLabel;
      const rawType = cleanText(option.type || option.method || option.evidenceType).toLowerCase();
      let type = 'text';
      if (['camera', 'video', 'photo'].includes(rawType)) type = 'camera';
      if (['audio', 'microphone', 'voice', 'reflection'].includes(rawType)) type = 'audio';
      if (['text', 'written', 'writing'].includes(rawType)) type = 'text';
      return { label, type };
    }

    function normaliseNode(node, depth) {
      if (!node) return null;
      if (typeof node === 'string') return { label: node.trim() };
      if (typeof node !== 'object') return null;

      const label = cleanText(node.label || node.name || node.title || node.wording);
      if (!label) return null;

      const rawChildren = node.children || node.items || node.pills || node.sections || node.options || [];
      const children = Array.isArray(rawChildren)
        ? rawChildren.map((child) => normaliseNode(child, depth + 1)).filter(Boolean).slice(0, 5)
        : [];

      const normalised = { label };
      if (children.length && depth < 3) normalised.children = children;

      if (depth >= 3 || !children.length) {
        normalised.recommended = normaliseEvidenceOption(node.recommended || node.recommendedEvidence, 'Recommended');
        normalised.alternative = normaliseEvidenceOption(node.alternative || node.alternativeEvidence, 'Alternative');
        normalised.requirements = cleanText(node.requirements || node.evidenceRequirements || node.evidence || node.guidance);
      }

      return normalised;
    }

    function normaliseCoursePayload(payload) {
      const rootData = payload && typeof payload === 'object' && payload.course ? payload.course : payload;
      if (!rootData || typeof rootData !== 'object') return null;
      const rawItems = rootData.items || rootData.menu || rootData.sections || rootData.pills || rootData.children;
      if (!Array.isArray(rawItems)) return null;
      const items = rawItems.map((item) => normaliseNode(item, 1)).filter(Boolean).slice(0, 5);
      return items.length ? items : null;
    }

    function renderPills(floatIn = false) {
      pillStack.innerHTML = '';
      currentItems.forEach((item, index) => {
        const pill = document.createElement('div');
        pill.className = `pill${floatIn ? ' float-in' : ''}`;
        pill.dataset.index = String(index);
        pill.setAttribute('role', 'button');
        pill.setAttribute('tabindex', '0');
        pill.textContent = item.label;
        pillStack.appendChild(pill);
      });

      if (floatIn) {
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            pillStack.querySelectorAll('.pill').forEach((pill) => pill.classList.remove('float-in'));
          });
        });
      }
    }

    function selectedNode(index) {
      return currentItems[index] || null;
    }

    function openNextPillSet(selectedPill) {
      if (pillTransitionBusy) return;
      const selectedIndex = Number(selectedPill.dataset.index);
      const node = selectedNode(selectedIndex);
      if (!node) return;

      if (menuLevel >= 3 || !Array.isArray(node.children) || !node.children.length) {
        openEvidence(node);
        return;
      }

      pillTransitionBusy = true;
      const pills = [...pillStack.querySelectorAll('.pill')];
      pills.forEach((pill) => {
        if (pill !== selectedPill) pill.classList.add('fade-out');
      });

      setTimeout(() => {
        selectedPill.classList.add('fade-out');
        setTimeout(() => {
          menuPath.push(selectedIndex);
          menuLevel += 1;
          currentItems = node.children.slice(0, 5);
          renderPills(true);
          pillTransitionBusy = false;
        }, 260);
      }, 260);
    }

    function resetPills() {
      menuLevel = 1;
      menuPath = [];
      pillTransitionBusy = false;
      currentItems = courseItems.slice(0, 5);
      renderPills(false);
    }

    function openEvidence(node) {
      stopCapture();
      activeEvidence = node;
      screen.classList.add('evidence-open');
      evidenceTop.innerHTML = '';

      const choices = [
        ['Recommended', node.recommended],
        ['Alternative', node.alternative]
      ].filter(([, option]) => option && cleanText(option.label));

      choices.forEach(([heading, option]) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'evidence-choice';
        button.dataset.evidenceType = option.type || 'text';
        button.innerHTML = `<strong>${heading}</strong>&nbsp;&nbsp;${option.label}`;
        evidenceTop.appendChild(button);
      });

      if (choices.length === 1) evidenceTop.style.gridTemplateRows = '1fr';
      else evidenceTop.style.gridTemplateRows = '1fr 1fr';

      const requirements = cleanText(node.requirements);
      evidenceRequirements.style.display = requirements ? 'block' : 'none';
      requirementsText.textContent = requirements;
      if (!requirements) evidenceScreen.style.gridTemplateRows = '1fr';
      else evidenceScreen.style.gridTemplateRows = '1fr 1fr';
    }

    function closeEvidence() {
      stopCapture();
      activeEvidence = null;
      screen.classList.remove('evidence-open');
      evidenceScreen.style.gridTemplateRows = '1fr 1fr';
      evidenceRequirements.style.display = 'block';
    }

    function activateHome() {
      screen.classList.add('active');
      root.style.setProperty('--eye-x', '0em');
      root.style.setProperty('--eye-y', '0em');
      root.style.setProperty('--char-tilt', '0deg');
      blink(true);
    }

    function deactivateHome() {
      closeEvidence();
      screen.classList.remove('active');
      resetPills();
    }

    function toggleHome() {
      if (screen.classList.contains('active')) deactivateHome();
      else activateHome();
    }

    function handlePillActivation(event) {
      const pill = event.target.closest('.pill');
      if (!pill || !screen.classList.contains('active')) return;
      openNextPillSet(pill);
    }

    function toggleNaxosMenu() {
      const isOpen = naxosMenu.classList.toggle('open');
      naxosArch.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    }

    function stopStream(stream) {
      if (!stream) return;
      stream.getTracks().forEach((track) => track.stop());
    }

    function stopCapture() {
      if (recorder && recorder.state !== 'inactive') recorder.stop();
      recorder = null;
      recordedChunks = [];
      stopStream(captureStream);
      captureStream = null;
    }

    function preferredVideoMimeType() {
      const options = [
        'video/webm;codecs=vp9,opus',
        'video/webm;codecs=vp8,opus',
        'video/webm'
      ];
      return options.find((type) => window.MediaRecorder && MediaRecorder.isTypeSupported(type)) || '';
    }

    function preferredAudioMimeType() {
      const options = ['audio/webm;codecs=opus', 'audio/webm'];
      return options.find((type) => window.MediaRecorder && MediaRecorder.isTypeSupported(type)) || '';
    }

    async function openCameraCapture() {
      stopCapture();
      evidenceTop.innerHTML = '<div class="capture-surface"><div class="capture-square"><video id="captureVideo" playsinline muted></video><div class="capture-controls"><button class="capture-button" id="recordToggle" type="button">Record</button></div></div></div>';
      evidenceTop.style.gridTemplateRows = '1fr';
      const video = document.getElementById('captureVideo');
      const toggle = document.getElementById('recordToggle');

      try {
        captureStream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: 'environment' },
            width: { ideal: 1280 },
            height: { ideal: 1280 },
            aspectRatio: { ideal: 1 },
            frameRate: { ideal: 24, max: 30 }
          },
          audio: {
            channelCount: { ideal: 1 },
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true
          }
        });
        video.srcObject = captureStream;
        await video.play();

        toggle.addEventListener('click', () => {
          if (!window.MediaRecorder) return;
          if (!recorder || recorder.state === 'inactive') {
            recordedChunks = [];
            const mimeType = preferredVideoMimeType();
            const options = {
              videoBitsPerSecond: 1200000,
              audioBitsPerSecond: 64000
            };
            if (mimeType) options.mimeType = mimeType;
            recorder = new MediaRecorder(captureStream, options);
            recorder.ondataavailable = (event) => {
              if (event.data && event.data.size) recordedChunks.push(event.data);
            };
            recorder.start(1000);
            toggle.textContent = 'Stop';
          } else {
            recorder.stop();
            toggle.textContent = 'Record';
          }
        });
      } catch (error) {
        evidenceTop.innerHTML = '<div class="capture-surface">Camera and microphone access is required for this evidence type.</div>';
      }
    }

    async function openAudioCapture() {
      stopCapture();
      evidenceTop.innerHTML = '<div class="capture-surface"><div class="audio-panel"><div class="microphone-mark">●</div><button class="capture-button" id="audioToggle" type="button">Record audio</button></div></div>';
      evidenceTop.style.gridTemplateRows = '1fr';
      const toggle = document.getElementById('audioToggle');

      try {
        captureStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            channelCount: { ideal: 1 },
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true
          }
        });

        toggle.addEventListener('click', () => {
          if (!window.MediaRecorder) return;
          if (!recorder || recorder.state === 'inactive') {
            recordedChunks = [];
            const mimeType = preferredAudioMimeType();
            const options = { audioBitsPerSecond: 48000 };
            if (mimeType) options.mimeType = mimeType;
            recorder = new MediaRecorder(captureStream, options);
            recorder.ondataavailable = (event) => {
              if (event.data && event.data.size) recordedChunks.push(event.data);
            };
            recorder.start(1000);
            toggle.textContent = 'Stop audio';
          } else {
            recorder.stop();
            toggle.textContent = 'Record audio';
          }
        });
      } catch (error) {
        evidenceTop.innerHTML = '<div class="capture-surface">Microphone access is required for this evidence type.</div>';
      }
    }

    function openTextCapture() {
      stopCapture();
      evidenceTop.innerHTML = '<div class="capture-surface"><textarea class="text-evidence" aria-label="Written evidence" placeholder="Write your evidence here..."></textarea></div>';
      evidenceTop.style.gridTemplateRows = '1fr';
    }

    function openEvidenceType(type) {
      if (type === 'camera') openCameraCapture();
      else if (type === 'audio') openAudioCapture();
      else openTextCapture();
    }

    function parseNaxosPayload(rawValue) {
      try {
        const parsed = JSON.parse(rawValue);
        return normaliseCoursePayload(parsed);
      } catch (error) {
        return null;
      }
    }

    function applyImportedCourse(items) {
      courseItems = items.slice(0, 5);
      saveCourse(courseItems);
      closeEvidence();
      resetPills();
      screen.classList.add('active');
      scannerStatus.textContent = 'Naxos course imported.';
    }

    async function startScanner() {
      naxosMenu.classList.remove('open');
      naxosArch.setAttribute('aria-expanded', 'false');
      scannerPanel.classList.add('open');
      scannerPanel.setAttribute('aria-hidden', 'false');
      scannerStatus.textContent = 'Point the camera at a Naxos QR code.';

      if (!('BarcodeDetector' in window)) {
        scannerStatus.textContent = 'QR scanning is not supported by this browser.';
        return;
      }

      try {
        scannerStream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: 'environment' },
            width: { ideal: 1280 },
            height: { ideal: 1280 }
          },
          audio: false
        });
        scannerVideo.srcObject = scannerStream;
        await scannerVideo.play();
        scannerBusy = false;
        scanFrame();
      } catch (error) {
        scannerStatus.textContent = 'Camera access is required to scan a Naxos QR code.';
      }
    }

    async function scanFrame() {
      if (!scannerStream || scannerBusy || !scannerPanel.classList.contains('open')) return;
      scannerBusy = true;
      try {
        const detector = new BarcodeDetector({ formats: ['qr_code'] });
        const codes = await detector.detect(scannerVideo);
        if (codes.length) {
          const items = parseNaxosPayload(codes[0].rawValue);
          if (items) {
            applyImportedCourse(items);
            closeScanner();
            return;
          }
          scannerStatus.textContent = 'That QR code is not a valid Naxos course code.';
        }
      } catch (error) {
        scannerStatus.textContent = 'Unable to read this QR code.';
      }
      scannerBusy = false;
      scannerFrame = requestAnimationFrame(scanFrame);
    }

    function closeScanner() {
      if (scannerFrame) cancelAnimationFrame(scannerFrame);
      scannerFrame = null;
      scannerBusy = false;
      stopStream(scannerStream);
      scannerStream = null;
      scannerVideo.srcObject = null;
      scannerPanel.classList.remove('open');
      scannerPanel.setAttribute('aria-hidden', 'true');
    }

    eviaStage.addEventListener('click', toggleHome);
    eviaStage.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        toggleHome();
      }
    });

    pillStack.addEventListener('click', handlePillActivation);
    pillStack.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' || event.key === ' ') {
        const pill = event.target.closest('.pill');
        if (!pill) return;
        event.preventDefault();
        openNextPillSet(pill);
      }
    });

    evidenceTop.addEventListener('click', (event) => {
      const choice = event.target.closest('.evidence-choice');
      if (!choice) return;
      openEvidenceType(choice.dataset.evidenceType || 'text');
    });

    naxosArch.addEventListener('click', toggleNaxosMenu);
    naxosMenu.addEventListener('click', (event) => {
      const action = event.target.closest('[data-naxos-action]')?.dataset.naxosAction;
      if (action === 'scan') startScanner();
    });
    scannerClose.addEventListener('click', closeScanner);

    resetPills();
    applyLook();
    setTimeout(scheduleLooks, 1800);
    setTimeout(scheduleBlinks, 2200);
    setTimeout(scheduleAccents, 4200);

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        stopCapture();
        closeScanner();
      } else {
        applyLook();
      }
    });
  </script>
</body>
</html>
