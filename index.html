<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fffdfa">
<meta name="description" content="Evia apprenticeship tracking">
<meta name="evia-build-policy" content="network-first-v1">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>Evia</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="polish.css">
<style>
.overlay:has(.chat-sheet){background:transparent;align-items:flex-end;pointer-events:none}
.overlay:has(.chat-sheet) .chat-sheet{pointer-events:auto}
.chat-sheet{position:fixed;left:0;right:0;bottom:166px;width:100%;height:72vh;max-height:72vh;padding:20px 20px calc(18px + env(safe-area-inset-bottom));border-radius:26px;box-shadow:0 12px 38px rgba(16,24,40,.14);overflow:hidden}
.chat-sheet:after{content:"";position:absolute;left:50%;bottom:-13px;width:24px;height:24px;background:#fff;transform:translateX(-50%) rotate(45deg);border-radius:4px;box-shadow:8px 8px 18px rgba(16,24,40,.05);z-index:-1}
.chat-kicker{font-size:10px;letter-spacing:.14em;color:#9aa3af;font-weight:800;margin-bottom:4px}
.chat-sheet .sheet-head{margin-bottom:10px}
.chat-sheet .sheet-head h2{margin:0;font-size:22px}
.chat-sheet .chat{height:calc(72vh - 86px);max-height:none;min-height:0;background:#fafbfc;padding:12px;overflow:auto}
.chat-options{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chat-pill,.rating-pill{width:auto;text-align:left;border:1px solid #e3e7ed;background:#fff;border-radius:999px;padding:9px 13px;box-shadow:0 2px 8px rgba(25,36,55,.04);cursor:pointer}
.chat-pill strong{display:block;font-size:13px;line-height:1.2;white-space:nowrap}
.chat-pill span{display:none}
.chat-pill:active,.rating-pill:active{transform:scale(.98)}
.rating-options{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.rating-pill{text-align:center;padding:9px 12px}
.rating-pill strong{display:block;font-size:13px}
.rating-pill span{display:block;font-size:10px;margin-top:2px}
</style>
</head>
<body>
<div id="app">
<header class="topbar">
<div><div class="version">V7.0</div><h1 id="page-title">Learning</h1></div>
<button class="profile-btn" id="profile-btn" aria-label="Profile">●</button>
</header>
<main id="screen" class="screen"></main>
<button class="evia-fab" id="evia-fab" aria-label="Open Evia"><span class="evia-face"><i></i><i></i></span></button>
<nav class="bottom-nav" aria-label="Main navigation">
<button data-nav="learning"><span class="nav-icon book"></span><span>Learning</span></button>
<button data-nav="course"><span class="nav-icon folder"></span><span>Course</span></button>
<div></div>
<button data-nav="progress"><span class="nav-icon bars"></span><span>Progress</span></button>
<button data-nav="portfolio"><span class="nav-icon bookmark"></span><span>Portfolio</span></button>
</nav>
</div>
<div id="modal-root"></div>
<script src="app.js"></script>
<script src="polish.js"></script>
<script src="profile.js"></script>
<script>
(function(){
  if (!("serviceWorker" in navigator)) return;
  let reloading=false;
  navigator.serviceWorker.addEventListener("controllerchange",function(){
    if(reloading)return;
    reloading=true;
    window.location.reload();
  });
  window.addEventListener("load", async function(){
    try {
      const registration=await navigator.serviceWorker.register("./sw.js",{updateViaCache:"none"});
      await registration.update();
      if(registration.waiting) registration.waiting.postMessage({type:"SKIP_WAITING"});
    } catch(e) { console.warn("Evia update service unavailable",e); }
  });
})();
</script>
</body>
</html>
