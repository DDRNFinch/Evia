<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Evia</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      background: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    .screen {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .evia {
      position: relative;
      width: clamp(150px, 42vw, 190px);
      aspect-ratio: 1;
      border: clamp(5px, 1.5vw, 7px) solid #f5c400;
      border-radius: 50%;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      filter:
        drop-shadow(0 0 10px rgba(245, 196, 0, 0.55))
        drop-shadow(0 0 25px rgba(245, 196, 0, 0.34))
        drop-shadow(0 0 50px rgba(245, 196, 0, 0.18));
    }

    .eyes {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(13px, 4vw, 19px);
      transform: translateY(-2px);
    }

    .eye {
      width: clamp(33px, 9.5vw, 43px);
      height: clamp(46px, 13vw, 58px);
      border: clamp(4px, 1.1vw, 5px) solid #f5c400;
      border-radius: 50%;
      background: transparent;
    }
  </style>
</head>

<body>
  <main class="screen" aria-label="Evia">
    <div class="evia" aria-hidden="true">
      <div class="eyes">
        <span class="eye"></span>
        <span class="eye"></span>
      </div>
    </div>
  </main>
</body>
</html>
