<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Evia</title>
  <style>
    :root {
      --evia-yellow: #f5c400;
      --bg: #ffffff;
      --eye-x: 0px;
      --eye-y: 0px;
      --char-tilt: 0deg;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      background: var(--bg);
      font-family: Arial, Helvetica, sans-serif;
      color: #1f1f1f;
    }

    .screen {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      position: relative;
      padding: max(18px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
      overflow: hidden;
    }

    .home-shell {
      width: 100%;
      min-height: calc(100vh - max(18px, env(safe-area-inset-top)) - max(20px, env(safe-area-inset-bottom)));
      min-height: calc(100dvh - max(18px, env(safe-area-inset-top)) - max(20px, env(safe-area-inset-bottom)));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      transition: justify-content 900ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .screen.active .home-shell {
      justify-content: flex-start;
      gap: 18px;
    }

    .evia-stage {
      position: relative;
      width: min(54vw, 210px);
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: stageFloat 8s ease-in-out infinite;
      transition:
        width 1100ms cubic-bezier(0.22, 1, 0.36, 1),
        margin-top 1100ms cubic-bezier(0.22, 1, 0.36, 1),
        transform 1100ms cubic-bezier(0.22, 1, 0.36, 1);
      cursor: pointer;
      flex: 0 0 auto;
    }

    .screen.active .evia-stage {
      width: min(16.2vw, 63px);
      margin-top: 6px;
      transform: translateY(0);
    }

    .evia-stage::before {
      content: "";
      position: absolute;
      inset: 10%;
      border-radius: 50%;
      background: radial-gradient(circle at center, rgba(245, 196, 0, 0.22), rgba(245, 196, 0, 0.08) 46%, rgba(245, 196, 0, 0) 76%);
      filter: blur(22px);
      transform: scale(1.12);
      animation: glowPulse 8s ease-in-out infinite;
      z-index: 0;
      pointer-events: none;
    }

    .evia-character {
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: rotate(var(--char-tilt));
      transition: transform 1400ms cubic-bezier(0.22, 1, 0.36, 1);
      z-index: 1;
      will-change: transform;
    }

    .evia-body {
      position: relative;
      width: 100%;
      height: 100%;
      border: clamp(4px, 1.15vw, 6px) solid var(--evia-yellow);
      border-radius: 50%;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      filter:
        drop-shadow(0 0 8px rgba(245, 196, 0, 0.55))
        drop-shadow(0 0 22px rgba(245, 196, 0, 0.28))
        drop-shadow(0 0 48px rgba(245, 196, 0, 0.13));
      animation: bodyDrift 10s ease-in-out infinite;
      will-change: border-radius, transform;
    }

    .eyes {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(10px, 3.2vw, 18px);
      transform: translate(var(--eye-x), var(--eye-y));
      transition: transform 1200ms cubic-bezier(0.22, 1, 0.36, 1);
      will-change: transform;
    }

    .eye {
      width: clamp(24px, 7.2vw, 34px);
      height: clamp(24px, 7.2vw, 34px);
      border: clamp(3px, 0.95vw, 5px) solid var(--evia-yellow);
      border-radius: 50%;
      background: transparent;
      transform-origin: center;
      transition: transform 150ms ease;
      will-change: transform;
    }

    .evia-character.blink .eye {
      transform: scaleY(0.08);
    }

    .evia-character.accent-wobble {
      animation: accentWobble 1200ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .evia-character.accent-squish {
      animation: accentSquish 1150ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .evia-character.accent-lean {
      animation: accentLean 1350ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .pill-stack {
      width: min(94vw, 460px);
      display: flex;
      flex-direction: column;
      gap: 12px;
      opacity: 0;
      transform: translateY(22px);
      pointer-events: none;
      transition:
        opacity 520ms ease,
        transform 820ms cubic-bezier(0.22, 1, 0.36, 1);
      transition-delay: 140ms;
      margin-top: 6px;
    }

    .screen.active .pill-stack {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
      transition-delay: 360ms;
    }

    .pill {
      width: 100%;
      min-height: 52px;
      border-radius: 999px;
      border: 1.5px solid rgba(245, 196, 0, 0.35);
      background: rgba(250, 249, 242, 0.96);
      box-shadow:
        0 8px 20px rgba(0, 0, 0, 0.05),
        inset 0 0 0 1px rgba(255, 255, 255, 0.72);
      display: flex;
      align-items: center;
      padding: 0 18px;
      color: rgba(45, 45, 45, 0.5);
      font-size: 14px;
      letter-spacing: 0.02em;
    }

    .pill::before {
      content: "";
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(245, 196, 0, 0.72);
      margin-right: 12px;
      flex: 0 0 auto;
    }

    @keyframes stageFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    @keyframes glowPulse {
      0%, 100% { transform: scale(1.08); opacity: 0.8; }
      50% { transform: scale(1.16); opacity: 1; }
    }

    @keyframes bodyDrift {
      0%, 100% { transform: rotate(0deg) scale(1); }
      25% { transform: rotate(-0.6deg) scale(1.005, 0.995); }
      50% { transform: rotate(0.4deg) scale(0.995, 1.005); }
      75% { transform: rotate(-0.4deg) scale(1.003, 0.997); }
    }

    @keyframes accentWobble {
      0% { transform: rotate(var(--char-tilt)) scale(1); }
      20% { transform: rotate(calc(var(--char-tilt) - 3deg)) scale(1.01); }
      40% { transform: rotate(calc(var(--char-tilt) + 2.4deg)) scale(1.01); }
      60% { transform: rotate(calc(var(--char-tilt) - 1.5deg)) scale(1.005); }
      80% { transform: rotate(calc(var(--char-tilt) + 0.8deg)) scale(1.002); }
      100% { transform: rotate(var(--char-tilt)) scale(1); }
    }

    @keyframes accentSquish {
      0% { transform: rotate(var(--char-tilt)) scale(1); }
      25% { transform: rotate(calc(var(--char-tilt) - 1deg)) scale(1.05, 0.92); }
      55% { transform: rotate(calc(var(--char-tilt) + 1deg)) scale(0.95, 1.06); }
      100% { transform: rotate(var(--char-tilt)) scale(1); }
    }

    @keyframes accentLean {
      0% { transform: translateX(0) rotate(var(--char-tilt)) scale(1); }
      25% { transform: translateX(-4px) rotate(calc(var(--char-tilt) - 2deg)) scale(1.01); }
      60% { transform: translateX(2px) rotate(calc(var(--char-tilt) + 1deg)) scale(1.005); }
      100% { transform: translateX(0) rotate(var(--char-tilt)) scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      .evia-stage,
      .evia-stage::before,
      .evia-body,
      .evia-character,
      .eyes,
      .eye,
      .pill-stack,
      .home-shell {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <main class="screen" id="screen" aria-label="Evia home">
    <section class="home-shell">
      <div class="evia-stage" id="eviaStage" aria-label="Evia" role="button" tabindex="0">
        <div class="evia-character" id="evia" aria-hidden="true">
          <div class="evia-body">
            <div class="eyes">
              <span class="eye"></span>
              <span class="eye"></span>
            </div>
          </div>
        </div>
      </div>

      <div class="pill-stack" aria-label="Menu placeholders">
        <div class="pill">Placeholder 1</div>
        <div class="pill">Placeholder 2</div>
        <div class="pill">Placeholder 3</div>
        <div class="pill">Placeholder 4</div>
        <div class="pill">Placeholder 5</div>
      </div>
    </section>
  </main>

  <script>
    const screen = document.getElementById('screen');
    const evia = document.getElementById('evia');
    const eviaStage = document.getElementById('eviaStage');
    const root = document.documentElement;

    const looks = [
      { x: 0, y: 0, tilt: 0 },
      { x: -8, y: 0, tilt: -1.2 },
      { x: 8, y: 0, tilt: 1.2 },
      { x: 0, y: -6, tilt: 0 },
      { x: 0, y: 6, tilt: 0.3 },
      { x: -6, y: -4, tilt: -1.6 },
      { x: 6, y: -4, tilt: 1.6 },
      { x: -6, y: 4, tilt: -1 },
      { x: 6, y: 4, tilt: 1 }
    ];

    const accents = ['accent-wobble', 'accent-squish', 'accent-lean'];
    let accentBusy = false;
    let lastLook = 0;

    function pickDifferentLook() {
      let next = lastLook;
      while (next === lastLook) next = Math.floor(Math.random() * looks.length);
      lastLook = next;
      return looks[next];
    }

    function applyLook() {
      if (accentBusy) return;
      const look = pickDifferentLook();
      root.style.setProperty('--eye-x', `${look.x}px`);
      root.style.setProperty('--eye-y', `${look.y}px`);
      root.style.setProperty('--char-tilt', `${look.tilt}deg`);
    }

    function blink(doubleBlink = false) {
      evia.classList.add('blink');
      setTimeout(() => {
        evia.classList.remove('blink');
        if (doubleBlink) {
          setTimeout(() => {
            evia.classList.add('blink');
            setTimeout(() => evia.classList.remove('blink'), 130);
          }, 110);
        }
      }, 130);
    }

    function runAccent() {
      if (accentBusy) return;
      accentBusy = true;
      const accent = accents[Math.floor(Math.random() * accents.length)];
      evia.classList.add(accent);
      const duration = accent === 'accent-lean' ? 1350 : accent === 'accent-squish' ? 1150 : 1200;
      setTimeout(() => {
        evia.classList.remove(accent);
        accentBusy = false;
      }, duration + 50);
    }

    function scheduleLooks() {
      applyLook();
      setTimeout(scheduleLooks, 2800 + Math.random() * 2200);
    }

    function scheduleBlinks() {
      blink(Math.random() < 0.22);
      setTimeout(scheduleBlinks, 3200 + Math.random() * 2600);
    }

    function scheduleAccents() {
      runAccent();
      setTimeout(scheduleAccents, 6200 + Math.random() * 2600);
    }

    function activateHome() {
      screen.classList.add('active');
      blink(true);
    }

    eviaStage.addEventListener('click', activateHome);
    eviaStage.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        activateHome();
      }
    });

    applyLook();
    setTimeout(scheduleLooks, 1800);
    setTimeout(scheduleBlinks, 2200);
    setTimeout(scheduleAccents, 4200);

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) applyLook();
    });
  </script>
</body>
</html>
