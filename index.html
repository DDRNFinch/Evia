<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fffdfa">
<meta name="description" content="Evia apprenticeship tracking">
<meta name="evia-build-policy" content="network-first-v1">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>Evia</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="polish.css">
<style>
.overlay:has(.chat-sheet){background:rgba(20,28,42,.16);align-items:flex-end;pointer-events:none}.overlay:has(.chat-sheet)~*{}
.overlay:has(.chat-sheet) .chat-sheet{pointer-events:auto}
.chat-sheet{position:fixed;z-index:55;left:0;right:0;bottom:166px;width:100%;height:72vh;max-height:72vh;padding:20px 20px calc(18px + env(safe-area-inset-bottom));border-radius:26px;box-shadow:0 12px 38px rgba(16,24,40,.14);overflow:visible}
.chat-sheet:after{content:"";position:absolute;left:50%;bottom:-13px;width:24px;height:24px;background:#fff;transform:translateX(-50%) rotate(45deg);border-radius:4px;box-shadow:8px 8px 18px rgba(16,24,40,.05);z-index:-1}
.chat-kicker{font-size:10px;letter-spacing:.14em;color:#9aa3af;font-weight:800;margin-bottom:4px}
.chat-sheet .sheet-head{margin-bottom:10px}.chat-sheet .sheet-head h2{margin:0;font-size:22px}
.chat-sheet .chat{height:calc(72vh - 86px);max-height:none;min-height:0;background:#fafbfc;padding:12px;overflow:auto}
.chat-options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.chat-pill,.rating-pill{width:100%;min-height:48px;text-align:center;border:1px solid #e3e7ed;background:#fff;border-radius:16px;padding:10px 12px;box-shadow:0 2px 8px rgba(25,36,55,.04);cursor:pointer;display:flex;align-items:center;justify-content:center}
.chat-pill strong{display:block;font-size:13px;line-height:1.2;white-space:normal}.chat-pill span{display:none}.chat-pill:active,.rating-pill:active{transform:scale(.98)}
.rating-options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:10px 0}.rating-pill{text-align:center;padding:10px 8px;min-height:48px}.rating-pill strong{display:block;font-size:12px;line-height:1.2}.rating-pill span{display:none}
.evia-thinking{display:inline-flex;align-items:center;gap:8px;padding:9px 12px}.thinking-label{font-size:12px;color:#6f7b8d}.thinking-dots{display:inline-flex;gap:3px;align-items:center}.thinking-dots i{display:block;width:5px;height:5px;border-radius:50%;background:#7b8797;animation:eviaThinking 1.1s ease-in-out infinite}.thinking-dots i:nth-child(2){animation-delay:.16s}.thinking-dots i:nth-child(3){animation-delay:.32s}
@keyframes eviaThinking{0%,60%,100%{transform:translateY(0);opacity:.45}30%{transform:translateY(-3px);opacity:1}}
@media(max-width:520px){.chat-sheet{bottom:148px;height:72vh;max-height:72vh}}
.overlay:has(.chat-sheet) ~ *{}body:has(.chat-sheet) .topbar,body:has(.chat-sheet) #screen,body:has(.chat-sheet) .bottom-nav{filter:blur(10px);transition:filter .18s ease}.evia-fab.chat-active{z-index:100;animation:none;opacity:1;filter:none!important}
</style>
</head>
<body>
<div id="app">
<header class="topbar"><div><h1 id="page-title">Course</h1></div></header>
<button class="profile-btn" id="profile-btn" type="button" aria-label="Profile" style="display:none" onclick="if(window.eviaOpenProfile)window.eviaOpenProfile()">●</button>
<main id="screen" class="screen"></main>
<button class="evia-fab" id="evia-fab" aria-label="Open Evia"><span class="evia-face"><i></i><i></i></span></button>
<nav class="bottom-nav" aria-label="Main navigation">
<button data-nav="learning"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 9.5 12 5l8 4.5-8 4.5L4 9.5Z"/><path d="M7 12.2V16c2.8 2.1 7.2 2.1 10 0v-3.8"/><path d="M20 9.5v5.2"/></svg></span><span>Learning</span></button>
<button data-nav="course"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m14.7 5.1 4.2 4.2"/><path d="m13.2 6.6-7.8 7.8-1.1 4.3 4.3-1.1 7.8-7.8"/><path d="m16.2 3.6 1.4-1.1 4 4-1.1 1.4"/></svg></span><span>Course</span></button>
<div></div>
<button data-nav="progress"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 18.5h.01"/><path d="M5 14h.01"/><path d="M5 9.5h.01"/><path d="M9 14a5 5 0 0 1 5 5"/><path d="M9 9.5a9.5 9.5 0 0 1 9.5 9.5"/><path d="M9 5a14 14 0 0 1 14 14"/></svg></span><span>Progress</span></button>
<button data-nav="portfolio"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3.5 7.5h6l1.7 2h9.3v10.5h-17z"/><path d="M3.5 7.5V5.8h6.2l1.5 1.7"/></svg></span><span>Portfolio</span></button>
</nav>
</div>
<div id="modal-root"></div>
<script src="app.js"></script>
<script src="polish.js"></script>
<script src="profile.js?v=da39e3a"></script>
<script src="test-banks.js"></script>
<script src="review.js"></script>
<script src="repair.js?v=evia7-idb-test"></script>
<script>
(function(){
  if (!("serviceWorker" in navigator)) return;
  let reloading=false;
  navigator.serviceWorker.addEventListener("controllerchange",function(){if(reloading)return;reloading=true;window.location.reload();});
  window.addEventListener("load", async function(){
    try {
      const registration=await navigator.serviceWorker.register("./sw-v16.js?v=evia7-v19",{updateViaCache:"none"});
      await registration.update();
      const activateWaiting=worker=>{if(!worker)return;worker.postMessage({type:"SKIP_WAITING"});};
      if(registration.waiting) activateWaiting(registration.waiting);
      registration.addEventListener("updatefound",()=>{
        const worker=registration.installing;if(!worker)return;
        worker.addEventListener("statechange",()=>{if(worker.state==="installed"&&navigator.serviceWorker.controller)activateWaiting(worker);});
      });
    } catch(e) {console.warn("Evia update service unavailable",e);}
  });
})();
</script>
</body>
</html>
