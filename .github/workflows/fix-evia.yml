name: Finish Evia update
on:
  push:
    paths:
      - .github/workflows/fix-evia.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified Evia file
        shell: bash
        run: |
          sed -n "/<<'PAYLOAD'/,/^PAYLOAD$/p" .github/workflows/apply-evia.yml | sed '1d;$d' > /tmp/evia.gz.b64
          base64 -d /tmp/evia.gz.b64 | gzip -d > index.html
          test "$(git hash-object index.html)" = "40248ff3dd26985427ac515d70621ab64e3775a1"
          rm .github/workflows/apply-evia.yml .github/workflows/fix-evia.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Evia guided speech and learner profile"
          git push
