name: Apply approved Nisia sync recovery

on:
  push:
    paths:
      - '.github/patch-approved-nisia-sync-recovery.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact Evia Nisia patch
        run: python .github/patch-approved-nisia-sync-recovery.py
      - name: Verify JavaScript syntax
        run: |
          node --check nisia-sync.js
          node --check nisia-loader.js
          node --check service-worker.js
      - name: Commit approved change
        run: |
          rm -f .github/patch-approved-nisia-sync-recovery.py .github/workflows/apply-approved-nisia-sync-recovery.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Add Evia recovery and QR Nisia pairing"
          git push
