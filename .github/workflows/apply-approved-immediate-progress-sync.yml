name: Apply immediate Evia completion sync

on:
  push:
    paths:
      - '.github/patch-approved-immediate-progress-sync.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact completion-sync patch
        run: python .github/patch-approved-immediate-progress-sync.py
      - name: Verify connector syntax
        run: node --check nisia-sync.js
      - name: Commit only approved connector change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nisia-sync.js
          git rm .github/patch-approved-immediate-progress-sync.py .github/workflows/apply-approved-immediate-progress-sync.yml
          git diff --cached --quiet && exit 0
          git commit -m "Sync Evia completion changes immediately"
          git push
