name: Apply approved Evia fresh first load

on:
  push:
    paths:
      - '.github/patch-approved-fresh-first-load.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact first-load patch
        run: python .github/patch-approved-fresh-first-load.py
      - name: Verify direct runtime list
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          required = [
            './evia-approved-features.js',
            './evia-approved-learning-ui.js',
            './evia-approved-menu-support.js',
            './evia-approved-epa.js',
            './evia-approved-targets.js',
            './evia-approved-target-plan-v1.js',
            './evia-approved-updates-stable-v1.js',
            './evia-sw-update-hardening-v1.js',
            './evia-approved-runtime-fixes-v1.js',
            './evia-ui-polish-v1.js',
            './evia-ui-polish-visible-v1.js?v=2',
            './evia-approved-settings-stable-v1.js',
            './evia-developer-mode-v1.js?v=1',
            './evia-approved-support-preview-visual-v1.js',
            './evia-approved-naxos-evidence-contract-v2.js',
            './evia-approved-naxos-evidence-existing-v2.js',
            './evia-approved-speech-landing-fix.js',
            './evia-approved-evidence-capture-layout-v1.js',
            './evia-approved-portfolio-hub-icon-v1.js',
            './evia-approved-update-system-v1.js?v=2',
            './evia-approved-ux-cleanup-v1.js?v=2',
            './evia-approved-ux-cleanup-v3.js?v=2',
            './nisia-loader.js?v=3',
            './evia-approved-attend-learn-render-v4.js?v=1',
            './evia-approved-attend-learn-final-v5.js?v=2',
          ]
          for src in required:
              marker = f'<script src="{src}"></script>'
              if html.count(marker) != 1:
                  raise SystemExit(f'Expected exactly one direct runtime tag for {src}; found {html.count(marker)}')
          if html.count('Current Evia runtime: direct first-load path') != 1:
              raise SystemExit('Fresh-load runtime marker missing or duplicated')
          print(f'Verified {len(required)} direct runtime scripts in index.html')
          PY
      - name: Commit only approved first-load correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/patch-approved-fresh-first-load.py .github/workflows/apply-approved-fresh-first-load.yml
          git diff --cached --quiet && exit 0
          git commit -m "Load current Evia on first visit"
          git push
