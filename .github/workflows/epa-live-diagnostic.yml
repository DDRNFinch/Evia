name: EPA live path diagnostic

on:
  push:
    branches:
      - epa-live-path-fix
    paths:
      - '.github/workflows/epa-live-diagnostic.yml'
      - 'evia-approved-epa-mcq-bank-fix-v1.js'
      - 'evia-runtime-manifest.js'
      - 'service-worker.js'
      - 'tests/epa-mcq-bank.spec.js'
      - 'tests/runtime-manifest.spec.js'
      - 'cloudflare-ai/**'
      - 'evia-approved-epa-zone-v2.js'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Check EPA MCQ routing syntax
        run: node --check evia-approved-epa-mcq-bank-fix-v1.js
      - name: Run Evia smoke tests
        run: npm run test:smoke

  real-st0095-adaptive-path:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Exercise real ST0095 Interview and Practical requests against live Worker
        run: |
          node - <<'NODE'
          const worker = 'https://evia-teach-test.finchyisnow.workers.dev/v1/epa-discussion';
          const origin = 'https://ddrnfinch.github.io';
          const registryUrl = 'https://raw.githubusercontent.com/DDRNFinch/Naxos-Mapping_Engine/main/packs/ST0095/ksb-registry.json';
          const planUrl = 'https://raw.githubusercontent.com/DDRNFinch/Naxos-Mapping_Engine/main/assessment-plans.json';
          const [registryRes, planRes] = await Promise.all([fetch(registryUrl), fetch(planUrl)]);
          if (!registryRes.ok || !planRes.ok) throw new Error(`Naxos fetch failed: registry=${registryRes.status}, plan=${planRes.status}`);
          const registry = await registryRes.json();
          const plans = await planRes.json();
          const plan = plans?.courses?.ST0095;
          const criteria = Object.entries(registry.items || {}).map(([code, wording]) => ({ code, label:String(wording), path:'', requirement:String(wording) }));
          if (!plan || criteria.length !== 59) throw new Error('Real ST0095 source data is incomplete');
          const course = { courseId:'ST0095', courseTitle:'Bricklayer — ST0095 v1.2', courseType:'ksb', level:'2', criteria };
          const methods = Array.isArray(plan.methods) ? plan.methods : [];
          const discussion = methods.find(x => /interview|discussion/i.test(x?.title || ''));
          const practical = methods.find(x => /practical/i.test(x?.title || ''));

          async function post(label, body) {
            const started = Date.now();
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), 55000);
            try {
              const response = await fetch(worker, { method:'POST', headers:{'content-type':'application/json', origin}, body:JSON.stringify(body), signal:controller.signal });
              const raw = await response.text();
              console.log(label, 'status=', response.status, 'elapsedMs=', Date.now()-started, 'body=', raw.slice(0,1200));
              const data = JSON.parse(raw);
              if (!response.ok || data?.ok !== true || !String(data?.question || '').trim()) throw new Error(`${label}: ${data?.error || 'no question returned'}`);
              return data;
            } finally { clearTimeout(timer); }
          }

          const common = { course, evidence:[], focus:[], previousQuestions:[] };
          await post('interview', { action:'question', practiceType:'discussion', assessmentMethod:discussion, ...common });
          await post('practical', { action:'question', practiceType:'practical', assessmentMethod:practical, ...common });
          console.log('REAL_ST0095_ADAPTIVE_PATH_OK');
          NODE
