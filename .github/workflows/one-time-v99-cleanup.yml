name: Evia v99 performance cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-v99-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Remove remount jank and obsolete layers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, shutil

          index_path = Path('index.html')
          index = index_path.read_text()
          assert '<meta name="evia-app-version" content="98" />' in index
          index = index.replace('<meta name="evia-app-version" content="98" />', '<meta name="evia-app-version" content="99" />', 1)
          for line in [
              '<link rel="stylesheet" href="/Evia/assets/evia-premium-motion.css?v=43" />\n',
              '<link rel="stylesheet" href="/Evia/assets/evia-avatar-motion.css?v=98" />\n',
              '<script defer src="/Evia/assets/evia-avatar-motion.js?v=98"></script>\n',
              '<script defer src="/Evia/assets/evia-avatar-life.js?v=55"></script>\n',
              '<script defer src="/Evia/assets/evia-v73-page-handoff.js?v=74"></script>\n',
          ]:
              assert line in index, line
              index = index.replace(line, '')
          assert 'evia-version-v98.js?v=98' in index
          index = index.replace('evia-version-v98.js?v=98', 'evia-version-v99.js?v=99')
          index = index.replace('evia-updater.js?v=98', 'evia-updater.js?v=99')
          index_path.write_text(index)

          live_path = Path('assets/evia-selfobs-live.js')
          live = live_path.read_text()
          old = '''function bindShell(){
            $("[data-evia]").onclick=()=>{open=!open;if(!open){view="home";cat=job=opp=null}mount()};
            $("[data-quick]").onclick=()=>{open=true;view="evidence";mount()};
            document.querySelectorAll("[data-arch]").forEach(b=>b.onclick=()=>{if(b.dataset.arch==="KSB"){open=true;view="coverage";mount()}else toast(`${b.dataset.arch} is still available from the arch bar.`)});
          '''
          new = '''function syncShell(){
            const app=$(".evia-app"),panel=$(".self-panel"),stage=$(".menu-stage"),avatar=$("[data-evia]");
            if(!app)return;
            app.classList.toggle("is-open",open);
            if(avatar)avatar.setAttribute("aria-expanded",open?"true":"false");
            if(stage)stage.setAttribute("aria-hidden",open?"false":"true");
            if(open)render();else if(panel)panel.innerHTML=""
          }
          function bindShell(){
            $("[data-evia]").onclick=()=>{open=!open;if(!open){view="home";cat=job=opp=null}syncShell()};
            $("[data-quick]").onclick=()=>{open=true;view="evidence";syncShell()};
            document.querySelectorAll("[data-arch]").forEach(b=>b.onclick=()=>{if(b.dataset.arch==="KSB"){open=true;view="coverage";syncShell()}else toast(`${b.dataset.arch} is still available from the arch bar.`)});
          '''
          assert old in live
          live = live.replace(old, new, 1)
          old_submit = 'else if(a==="submit"){cat=job=opp=null;view="home";open=false;mount();toast("Job submitted. Start another job whenever you’re ready.")}'
          new_submit = 'else if(a==="submit"){cat=job=opp=null;view="home";open=false;syncShell();toast("Job submitted. Start another job whenever you’re ready.")}'
          assert old_submit in live
          live = live.replace(old_submit, new_submit, 1)
          old_save = 'entries.unshift(e);dayIds.push(e.id);write(STORE,entries);write(DAY,dayIds);clearCapture();view="opps";mount();open=true;$(".evia-app").classList.add("is-open");render();toast("Evidence saved. About one minute, done.")'
          new_save = 'entries.unshift(e);dayIds.push(e.id);write(STORE,entries);write(DAY,dayIds);clearCapture();view="opps";open=true;syncShell();toast("Evidence saved. About one minute, done.")'
          assert old_save in live
          live = live.replace(old_save, new_save, 1)
          old_download = 'const now=Date.now();entries=entries.map(e=>!e.downloadedAt?{...e,downloadedAt:now}:e);write(STORE,entries);tab="downloaded";view="evidence";mount();open=true;$(".evia-app").classList.add("is-open");render();toast(`${list.length} evidence item${list.length===1?"":"s"} moved to Downloaded.`)'
          new_download = 'const now=Date.now();entries=entries.map(e=>!e.downloadedAt?{...e,downloadedAt:now}:e);write(STORE,entries);tab="downloaded";view="evidence";open=true;syncShell();toast(`${list.length} evidence item${list.length===1?"":"s"} moved to Downloaded.`)'
          assert old_download in live
          live = live.replace(old_download, new_download, 1)
          live_path.write_text(live)

          Path('assets/evia-version-v99.js').write_text('(()=>{"use strict";const meta=document.querySelector(\'meta[name="evia-app-version"]\');if(meta)meta.setAttribute("content","99");window.EviaAppVersion=99})();\n')

          updater_path = Path('assets/evia-updater.js')
          updater = updater_path.read_text()
          assert 'window.EviaUpdater=Object.freeze({version:96,check:checkForUpdate});' in updater
          updater = updater.replace('window.EviaUpdater=Object.freeze({version:96,check:checkForUpdate});', 'window.EviaUpdater=Object.freeze({version:99,check:checkForUpdate});')
          updater_path.write_text(updater)

          for sw_name in ['sw.js', 'public/sw.js']:
              p = Path(sw_name)
              sw = p.read_text()
              sw = sw.replace('// v98 matches Evia home/menu motion to Milos and keeps the motion shell fresh', '// v99 removes duplicate motion layers and keeps one direct shell transition path')
              sw = sw.replace('evia-shell-v98', 'evia-shell-v99').replace('evia-beta-shell-v98', 'evia-beta-shell-v99')
              sw = sw.replace("  './assets/evia-avatar-motion.js',\n", '')
              sw = sw.replace("  './assets/evia-avatar-motion.css',\n", '')
              sw = sw.replace("  '/Evia/assets/evia-avatar-motion.js',\n", '')
              sw = sw.replace("  '/Evia/assets/evia-avatar-motion.css',\n", '')
              sw = sw.replace("  './assets/evia-version-v98.js',\n", "  './assets/evia-version-v99.js',\n")
              sw = sw.replace("  '/Evia/assets/evia-version-v98.js',\n", "  '/Evia/assets/evia-version-v99.js',\n")
              p.write_text(sw)

          manifest = {
              'version': '99',
              'title': 'Evia performance cleanup',
              'details': [
                  'Evia now opens and closes without rebuilding the whole app shell',
                  'Duplicate avatar, menu and delayed handoff animation layers have been removed',
                  'The obsolete v42 transfer chunks have been removed from the live repository',
                  'The v99 offline shell forces the cleaned runtime onto installed Evia'
              ]
          }
          manifest_text = json.dumps(manifest, indent=2, ensure_ascii=False) + '\n'
          Path('update.json').write_text(manifest_text)
          Path('public/update.json').write_text(manifest_text)

          verify_path = Path('.github/workflows/verify-current.yml')
          verify = verify_path.read_text()
          verify = verify.replace('          node --check assets/evia-avatar-motion.js\n', '          node --check assets/evia-selfobs-live.js\n')
          verify = verify.replace('tests/motion-v98.test.mjs', 'tests/performance-v99.test.mjs')
          verify = verify.replace('          grep -q "evia-shell-v${EVIA_VERSION}" sw.js\n', '          grep -q "evia-shell-v${EVIA_VERSION}" sw.js\n          test ! -d .v42-transfer\n          ! grep -q "evia-avatar-motion\\|evia-premium-motion\\|evia-avatar-life\\|evia-v73-page-handoff" index.html\n')
          verify_path.write_text(verify)

          test_text = '''import test from "node:test";
          import assert from "node:assert/strict";
          import fs from "node:fs";

          const index = fs.readFileSync("index.html", "utf8");
          const live = fs.readFileSync("assets/evia-selfobs-live.js", "utf8");

          test("Evia home toggle keeps the shell mounted", () => {
            assert.match(live, /function syncShell\(\)/);
            assert.match(live, /open=!open;.*syncShell\(\)/);
            assert.doesNotMatch(live, /open=!open;.*mount\(\)/);
          });

          test("duplicate motion layers and migration chunks are absent", () => {
            for (const name of ["evia-avatar-motion", "evia-premium-motion", "evia-avatar-life", "evia-v73-page-handoff"]) {
              assert.equal(index.includes(name), false, `${name} must not load`);
            }
            assert.equal(fs.existsSync(".v42-transfer"), false);
          });
          '''
          Path('tests/performance-v99.test.mjs').write_text(test_text)

          for obsolete in [
              'assets/evia-premium-motion.css',
              'assets/evia-avatar-motion.css',
              'assets/evia-avatar-motion.js',
              'assets/evia-avatar-life.js',
              'assets/evia-v73-page-handoff.js',
              'tests/motion-v98.test.mjs',
          ]:
              Path(obsolete).unlink(missing_ok=True)
          shutil.rmtree('.v42-transfer', ignore_errors=True)
          PY
      - name: Verify cleaned runtime
        shell: bash
        run: |
          node --check assets/evia-selfobs-live.js
          node --check assets/evia-updater.js
          node --check assets/evia-version-v99.js
          node --check sw.js
          node --check public/sw.js
          python -m json.tool update.json >/dev/null
          python -m json.tool public/update.json >/dev/null
          node --test tests/performance-v99.test.mjs tests/next-visit-v95.test.mjs tests/update-notice-v96.test.mjs tests/milos-review-sync-v97.test.mjs
          test ! -d .v42-transfer
          ! grep -q 'evia-avatar-motion\|evia-premium-motion\|evia-avatar-life\|evia-v73-page-handoff' index.html
      - name: Commit clean Evia v99
        shell: bash
        run: |
          rm -f .github/workflows/one-time-v99-cleanup.yml
          git config user.name "Evia Maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Evia 99: remove remount jank and stale motion layers"
          git push origin HEAD:main
