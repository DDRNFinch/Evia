name: Verify Evia

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup-v99:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply Evia v99 cleanup once
        shell: bash
        run: |
          if node -e "process.exit(JSON.parse(require('fs').readFileSync('update.json','utf8')).version==='99'?0:1)"; then
            echo "Evia v99 already applied"
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path
          import json, shutil

          p = Path('index.html')
          s = p.read_text()
          s = s.replace('<meta name="evia-app-version" content="98" />','<meta name="evia-app-version" content="99" />',1)
          for line in [
            '<link rel="stylesheet" href="/Evia/assets/evia-premium-motion.css?v=43" />\n',
            '<link rel="stylesheet" href="/Evia/assets/evia-avatar-motion.css?v=98" />\n',
            '<script defer src="/Evia/assets/evia-avatar-motion.js?v=98"></script>\n',
            '<script defer src="/Evia/assets/evia-avatar-life.js?v=55"></script>\n',
            '<script defer src="/Evia/assets/evia-v73-page-handoff.js?v=74"></script>\n',
          ]:
            s = s.replace(line,'')
          s = s.replace('evia-version-v98.js?v=98','evia-version-v99.js?v=99')
          s = s.replace('evia-updater.js?v=98','evia-updater.js?v=99')
          p.write_text(s)

          p = Path('assets/evia-selfobs-live.js')
          s = p.read_text()
          marker = 'function bindShell(){'
          sync = '''function syncShell(){
            const app=$(".evia-app"),panel=$(".self-panel"),stage=$(".menu-stage"),avatar=$("[data-evia]");
            if(!app)return;
            app.classList.toggle("is-open",open);
            if(avatar)avatar.setAttribute("aria-expanded",open?"true":"false");
            if(stage)stage.setAttribute("aria-hidden",open?"false":"true");
            if(open)render();else if(panel)panel.innerHTML=""
          }
          function bindShell(){'''
          if 'function syncShell(){' not in s:
            assert marker in s
            s = s.replace(marker,sync,1)
          replacements = {
            '$('["'"'[data-evia]'"'"']).onclick=()=>{open=!open;if(!open){view="home";cat=job=opp=null}mount()};': '$('["'"'[data-evia]'"'"']).onclick=()=>{open=!open;if(!open){view="home";cat=job=opp=null}syncShell()};',
            '$('["'"'[data-quick]'"'"']).onclick=()=>{open=true;view="evidence";mount()};': '$('["'"'[data-quick]'"'"']).onclick=()=>{open=true;view="evidence";syncShell()};',
            'if(b.dataset.arch==="KSB"){open=true;view="coverage";mount()}': 'if(b.dataset.arch==="KSB"){open=true;view="coverage";syncShell()}',
            'else if(a==="submit"){cat=job=opp=null;view="home";open=false;mount();toast("Job submitted. Start another job whenever you’re ready.")}': 'else if(a==="submit"){cat=job=opp=null;view="home";open=false;syncShell();toast("Job submitted. Start another job whenever you’re ready.")}',
            'entries.unshift(e);dayIds.push(e.id);write(STORE,entries);write(DAY,dayIds);clearCapture();view="opps";mount();open=true;$(".evia-app").classList.add("is-open");render();toast("Evidence saved. About one minute, done.")': 'entries.unshift(e);dayIds.push(e.id);write(STORE,entries);write(DAY,dayIds);clearCapture();view="opps";open=true;syncShell();toast("Evidence saved. About one minute, done.")',
            'const now=Date.now();entries=entries.map(e=>!e.downloadedAt?{...e,downloadedAt:now}:e);write(STORE,entries);tab="downloaded";view="evidence";mount();open=true;$(".evia-app").classList.add("is-open");render();toast(`${list.length} evidence item${list.length===1?"":"s"} moved to Downloaded.`)': 'const now=Date.now();entries=entries.map(e=>!e.downloadedAt?{...e,downloadedAt:now}:e);write(STORE,entries);tab="downloaded";view="evidence";open=true;syncShell();toast(`${list.length} evidence item${list.length===1?"":"s"} moved to Downloaded.`)',
          }
          for old,new in replacements.items():
            assert old in s, old[:90]
            s = s.replace(old,new,1)
          p.write_text(s)

          Path('assets/evia-version-v99.js').write_text('(()=>{"use strict";const meta=document.querySelector(\'meta[name="evia-app-version"]\');if(meta)meta.setAttribute("content","99");window.EviaAppVersion=99})();\n')

          p = Path('assets/evia-updater.js')
          s = p.read_text().replace('window.EviaUpdater=Object.freeze({version:96,check:checkForUpdate});','window.EviaUpdater=Object.freeze({version:99,check:checkForUpdate});')
          p.write_text(s)

          for sw_name in ['sw.js','public/sw.js']:
            p = Path(sw_name)
            s = p.read_text()
            s = s.replace('evia-shell-v98','evia-shell-v99').replace('evia-beta-shell-v98','evia-beta-shell-v99')
            s = s.replace("  './assets/evia-avatar-motion.js',\n",'').replace("  './assets/evia-avatar-motion.css',\n",'')
            s = s.replace("  '/Evia/assets/evia-avatar-motion.js',\n",'').replace("  '/Evia/assets/evia-avatar-motion.css',\n",'')
            for old in ['v94','v96','v97','v98']:
              s = s.replace(f"  './assets/evia-version-{old}.js',\n",'').replace(f"  '/Evia/assets/evia-version-{old}.js',\n",'')
            anchor = "  './assets/evia-updater.js',\n"
            if "./assets/evia-version-v99.js" not in s:
              s = s.replace(anchor,anchor+"  './assets/evia-version-v99.js',\n")
            anchor2 = "  '/Evia/assets/evia-updater.js',\n"
            if "/Evia/assets/evia-version-v99.js" not in s:
              s = s.replace(anchor2,anchor2+"  '/Evia/assets/evia-version-v99.js',\n")
            p.write_text(s)

          manifest = {'version':'99','title':'Evia performance cleanup','details':[
            'Evia now opens and closes without rebuilding the whole app shell',
            'Duplicate avatar, menu and delayed handoff animation layers have been removed',
            'Obsolete transfer chunks and superseded version markers have been removed',
            'The v99 offline shell forces the cleaned runtime onto installed Evia'
          ]}
          text = json.dumps(manifest,indent=2,ensure_ascii=False)+'\n'
          Path('update.json').write_text(text)
          Path('public/update.json').write_text(text)

          Path('tests/performance-v99.test.mjs').write_text('''import test from "node:test";
          import assert from "node:assert/strict";
          import fs from "node:fs";
          const index=fs.readFileSync("index.html","utf8");
          const live=fs.readFileSync("assets/evia-selfobs-live.js","utf8");
          test("shell remains mounted when Evia opens",()=>{assert.match(live,/function syncShell\(\)/);assert.match(live,/open=!open;.*syncShell\(\)/);assert.doesNotMatch(live,/open=!open;.*mount\(\)/)});
          test("obsolete motion and transfer layers are gone",()=>{for(const x of ["evia-avatar-motion","evia-premium-motion","evia-avatar-life","evia-v73-page-handoff"])assert.equal(index.includes(x),false);assert.equal(fs.existsSync(".v42-transfer"),false)});
          ''')

          final_verify = '''name: Verify Evia
          on:
            push:
              branches: [main]
            pull_request:
              branches: [main]
            workflow_dispatch:
          permissions:
            contents: read
          jobs:
            verify:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: 22
                - name: Read current Evia version
                  shell: bash
                  run: |
                    VERSION=$(node -e "const fs=require('fs');process.stdout.write(String(JSON.parse(fs.readFileSync('update.json','utf8')).version))")
                    echo "EVIA_VERSION=$VERSION" >> "$GITHUB_ENV"
                - name: Check active JavaScript syntax
                  run: |
                    node --check assets/evia-updater.js
                    node --check assets/evia-selfobs-live.js
                    node --check assets/evia-next-visit-v95.js
                    node --check assets/evia-milos-review-sync-v97.js
                    node --check assets/evia-targets.js
                    node --check "assets/evia-version-v${EVIA_VERSION}.js"
                    node --check sw.js
                    node --check public/sw.js
                - name: Run current regression checks
                  run: node --test tests/next-visit-v95.test.mjs tests/update-notice-v96.test.mjs tests/milos-review-sync-v97.test.mjs tests/performance-v99.test.mjs
                - name: Verify clean runtime and update source
                  shell: bash
                  run: |
                    node -e "const fs=require('fs');const a=fs.readFileSync('sw.js','utf8').trimEnd(),b=fs.readFileSync('public/sw.js','utf8').trimEnd();if(a!==b)process.exit(1)"
                    node -e "const fs=require('fs');const a=JSON.parse(fs.readFileSync('update.json','utf8')),b=JSON.parse(fs.readFileSync('public/update.json','utf8'));if(JSON.stringify(a)!==JSON.stringify(b))process.exit(1)"
                    grep -q "evia-app-version\\\" content=\\\"${EVIA_VERSION}" index.html
                    grep -q "evia-version-v${EVIA_VERSION}.js" index.html
                    grep -q "evia-shell-v${EVIA_VERSION}" sw.js
                    test ! -d .v42-transfer
                    ! grep -q 'evia-avatar-motion\\|evia-premium-motion\\|evia-avatar-life\\|evia-v73-page-handoff' index.html
                - name: Validate manifests
                  run: |
                    python -m json.tool update.json >/dev/null
                    python -m json.tool public/update.json >/dev/null
          '''
          Path('.github/workflows/verify-current.yml').write_text(final_verify)

          for f in [
            '.github/workflows/one-time-v99-cleanup.yml',
            'assets/evia-premium-motion.css','assets/evia-avatar-motion.css','assets/evia-avatar-motion.js','assets/evia-avatar-life.js','assets/evia-v73-page-handoff.js',
            'assets/evia-version-v94.js','assets/evia-version-v96.js','assets/evia-version-v97.js','assets/evia-version-v98.js',
            'tests/motion-v98.test.mjs'
          ]:
            Path(f).unlink(missing_ok=True)
          shutil.rmtree('.v42-transfer',ignore_errors=True)
          PY
      - name: Verify v99 before commit
        shell: bash
        run: |
          node --check assets/evia-selfobs-live.js
          node --check assets/evia-updater.js
          node --check assets/evia-version-v99.js
          node --check sw.js
          node --check public/sw.js
          node --test tests/performance-v99.test.mjs tests/next-visit-v95.test.mjs tests/update-notice-v96.test.mjs tests/milos-review-sync-v97.test.mjs
          python -m json.tool update.json >/dev/null
          test ! -d .v42-transfer
          ! grep -q 'evia-avatar-motion\|evia-premium-motion\|evia-avatar-life\|evia-v73-page-handoff' index.html
      - name: Commit Evia v99
        shell: bash
        run: |
          git config user.name "Evia Maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Evia 99: remove remount jank and stale runtime layers"
          git push origin HEAD:main
