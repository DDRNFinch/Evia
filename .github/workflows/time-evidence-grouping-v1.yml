name: Time evidence grouping v1
# rerun 2

on:
  push:
    branches: [time-evidence-grouping-v1]
    paths:
      - '.github/workflows/time-evidence-grouping-v1.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: time-evidence-grouping-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply approved Time evidence grouping
        run: python .github/time-evidence-grouping-v1.py
      - name: Verify syntax
        run: |
          node --check evia-approved-time-monthly-packs-v1.js
          node --check evia-runtime-manifest.js
          node --check tests/time-only-redesign.spec.js
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Run Time regressions
        run: npx playwright test tests/time-only-redesign.spec.js tests/epa-menu.spec.js --reporter=line
      - name: Run complete Evia smoke suite
        run: npm run test:smoke
      - name: Verify approved app scope only
        run: |
          git diff --name-only HEAD | grep -v '^\.github/time-evidence-grouping-v1' | sort > /tmp/changed
          printf '%s\n' evia-approved-time-monthly-packs-v1.js evia-runtime-manifest.js tests/time-only-redesign.spec.js | sort > /tmp/allowed
          diff -u /tmp/allowed /tmp/changed
      - name: Commit verified Time grouping and remove temporary tooling
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/time-evidence-grouping-v1.py .github/workflows/time-evidence-grouping-v1.yml
          git add evia-approved-time-monthly-packs-v1.js evia-runtime-manifest.js tests/time-only-redesign.spec.js
          git commit -m 'Group related evidence in Time'
          git push origin HEAD:time-evidence-grouping-v1
