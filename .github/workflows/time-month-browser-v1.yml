name: Time month browser v1

on:
  push:
    branches: [time-month-browser-v1]
    paths:
      - '.github/workflows/time-month-browser-v1.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: time-month-browser-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply approved Time month browser
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('.github/time-month-browser-v1.py')
          source=path.read_text(encoding='utf-8')
          old="out, count = re.subn(pattern, repl, text, count=1, flags=flags)"
          new="out, count = re.subn(pattern, lambda _match: repl, text, count=1, flags=flags)"
          if source.count(old)!=1:
              raise SystemExit('Expected one sub_once replacement implementation')
          path.write_text(source.replace(old,new,1),encoding='utf-8')
          PY
          python .github/time-month-browser-v1.py
          python - <<'PY'
          from pathlib import Path
          time_path=Path('evia-approved-time-monthly-packs-v1.js')
          time=time_path.read_text(encoding='utf-8')
          old='.evia-time-month-option{flex:0 0 70%;min-width:70%;'
          new='.evia-time-month-option{flex:0 0 100%;min-width:100%;'
          if time.count(old)!=1:
              raise SystemExit('Expected one month option width rule')
          time_path.write_text(time.replace(old,new,1),encoding='utf-8')

          test_path=Path('tests/time-only-redesign.spec.js')
          test=test_path.read_text(encoding='utf-8')
          test=test.replace(r'/function renderTimeTimeline\\(/g',r'/function renderTimeTimeline\(/g')
          test=test.replace(r'/evia-approved-time-monthly-packs-v1\\.js/g',r'/evia-approved-time-monthly-packs-v1\.js/g')
          old_back="await page.locator('#backButton').click();"
          if test.count(old_back)!=1:
              raise SystemExit('Expected one Time evidence back interaction')
          test=test.replace(old_back,"await page.evaluate(() => document.getElementById('backButton').click());",1)
          old_source="expect(time).toContain('flex:0 0 70%');"
          if test.count(old_source)!=1:
              raise SystemExit('Expected one carousel source assertion')
          test=test.replace(old_source,"expect(time).toContain('padding:7px 15%');",1)
          test_path.write_text(test,encoding='utf-8')
          PY
      - name: Verify source syntax
        run: |
          node --check evia-approved-time-monthly-packs-v1.js
          node --check evia-runtime-manifest.js
          node --check tests/time-only-redesign.spec.js
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Run Time and EPA integration regressions
        run: npx playwright test tests/time-only-redesign.spec.js tests/epa-menu.spec.js --reporter=line
      - name: Run complete Evia smoke suite
        run: npm run test:smoke
      - name: Verify approved change scope only
        run: |
          git checkout -- .github/time-month-browser-v1.py
          git diff --name-only HEAD | sort > /tmp/changed
          printf '%s\n' evia-approved-time-monthly-packs-v1.js evia-runtime-manifest.js index.html tests/epa-menu.spec.js tests/time-only-redesign.spec.js | sort > /tmp/allowed
          diff -u /tmp/allowed /tmp/changed
      - name: Commit verified month browser and remove temporary tooling
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/time-month-browser-v1.py .github/workflows/time-month-browser-v1.yml
          git add evia-approved-time-monthly-packs-v1.js evia-runtime-manifest.js index.html tests/epa-menu.spec.js tests/time-only-redesign.spec.js
          git commit -m 'Make Time a monthly evidence browser'
          git push origin HEAD:time-month-browser-v1
