name: Apply approved Evia PWA update
on:
  push:
    paths: [.github/workflows/apply-evia-pwa.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Apply Evia PWA update
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,json,math,struct,zlib
          p=Path('index.html'); s=p.read_text()
          def sub(pattern,repl,label,flags=0):
              global s
              s,n=re.subn(pattern,repl,s,count=1,flags=flags)
              if n!=1: raise SystemExit(f'{label}: {n} matches')
          sub(r'  <title>Evia</title>', '''  <title>Evia</title>
            <link rel="manifest" href="./manifest.webmanifest">
            <link rel="icon" type="image/png" sizes="192x192" href="./icons/evia-192.png">
            <link rel="apple-touch-icon" sizes="180x180" href="./icons/evia-180.png">
            <meta name="mobile-web-app-capable" content="yes">
            <meta name="apple-mobile-web-app-capable" content="yes">
            <meta name="apple-mobile-web-app-status-bar-style" content="default">
            <meta name="apple-mobile-web-app-title" content="Evia">''','head')
          sub(r'    \.evia-character\.happy-eyes \.eye \{.*?\n    \}', '''    .evia-character.talk-eyes .eye {
              width: 0.235em; height: 0.165em;
              border: 0.022em solid var(--evia-yellow);
              border-radius: 54% 54% 7% 7% / 76% 76% 12% 12%;
              background: transparent; transform: translateY(0.012em);
              transition: width 220ms ease, height 220ms ease, border-radius 220ms ease, transform 220ms ease, clip-path 220ms ease;
            }
            .evia-character.talk-expression-a .eye:first-child { transform: translateY(0.012em) rotate(-2deg); }
            .evia-character.talk-expression-a .eye:last-child { transform: translateY(0.012em) rotate(2deg); }
            .evia-character.talk-expression-b .eye:first-child { clip-path: polygon(0 13%,100% 0,100% 100%,0 100%); transform: translateY(0.008em); }
            .evia-character.talk-expression-b .eye:last-child { height: 0.178em; transform: translateY(0.004em); }
            .evia-character.talk-expression-c .eye:first-child { height: 0.178em; transform: translateY(0.004em); }
            .evia-character.talk-expression-c .eye:last-child { clip-path: polygon(0 0,100% 13%,100% 100%,0 100%); transform: translateY(0.008em); }''','eyes',re.S)
          sub(r'    \.speech-line \{.*?    \.speech-word \{.*?\n    \}', '''    .speech-line { width: 100%; min-height: 21px; line-height: 1.45; white-space: normal; }
            .speech-line-reveal {
              opacity: 0; transform: translateX(-8px);
              -webkit-mask-image: linear-gradient(90deg,#000 0%,#000 66%,transparent 100%);
              mask-image: linear-gradient(90deg,#000 0%,#000 66%,transparent 100%);
              -webkit-mask-size: 240% 100%; mask-size: 240% 100%;
              -webkit-mask-position: 100% 0; mask-position: 100% 0;
              animation: speechLineReveal 720ms cubic-bezier(0.22,1,0.36,1) forwards;
            }''','speech css',re.S)
          sub(r'    \.chat-icon \{', '''    .chat-exit-button {
              position: absolute; right: max(14px, env(safe-area-inset-right));
              top: calc(max(14px, env(safe-area-inset-top)) + 8px);
              min-width: 72px; min-height: 42px; border-radius: 999px;
              border: 1.5px solid rgba(245,196,0,.38); background: rgba(250,249,242,.97);
              color: rgba(45,45,45,.68); padding: 0 16px; display: flex;
              align-items: center; justify-content: center; cursor: pointer; z-index: 31;
            }

            .chat-icon {''','exit css')
          sub(r'    @keyframes speechWordIn \{.*?\n    \}', '''    @keyframes speechLineReveal {
              0% { opacity:0; transform:translateX(-8px); -webkit-mask-position:100% 0; mask-position:100% 0; }
              20% { opacity:1; }
              100% { opacity:1; transform:translateX(0); -webkit-mask-position:0% 0; mask-position:0% 0; }
            }''','keyframe',re.S)
          s=s.replace('      .speech-word,','      .speech-line-reveal,')
          sub(r'(<div class="overlay-panel" id="chatPanel" aria-hidden="true">\n)',r'\1      <button class="chat-exit-button" id="chatExitButton" type="button">Exit</button>\n','exit html')
          s=s.replace("    const chatButton = document.getElementById('chatButton');\n","    const chatButton = document.getElementById('chatButton');\n    const chatExitButton = document.getElementById('chatExitButton');\n",1)
          s=s.replace('    let speechRunId = 0;\n','    let speechRunId = 0;\n    let talkExpressionInterval = null;\n    let talkExpressionStep = 0;\n',1)
          sub(r'    function stopTalking\(clearText = false\) \{.*?\n    \}', '''    function stopTalkExpressions() {
              if (talkExpressionInterval) clearInterval(talkExpressionInterval);
              talkExpressionInterval = null;
              evia.classList.remove('talk-expression-a','talk-expression-b','talk-expression-c');
            }
            function startTalkExpressions() {
              stopTalkExpressions();
              const expressions=['talk-expression-a','talk-expression-b','talk-expression-c'];
              const apply=()=>{ evia.classList.remove(...expressions); evia.classList.add(expressions[talkExpressionStep++%expressions.length]); };
              apply(); talkExpressionInterval=setInterval(apply,620);
            }
            function stopTalking(clearText = false) {
              speechRunId += 1; stopTalkExpressions();
              evia.classList.remove('talking','talk-eyes'); eviaFloat?.classList.remove('talking');
              if (clearText) eviaSpeech.innerHTML = '';
            }''','stop talking',re.S)
          sub(r'    async function speak\(lines\) \{.*?\n    \}\n\n    function homeSpeechLines', '''    async function speak(lines) {
              stopTalking(true); const runId=speechRunId; const cleanLines=lines.filter(Boolean);
              if (!cleanLines.length) return true;
              if (window.matchMedia?.('(prefers-reduced-motion: reduce)').matches) { setSpeech(cleanLines); return true; }
              evia.classList.add('talking','talk-eyes'); eviaFloat?.classList.add('talking'); startTalkExpressions();
              root.style.setProperty('--eye-x','0em'); root.style.setProperty('--eye-y','0em');
              for (let i=0;i<cleanLines.length;i+=1) {
                if (runId!==speechRunId) return false;
                const line=document.createElement('div'); line.className='speech-line speech-line-reveal';
                line.textContent=cleanLines[i]; eviaSpeech.appendChild(line); await wait(760);
                if (i<cleanLines.length-1) await wait(170);
              }
              if (runId!==speechRunId) return false; await wait(160); if (runId!==speechRunId) return false;
              stopTalkExpressions(); evia.classList.remove('talking','talk-eyes'); eviaFloat?.classList.remove('talking'); blink(true); return true;
            }

            function homeSpeechLines''','speak',re.S)
          s=s.replace("    chatButton.addEventListener('click', openChat);\n","    chatButton.addEventListener('click', openChat);\n    chatExitButton.addEventListener('click', closeChat);\n",1)
          s=s.replace("    document.addEventListener('visibilitychange', () => {","    if ('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));\n\n    document.addEventListener('visibilitychange', () => {",1)
          p.write_text(s)
          manifest={"name":"Evia","short_name":"Evia","description":"Evia learner assistant","id":"./","start_url":"./","scope":"./","display":"standalone","orientation":"portrait","background_color":"#ffffff","theme_color":"#ffffff","icons":[{"src":"./icons/evia-192.png","sizes":"192x192","type":"image/png","purpose":"any"},{"src":"./icons/evia-512.png","sizes":"512x512","type":"image/png","purpose":"any maskable"}]}
          Path('manifest.webmanifest').write_text(json.dumps(manifest,indent=2)+'\n')
          Path('service-worker.js').write_text('''const C='evia-pwa-v1',F=['./','./index.html','./manifest.webmanifest','./icons/evia-180.png','./icons/evia-192.png','./icons/evia-512.png'];
          self.addEventListener('install',e=>{e.waitUntil(caches.open(C).then(c=>c.addAll(F)));self.skipWaiting()});
          self.addEventListener('activate',e=>{e.waitUntil(caches.keys().then(k=>Promise.all(k.filter(x=>x!==C).map(x=>caches.delete(x)))));self.clients.claim()});
          self.addEventListener('fetch',e=>{if(e.request.method!=='GET')return;if(e.request.mode==='navigate'){e.respondWith(fetch(e.request).then(r=>{let x=r.clone();caches.open(C).then(c=>c.put('./index.html',x));return r}).catch(()=>caches.match('./index.html')));return}e.respondWith(caches.match(e.request).then(x=>x||fetch(e.request).then(r=>{if(new URL(e.request.url).origin===self.location.origin){let x=r.clone();caches.open(C).then(c=>c.put(e.request,x))}return r})))});
          ''')
          def chunk(t,d): return struct.pack('>I',len(d))+t+d+struct.pack('>I',zlib.crc32(t+d)&0xffffffff)
          def icon(n):
              c=n/2; fr=n*.285; er=n*.06; dx=n*.078; rows=[]
              for y in range(n):
                  row=bytearray()
                  for x in range(n):
                      d=math.hypot(x+.5-c,y+.5-c)
                      col=(255,250,225) if d<fr*1.1 else (255,252,235) if d<fr*1.25 else (255,254,245) if d<fr*1.42 else (255,255,255)
                      if abs(d-fr)<=max(2,n*.014): col=(245,196,0)
                      for ex in (c-dx,c+dx):
                          if abs(math.hypot(x+.5-ex,y+.5-c)-er)<=max(1,n*.01): col=(245,196,0)
                      row.extend((*col,255))
                  rows.append(bytes(row))
              raw=b''.join(b'\0'+r for r in rows); h=struct.pack('>IIBBBBB',n,n,8,6,0,0,0)
              return b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',h)+chunk(b'IDAT',zlib.compress(raw,9))+chunk(b'IEND',b'')
          Path('icons').mkdir(exist_ok=True)
          for n in (180,192,512): Path(f'icons/evia-{n}.png').write_bytes(icon(n))
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          for x in ('chatExitButton','talk-eyes','speech-line-reveal','manifest.webmanifest','service-worker.js'):
              assert x in s,x
          m=re.search(r'<script>([\s\S]*?)</script>',s); assert m
          Path('/tmp/evia.js').write_text(m.group(1))
          PY
          node --check /tmp/evia.js
          python3 -m json.tool manifest.webmanifest >/dev/null
          test -s icons/evia-180.png && test -s icons/evia-192.png && test -s icons/evia-512.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/apply-evia-pwa.yml
          git add -A
          git commit -m "Refine Evia speech and add installable app"
          git push
