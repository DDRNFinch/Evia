name: Sync Evia Beta into Evia

on:
  push:
    branches:
      - sync/evia-beta-v85

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Evia destination branch
        uses: actions/checkout@v4
        with:
          ref: sync/evia-beta-v85
          fetch-depth: 0

      - name: Fetch Evia Beta
        run: git clone --depth 1 --branch main https://github.com/DDRNFinch/Evia_beta.git /tmp/evia-beta

      - name: Replace destination tree with Beta
        shell: bash
        run: |
          rsync -a --delete --exclude='.git/' /tmp/evia-beta/ ./
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Evia already matches Evia Beta."
            exit 0
          fi
          git commit -m "Sync Evia main from Evia Beta v85"
          git push origin HEAD:sync/evia-beta-v85
