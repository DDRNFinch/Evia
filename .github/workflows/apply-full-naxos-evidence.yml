name: Apply full Naxos evidence display
on:
  push:
    paths:
      - .github/workflows/apply-full-naxos-evidence.yml
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply approved Naxos evidence display
        shell: bash
        run: |
          python3 .github/fix_naxos_patch.py
          python3 .github/patch_naxos_evidence.py
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          m=re.search(r'<script>(.*)</script>',s,re.S)
          if not m: raise SystemExit('script not found')
          Path('/tmp/evia.js').write_text(m.group(1))
          PY
          node --check /tmp/evia.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Show full Naxos evidence guidance in Evia'
          git push
          git rm .github/workflows/apply-full-naxos-evidence.yml .github/patch_naxos_evidence.py .github/fix_naxos_patch.py
          git commit -m 'Remove temporary Naxos evidence patch files'
          git push
