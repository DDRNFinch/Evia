name: Apply full Naxos evidence display
on:
  push:
    paths:
      - .github/workflows/apply-full-naxos-evidence.yml
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve and display full Naxos evidence wording
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()

          def replace_once(old, new, label):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              s = s.replace(old, new, 1)

          replace_once(
          '''    .evidence-choice {
      width: 100%;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px 18px;
      color: rgba(45, 45, 45, 0.68);
      cursor: pointer;
    }

    .evidence-choice strong { font-weight: 600; }
''',
          '''    .evidence-choice {
      width: 100%;
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      gap: 4px;
      padding: 14px 18px;
      color: rgba(45, 45, 45, 0.68);
      text-align: left;
      cursor: pointer;
      overflow-y: auto;
    }

    .evidence-choice-heading {
      font-size: 12px;
      font-weight: 600;
      color: rgba(45, 45, 45, 0.58);
      letter-spacing: 0.02em;
    }

    .evidence-choice-detail {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .evidence-choice-detail + .evidence-choice-detail {
      margin-top: 5px;
      padding-top: 7px;
      border-top: 1px solid rgba(245, 196, 0, 0.2);
    }

    .evidence-choice-type {
      font-size: 14px;
      font-weight: 600;
      color: rgba(45, 45, 45, 0.82);
    }

    .evidence-choice-label {
      font-size: 13px;
      font-weight: 600;
      color: rgba(45, 45, 45, 0.74);
    }

    .evidence-choice-instruction {
      font-size: 12px;
      line-height: 1.38;
      color: rgba(45, 45, 45, 0.66);
    }
''', 'evidence choice css')

          replace_once(
          '''    .evidence-requirements h2 {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 10px;
      color: rgba(45, 45, 45, 0.82);
    }
''',
          '''    .evidence-requirements h2 {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 10px;
      color: rgba(45, 45, 45, 0.82);
    }

    .evidence-requirements ul {
      margin: 0;
      padding-left: 19px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .evidence-requirements li {
      padding-left: 2px;
      font-size: 13px;
      line-height: 1.38;
    }
''', 'requirements css')

          replace_once('<h2>Evidence Requirements</h2>', '<h2 id="requirementsHeading">Evidence Requirements</h2>', 'requirements heading html')
          replace_once(
          "    const evidenceRequirements = document.getElementById('evidenceRequirements');\n    const requirementsText = document.getElementById('requirementsText');",
          "    const evidenceRequirements = document.getElementById('evidenceRequirements');\n    const requirementsHeading = document.getElementById('requirementsHeading');\n    const requirementsText = document.getElementById('requirementsText');",
          'requirements heading dom')

          replace_once(
          '''    function normaliseEvidenceOption(option, fallbackLabel) {
      if (!option) return null;
      if (typeof option === 'string') return { label: option.trim() || fallbackLabel, type: 'text' };
      if (typeof option !== 'object') return null;
      const label = cleanText(option.label || option.name || option.title) || fallbackLabel;
      const rawType = cleanText(option.type || option.method || option.evidenceType).toLowerCase();
      let type = 'text';
      if (['camera', 'video', 'photo'].includes(rawType)) type = 'camera';
      if (['audio', 'microphone', 'voice', 'reflection'].includes(rawType)) type = 'audio';
      if (['text', 'written', 'writing'].includes(rawType)) type = 'text';
      return { label, type };
    }
''',
          '''    function evidenceTypeDisplayLabel(value) {
      const raw = cleanText(value).toLowerCase();
      const labels = {
        video: 'Video', photos: 'Photos', photo: 'Photo', camera: 'Camera',
        audio: 'Audio', microphone: 'Audio', voice: 'Audio', reflection: 'Reflection',
        text: 'Written', written: 'Written', writing: 'Written', document: 'Document',
        witness: 'Witness statement', observation: 'Assessor observation'
      };
      return labels[raw] || cleanText(value);
    }

    function normaliseEvidenceDetail(item) {
      if (!item) return null;
      if (typeof item === 'string') return { displayType: '', label: cleanText(item), instruction: '' };
      if (typeof item !== 'object') return null;
      const rawType = cleanText(item.type || item.method || item.evidenceType);
      return {
        displayType: cleanText(item.displayType || item.typeLabel) || evidenceTypeDisplayLabel(rawType),
        label: cleanText(item.label || item.name || item.title),
        instruction: cleanText(item.instruction || item.description || item.guidance || item.text)
      };
    }

    function normaliseEvidenceOption(option, fallbackLabel) {
      if (!option) return null;
      if (typeof option === 'string') return { label: option.trim() || fallbackLabel, type: 'text', displayType: '', instruction: '', details: [] };
      if (typeof option !== 'object') return null;
      const label = cleanText(option.label || option.name || option.title) || fallbackLabel;
      const rawType = cleanText(option.type || option.method || option.evidenceType).toLowerCase();
      let type = 'text';
      if (['camera', 'video', 'photo', 'photos'].includes(rawType)) type = 'camera';
      if (['audio', 'microphone', 'voice', 'reflection'].includes(rawType)) type = 'audio';
      if (['text', 'written', 'writing'].includes(rawType)) type = 'text';
      const details = Array.isArray(option.details) ? option.details.map(normaliseEvidenceDetail).filter(Boolean) : [];
      return {
        label,
        type,
        displayType: cleanText(option.displayType || option.typeLabel) || evidenceTypeDisplayLabel(rawType),
        instruction: cleanText(option.instruction || option.description || option.guidance || option.text),
        details
      };
    }
''', 'evidence option normaliser')

          replace_once(
          '''        normalised.recommended = normaliseEvidenceOption(node.recommended || node.recommendedEvidence, 'Recommended');
        normalised.alternative = normaliseEvidenceOption(node.alternative || node.alternativeEvidence, 'Alternative');
        normalised.requirements = cleanText(node.requirements || node.evidenceRequirements || node.evidence || node.guidance);
''',
          '''        const recommendedSource = node.recommended || node.recommendedEvidence || (Array.isArray(node.preferred) ? {
          label: node.preferred.map((item) => cleanText(item?.label || item?.type)).filter(Boolean).join(' + '),
          type: node.preferred[0]?.type,
          details: node.preferred
        } : null);
        const alternativeSource = node.alternative || node.alternativeEvidence || (Array.isArray(node.alternatives) && node.alternatives.length ? {
          label: cleanText(node.alternatives[0]?.label) || 'Alternative',
          type: node.alternatives[0]?.type,
          details: node.alternatives
        } : null);
        normalised.recommended = normaliseEvidenceOption(recommendedSource, 'Recommended');
        normalised.alternative = normaliseEvidenceOption(alternativeSource, 'Alternative');

        const requirementObject = node.evidenceRequirements && typeof node.evidenceRequirements === 'object' && !Array.isArray(node.evidenceRequirements)
          ? node.evidenceRequirements
          : null;
        const rawRequirementItems = node.requirementItems || node.requirementsItems || node.capture || requirementObject?.items || requirementObject?.bullets || (Array.isArray(node.evidenceRequirements) ? node.evidenceRequirements : []);
        const requirementItems = Array.isArray(rawRequirementItems) ? rawRequirementItems.map(cleanText).filter(Boolean) : [];
        const requirementText = cleanText(node.requirements || (typeof node.evidenceRequirements === 'string' ? node.evidenceRequirements : '') || node.evidence || node.guidance);
        normalised.requirementsHeading = cleanText(node.requirementsHeading || requirementObject?.heading || requirementObject?.title);
        normalised.requirementItems = requirementItems;
        normalised.requirements = requirementItems.length ? requirementItems.join('\n') : requirementText;
''', 'node evidence normalisation')

          replace_once(
          '''    function renderEvidenceChoices(animateIn = false) {
      stopCapture();
      captureMode = null;
      activeEvidenceMethod = null;
      evidenceTop.innerHTML = '';

      const choices = [
        ['Recommended', activeEvidence?.recommended],
        ['Alternative', activeEvidence?.alternative]
      ].filter(([, option]) => option && cleanText(option.label));

      choices.forEach(([heading, option]) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = `evidence-choice${animateIn ? ' evidence-enter' : ''}`;
        button.dataset.evidenceType = option.type || 'text';
        button.dataset.evidenceHeading = heading;
        button.dataset.evidenceLabel = option.label;
        button.innerHTML = `<strong>${heading}</strong>&nbsp;&nbsp;${option.label}`;
        evidenceTop.appendChild(button);
      });

      evidenceTop.style.gridTemplateRows = choices.length === 1 ? '1fr' : '1fr 1fr';
      if (!animateIn) {
        evidenceRequirements.classList.remove('evidence-enter', 'reveal-step');
      }
      updateBackButton();
      return [...evidenceTop.querySelectorAll('.evidence-choice')];
    }
''',
          '''    function appendEvidenceChoiceContent(button, heading, option) {
      const headingElement = document.createElement('div');
      headingElement.className = 'evidence-choice-heading';
      headingElement.textContent = heading;
      button.appendChild(headingElement);

      const details = Array.isArray(option?.details) && option.details.length
        ? option.details
        : [{ displayType: option?.displayType || '', label: option?.label || '', instruction: option?.instruction || '' }];

      details.forEach((detail) => {
        const cleanDetail = normaliseEvidenceDetail(detail);
        if (!cleanDetail) return;
        const wrap = document.createElement('div');
        wrap.className = 'evidence-choice-detail';
        if (cleanDetail.displayType) {
          const typeElement = document.createElement('div');
          typeElement.className = 'evidence-choice-type';
          typeElement.textContent = cleanDetail.displayType;
          wrap.appendChild(typeElement);
        }
        if (cleanDetail.label) {
          const labelElement = document.createElement('div');
          labelElement.className = 'evidence-choice-label';
          labelElement.textContent = cleanDetail.label;
          wrap.appendChild(labelElement);
        }
        if (cleanDetail.instruction) {
          const instructionElement = document.createElement('div');
          instructionElement.className = 'evidence-choice-instruction';
          instructionElement.textContent = cleanDetail.instruction;
          wrap.appendChild(instructionElement);
        }
        button.appendChild(wrap);
      });
    }

    function renderEvidenceChoices(animateIn = false) {
      stopCapture();
      captureMode = null;
      activeEvidenceMethod = null;
      evidenceTop.innerHTML = '';

      const choices = [
        ['Recommended', activeEvidence?.recommended],
        ['Alternative', activeEvidence?.alternative]
      ].filter(([, option]) => option && (cleanText(option.label) || (Array.isArray(option.details) && option.details.length)));

      choices.forEach(([heading, option]) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = `evidence-choice${animateIn ? ' evidence-enter' : ''}`;
        button.dataset.evidenceType = option.type || 'text';
        button.dataset.evidenceHeading = heading;
        button.dataset.evidenceLabel = option.label || heading;
        appendEvidenceChoiceContent(button, heading, option);
        evidenceTop.appendChild(button);
      });

      evidenceTop.style.gridTemplateRows = choices.length === 1 ? '1fr' : '1fr 1fr';
      if (!animateIn) {
        evidenceRequirements.classList.remove('evidence-enter', 'reveal-step');
      }
      updateBackButton();
      return [...evidenceTop.querySelectorAll('.evidence-choice')];
    }
''', 'evidence renderer')

          replace_once(
          '''    async function openEvidence(node) {
      activeEvidence = node;
      screen.classList.remove('pills-ready', 'evidence-ready');
      screen.classList.add('evidence-open');
      evidenceTop.innerHTML = '';

      const requirements = cleanText(node.requirements);
      evidenceRequirements.style.display = requirements ? 'block' : 'none';
      evidenceRequirements.classList.remove('reveal-step');
      requirementsText.textContent = requirements;
      evidenceScreen.style.gridTemplateRows = requirements ? '1fr 1fr' : '1fr';
      updateBackButton();

      const evidenceAtStart = activeEvidence;
      const finished = await speak(evidenceSpeechLines());
      if (!finished || activeEvidence !== evidenceAtStart || !screen.classList.contains('evidence-open')) return;
      await revealEvidenceOptions();
    }
''',
          '''    function renderEvidenceRequirements(node) {
      const items = Array.isArray(node?.requirementItems) ? node.requirementItems.map(cleanText).filter(Boolean) : [];
      const text = cleanText(node?.requirements);
      const hasRequirements = items.length > 0 || Boolean(text);
      requirementsHeading.textContent = cleanText(node?.requirementsHeading) || (items.length ? 'What the evidence must show or explain' : 'Evidence Requirements');
      requirementsText.innerHTML = '';
      if (items.length) {
        const list = document.createElement('ul');
        items.forEach((item) => {
          const li = document.createElement('li');
          li.textContent = item;
          list.appendChild(li);
        });
        requirementsText.appendChild(list);
      } else if (text) {
        requirementsText.textContent = text;
      }
      return hasRequirements;
    }

    async function openEvidence(node) {
      activeEvidence = node;
      screen.classList.remove('pills-ready', 'evidence-ready');
      screen.classList.add('evidence-open');
      evidenceTop.innerHTML = '';

      const hasRequirements = renderEvidenceRequirements(node);
      evidenceRequirements.style.display = hasRequirements ? 'block' : 'none';
      evidenceRequirements.classList.remove('reveal-step');
      evidenceScreen.style.gridTemplateRows = hasRequirements ? '1fr 1fr' : '1fr';
      updateBackButton();

      const evidenceAtStart = activeEvidence;
      const finished = await speak(evidenceSpeechLines());
      if (!finished || activeEvidence !== evidenceAtStart || !screen.classList.contains('evidence-open')) return;
      await revealEvidenceOptions();
    }
''', 'requirements renderer')

          replace_once(
          '''    function naxosPreferredOption(profile) {
      const preferred = Array.isArray(profile?.preferred) ? profile.preferred : [];
      if (!preferred.length) return { label: 'Written evidence', type: 'text' };
      const label = preferred.map((item) => cleanText(item?.label || item?.type)).filter(Boolean).join(' + ') || 'Recommended evidence';
      const typeSource = preferred.map((item) => `${item?.type || ''} ${item?.label || ''} ${item?.instruction || ''}`).join(' ');
      return { label, type: naxosCaptureType(typeSource) };
    }

    function naxosAlternativeOption(profile) {
      const alternative = Array.isArray(profile?.alternatives) ? profile.alternatives[0] : null;
      if (!alternative) return null;
      const label = cleanText(alternative.label) || 'Alternative evidence';
      return { label, type: naxosCaptureType(`${label} ${alternative.instruction || ''}`) };
    }

    function naxosTaskRequirements(task, registry, profile) {
      const lines = [];
      const prompt = cleanText(task?.conditionalPrompt);
      if (prompt) lines.push(prompt);
      const capture = Array.isArray(profile?.capture) ? profile.capture.map(cleanText).filter(Boolean) : [];
      if (capture.length) lines.push(`Evidence must show or explain: ${capture.join(' • ')}`);
      const ksbs = Array.isArray(task?.ksbTargets) ? task.ksbTargets : [];
      if (ksbs.length) {
        const wording = ksbs.map((id) => {
          const text = cleanText(registry?.items?.[id]);
          return text ? `${id} — ${text}` : id;
        });
        lines.push(`KSBs this task can support:\n${wording.join('\n')}`);
      }
      return lines.join('\n\n');
    }
''',
          '''    function naxosPreferredOption(profile) {
      const preferred = Array.isArray(profile?.preferred) ? profile.preferred : [];
      if (!preferred.length) return { label: 'Written evidence', type: 'text', details: [] };
      const details = preferred.map((item) => ({
        displayType: evidenceTypeDisplayLabel(item?.type),
        label: cleanText(item?.label),
        instruction: cleanText(item?.instruction)
      }));
      const label = preferred.map((item) => cleanText(item?.label || item?.type)).filter(Boolean).join(' + ') || 'Recommended evidence';
      const typeSource = preferred.map((item) => `${item?.type || ''} ${item?.label || ''} ${item?.instruction || ''}`).join(' ');
      return { label, type: naxosCaptureType(typeSource), details };
    }

    function naxosAlternativeOption(profile) {
      const alternative = Array.isArray(profile?.alternatives) ? profile.alternatives[0] : null;
      if (!alternative) return null;
      const label = cleanText(alternative.label) || 'Alternative evidence';
      return {
        label,
        type: naxosCaptureType(`${label} ${alternative.instruction || ''}`),
        details: [{ displayType: evidenceTypeDisplayLabel(alternative.type), label, instruction: cleanText(alternative.instruction) }]
      };
    }

    function naxosTaskRequirements(task, registry, profile) {
      const items = Array.isArray(profile?.capture) ? profile.capture.map(cleanText).filter(Boolean) : [];
      const prompt = cleanText(task?.conditionalPrompt);
      if (prompt) items.push(prompt);
      return items;
    }
''', 'Naxos evidence preservation')

          replace_once(
          '''            return {
              label: cleanText(task?.title) || cleanText(task?.id) || 'Task',
              recommended: naxosPreferredOption(profile),
              alternative: naxosAlternativeOption(profile),
              requirements: naxosTaskRequirements(task, registry, profile)
            };
''',
          '''            const requirementItems = naxosTaskRequirements(task, registry, profile);
            return {
              label: cleanText(task?.title) || cleanText(task?.id) || 'Task',
              recommended: naxosPreferredOption(profile),
              alternative: naxosAlternativeOption(profile),
              requirementsHeading: 'What the evidence must show or explain',
              requirementItems,
              requirements: requirementItems.join('\n')
            };
''', 'Naxos course build requirements')

          p.write_text(s)
          PY

          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          banned=['Evidence must show or explain: ${capture.join', 'KSBs this task can support:']
          for x in banned:
              if x in s: raise SystemExit(f'old evidence formatting remains: {x}')
          required=[
            "requirementsHeading: 'What the evidence must show or explain'",
            "instruction: cleanText(item?.instruction)",
            "className = 'evidence-choice-instruction'",
            "const requirementItems = naxosTaskRequirements(task, registry, profile);"
          ]
          for x in required:
              if x not in s: raise SystemExit(f'missing expected update: {x}')
          scripts=re.findall(r'<script>(.*?)</script>',s,re.S)
          if not scripts: raise SystemExit('inline JavaScript not found')
          Path('/tmp/evia.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/evia.js

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Show full Naxos evidence guidance in Evia"
          git rm .github/workflows/apply-full-naxos-evidence.yml
          git commit -m "Remove temporary Naxos evidence workflow"
          git push
