name: Deploy Evia v42
on:
  push:
    branches:
      - agent/v42-trowel-migration
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout transfer branch
        uses: actions/checkout@v4
        with:
          ref: agent/v42-trowel-migration
          path: transfer
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: repo
      - name: Reconstruct v42 delta
        shell: bash
        run: |
          cat transfer/.v42-transfer/chunk* | base64 -d > /tmp/evia-v42.tgz
          tar -xzf /tmp/evia-v42.tgz -C repo
      - name: Validate v42 files
        shell: bash
        run: |
          cd repo
          test -f course-packs/Trowel_Occupations_6570-05_v1.0.nisi
          node --check assets/evia-course-packs.js
          node --check assets/evia-course-context.js
          node --check assets/evia-trowel-pack-migration.js
          node --check assets/evia-trowel-pack-cutover.js
          node --check assets/evia-nvq.js
          node --check assets/evia-rpl-course.js
          node --check assets/evia-selfobs-live.js
          node --check assets/evia-targets.js
          python -m json.tool course-packs/Trowel_Occupations_6570-05_v1.0.nisi >/dev/null
          python -m json.tool course-packs/schema-v1.json >/dev/null
          python -m json.tool update.json >/dev/null
          python -m json.tool public/update.json >/dev/null
          grep -q 'evia-app-version" content="42' index.html
          grep -q 'evia-trowel-pack-migration.js?v=42' index.html
          grep -q 'evia-trowel-pack-cutover.js?v=42' index.html
      - name: Commit v42 to main
        shell: bash
        run: |
          cd repo
          git config user.name "Evia Migration"
          git config user.email "actions@users.noreply.github.com"
          git add assets/evia-course-context.js assets/evia-course-packs.js assets/evia-nvq.js assets/evia-rpl-course.js assets/evia-selfobs-live.js assets/evia-targets.js assets/evia-trowel-pack-cutover.js assets/evia-trowel-pack-migration.js course-packs/Trowel_Occupations_6570-05_v1.0.nisi course-packs/schema-v1.json index.html public/sw.js public/update.json sw.js update.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Evia v42: migrate Trowel Occupations 6570-05 to Nisi pack"
          git push origin HEAD:main
      - name: Remove temporary branch
        if: success()
        shell: bash
        run: |
          cd repo
          git push origin --delete agent/v42-trowel-migration || true
