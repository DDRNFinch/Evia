name: Verify Evia 95
on:
  push:
    branches: [main]
    paths:
      - 'assets/evia-next-visit-v95.js'
      - 'assets/evia-version-v94.js'
      - 'index.html'
      - 'sw.js'
      - 'update.json'
      - 'public/update.json'
      - 'tests/next-visit-v95.test.mjs'
      - '.github/workflows/verify-v95.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check assets/evia-next-visit-v95.js
      - run: node --check assets/evia-version-v94.js
      - run: node --check sw.js
      - run: node --test tests/next-visit-v95.test.mjs
      - run: python -m json.tool update.json >/dev/null
      - run: python -m json.tool public/update.json >/dev/null
      - run: grep -q 'evia-app-version" content="95' index.html
      - run: grep -q 'evia-next-visit-v95.js?v=95' index.html
