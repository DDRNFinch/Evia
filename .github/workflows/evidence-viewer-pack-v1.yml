name: Evidence viewer pack v1
# verification rerun 5

on:
  push:
    branches: [evidence-viewer-pack-v1]
    paths:
      - '.github/workflows/evidence-viewer-pack-v1.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: evidence-viewer-pack-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply approved viewer integration
        run: python .github/evidence-viewer-pack-v1.py
      - name: Verify JavaScript syntax
        run: |
          node --check evia-evidence-viewer-pack-v1.js
          node --check evia-approved-time-monthly-packs-v1.js
          node --check evia-runtime-manifest.js
          node --check tests/evidence-viewer-pack.spec.js
          node --check tests/time-only-redesign.spec.js
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Run viewer and Time regressions
        run: npx playwright test tests/evidence-viewer-pack.spec.js tests/time-only-redesign.spec.js --reporter=line
      - name: Run complete Evia smoke suite
        run: npm run test:smoke
      - name: Verify approved app change scope only
        run: |
          { git diff --name-only origin/main...HEAD; git diff --name-only; } | sort -u \
            | grep -vF '.github/evidence-viewer-pack-v1.py' \
            | grep -vF '.github/workflows/evidence-viewer-pack-v1.yml' \
            > /tmp/changed
          printf '%s\n' index.html evia-evidence-viewer-pack-v1.js evia-approved-time-monthly-packs-v1.js evia-runtime-manifest.js tests/evidence-viewer-pack.spec.js tests/time-only-redesign.spec.js | sort > /tmp/allowed
          diff -u /tmp/allowed /tmp/changed
      - name: Commit verified update and remove temporary tooling
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/evidence-viewer-pack-v1.py .github/workflows/evidence-viewer-pack-v1.yml
          git add index.html evia-evidence-viewer-pack-v1.js evia-approved-time-monthly-packs-v1.js evia-runtime-manifest.js tests/evidence-viewer-pack.spec.js tests/time-only-redesign.spec.js
          git commit -m 'Add portable offline evidence viewer'
          git push origin HEAD:evidence-viewer-pack-v1
