name: Verify Evia 98 motion

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-motion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check motion JavaScript syntax
        run: |
          node --check assets/evia-avatar-motion.js
          node --check assets/evia-version-v98.js
          node --check sw.js
      - name: Run Evia 98 motion regression tests
        run: node --test tests/motion-v98.test.mjs
      - name: Validate update manifest
        run: python -m json.tool update.json >/dev/null
      - name: Verify shell version
        run: |
          grep -q 'evia-app-version" content="98' index.html
          grep -q 'evia-avatar-motion.js?v=98' index.html
          grep -q 'evia-avatar-motion.css?v=98' index.html
          grep -q "evia-shell-v98" sw.js
