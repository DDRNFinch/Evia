name: Apply approved Evia chat update
on:
  push:
    paths:
      - .github/workflows/apply-evia-chat.yml
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified Evia chat build
        shell: bash
        run: |
          cat .evia-transfer/chat-00.b64 .evia-transfer/chat-01.b64 .evia-transfer/chat-02.b64 .evia-transfer/chat-03.b64 > /tmp/evia-chat.b64
          base64 -d /tmp/evia-chat.b64 | gzip -d > index.html
          test "$(git hash-object index.html)" = "75255f9272a64e6ca00eba5a72dd55d418b453c7"
          rm -rf .evia-transfer
          rm .github/workflows/apply-evia-chat.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Evia quick chat, reviews and staged evidence reveal"
          git push
