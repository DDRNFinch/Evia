name: Apply approved Evia arch detail pages fixed
on:
  push:
    paths:
      - '.github/workflows/apply-arch-detail-pages-fixed.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply approved patches
        run: |
          python .tmp_arch_pages_ui.py
          python .tmp_arch_pages_import.py
      - name: Validate app
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          start=s.rfind('<script>')+len('<script>')
          end=s.rfind('</script>')
          Path('/tmp/evia.js').write_text(s[start:end])
          required=['archDetailPanel','renderTimePage','renderCoursePage','renderAttendPage','renderLearnPage','importNaxosNvqPack','buildKsbCourseMeta','data-course-target','data-evidence-path']
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit(f'missing required markers: {missing}')
          PY
          node --check /tmp/evia.js
          git diff --check
      - name: Remove temporary update files
        run: |
          rm .tmp_arch_pages_ui.py .tmp_arch_pages_import.py .github/workflows/apply-arch-detail-pages.yml .github/workflows/apply-arch-detail-pages-fixed.yml
      - name: Verify scope
        run: |
          python - <<'PY'
          import subprocess
          names=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          allowed={'index.html','.tmp_arch_pages_ui.py','.tmp_arch_pages_import.py','.github/workflows/apply-arch-detail-pages.yml','.github/workflows/apply-arch-detail-pages-fixed.yml'}
          extra=names-allowed
          if extra: raise SystemExit(f'unexpected changed files: {sorted(extra)}')
          if 'index.html' not in names: raise SystemExit('index.html was not changed')
          PY
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Add Evia arch detail pages and Naxos progress views
