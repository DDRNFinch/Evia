name: Apply approved Evia developer Nisia API

on:
  push:
    paths:
      - '.github/patch-approved-developer-nisia-api.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact Nisia developer API patch
        run: python .github/patch-approved-developer-nisia-api.py
      - name: Verify Nisia connector syntax
        run: node --check nisia-sync.js
      - name: Commit only approved connector change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nisia-sync.js
          git rm .github/patch-approved-developer-nisia-api.py .github/workflows/apply-approved-developer-nisia-api.yml
          git diff --cached --quiet && exit 0
          git commit -m "Expose Nisia diagnostics to Evia developer mode"
          git push
