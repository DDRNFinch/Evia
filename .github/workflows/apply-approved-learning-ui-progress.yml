name: Apply approved Evia learning UI and progress
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-approved-learning-ui-progress.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skip redundant Quick Review matcher
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/patch-approved-learning-ui-progress.py')
          t=p.read_text(encoding='utf-8')
          old="replace_once(old_quick,new_quick,'Quick Review progress source')"
          if old not in t: raise SystemExit('redundant matcher marker missing')
          p.write_text(t.replace(old,"# Quick Review already uses completedEvidencePaths",1),encoding='utf-8')
          PY
      - name: Apply approved patch
        run: python .github/patch-approved-learning-ui-progress.py
      - name: Validate Evia
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',text,flags=re.S)
          if not scripts: raise SystemExit('No script found')
          Path('/tmp/evia-script.js').write_text('\n'.join(scripts),encoding='utf-8')
          required=['data-otj-idea','learnReflectionHours','learnReflectionMinutes','function completedCourseProgress()','fileSavedHover','Gap to consider','completedEvidencePaths.has(evidencePathKey(leaf.path))','M8 52 C8 20 25 7 50 7 C75 7 92 20 92 52']
          missing=[m for m in required if m not in text]
          if missing: raise SystemExit('Missing markers: '+', '.join(missing))
          ids=set(re.findall(r'id="([^"]+)"',text)); refs=set(re.findall(r"getElementById\(['\"]([^'\"]+)['\"]\)",text))
          missing_ids=sorted(refs-ids)
          if missing_ids: raise SystemExit('Missing element IDs: '+', '.join(missing_ids))
          PY
          node --check /tmp/evia-script.js
      - name: Remove temporary update files
        run: rm .github/patch-approved-learning-ui-progress.py .github/workflows/apply-approved-learning-ui-progress.yml
      - name: Verify scope
        run: |
          python - <<'PY'
          import subprocess
          allowed={'index.html','.github/patch-approved-learning-ui-progress.py','.github/workflows/apply-approved-learning-ui-progress.yml'}
          paths=set()
          for row in subprocess.check_output(['git','status','--porcelain'],text=True).splitlines():
              p=row[3:].strip(); p=p.split(' -> ',1)[-1]; paths.add(p)
          extra=paths-allowed
          if extra: raise SystemExit('Unexpected changed files: '+', '.join(sorted(extra)))
          if 'index.html' not in paths: raise SystemExit('index.html was not changed')
          PY
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Improve Learn UI evidence timing and course progress
          file_pattern: 'index.html .github/patch-approved-learning-ui-progress.py .github/workflows/apply-approved-learning-ui-progress.yml'
