name: Verify Evia Cloudflare AI worker

on:
  push:
    branches:
      - main
    paths:
      - 'cloudflare-ai/**'
      - '.github/workflows/cloudflare-epa-worker.yml'

permissions:
  contents: read

concurrency:
  group: evia-cloudflare-worker-verify
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify Cloudflare-connected deployment
        run: |
          node - <<'NODE'
          const url = 'https://evia-teach-test.finchyisnow.workers.dev/health';
          const expected = '@cf/nvidia/nemotron-3-120b-a12b';
          let last = '';
          for (let i = 0; i < 48; i++) {
            try {
              const response = await fetch(url, { cache: 'no-store' });
              last = await response.text();
              if (response.ok) {
                const data = JSON.parse(last);
                if (data.epaModel === expected) {
                  console.log('Verified Cloudflare EPA model:', data.epaModel);
                  console.log('Fallback model:', data.epaFallbackModel || 'not reported');
                  process.exit(0);
                }
              }
            } catch (error) {
              last = String(error);
            }
            await new Promise(resolve => setTimeout(resolve, 5000));
          }
          console.error('Cloudflare-connected EPA deployment was not verified:', last);
          process.exit(1);
          NODE
