name: Apply approved Evia evidence flow

on:
  push:
    paths:
      - '.github/workflows/apply-evidence-flow-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply approved patches
        run: |
          python .github/scripts/evia_patch_ui.py
          python .github/scripts/evia_patch_capture.py
          python .github/scripts/evia_patch_completion.py
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text()
          scripts=[]
          for attrs,body in re.findall(r'<script([^>]*)>(.*?)</script>',text,re.S|re.I):
              if 'src=' not in attrs.lower() and body.strip(): scripts.append(body)
          Path('/tmp/evia-inline.js').write_text('\n'.join(scripts))
          required=['bottom-arches','beginEvidenceCollection','openPhotoCapture','openVideoCapture','openAudioCapture','completeEvidenceExperience','eviaLearningEntries','Tap me to get started']
          missing=[x for x in required if x not in text]
          if missing: raise SystemExit('Missing approved features: '+', '.join(missing))
          PY
          node --check /tmp/evia-inline.js
      - name: Commit Evia update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js
          git diff --cached --quiet || git commit -m "Add approved Evia evidence flow and bottom arches"
          git push
