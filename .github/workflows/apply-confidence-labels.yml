name: Apply approved Evia confidence wording update

on:
  push:
    paths:
      - '.github/workflows/apply-confidence-labels.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Apply approved wording patch
        run: python .tmp/apply-confidence-labels.py

      - name: Validate approved scope
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          expected = [
              "{ label: 'New to this', action: 'check-confidence', value: 'not-confident' }",
              "{ label: 'Starting out', action: 'check-confidence', value: 'a-little' }",
              "{ label: 'Getting there', action: 'check-confidence', value: 'fairly-confident' }",
              "{ label: 'Know my stuff', action: 'check-confidence', value: 'very-confident' }",
          ]
          for item in expected:
              assert item in text, item
          assert "{ label: 'Not confident', action: 'check-confidence', value: 'not-confident' }" not in text
          assert "{ label: 'A little', action: 'check-confidence', value: 'a-little' }" not in text
          assert "{ label: 'Fairly confident', action: 'check-confidence', value: 'fairly-confident' }" not in text
          assert "{ label: 'Very confident', action: 'check-confidence', value: 'very-confident' }" not in text
          print('Confidence wording validation passed.')
          PY

      - name: Remove temporary update files
        run: |
          rm -f .tmp/apply-confidence-labels.py
          rm -f .github/workflows/apply-confidence-labels.yml
          rmdir .tmp 2>/dev/null || true

      - name: Verify changed paths
        run: |
          changed=$(git status --short | awk '{print $2}')
          printf '%s\n' "$changed"
          bad=$(printf '%s\n' "$changed" | grep -v -E '^(index\.html|\.tmp/apply-confidence-labels\.py|\.github/workflows/apply-confidence-labels\.yml)$' || true)
          test -z "$bad"

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Update Evia confidence wording
