name: Deploy Evia7 to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_run:
    workflows:
      - Evia7 Preview
    types:
      - completed
    branches:
      - preview/evia7-test
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: >
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main site
        uses: actions/checkout@v6
        with:
          ref: main
          path: main-site

      - name: Checkout preview site
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          path: preview-site

      - name: Checkout preview site for manual run
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v6
        with:
          ref: preview/evia7-test
          path: preview-site

      - name: Build main-only Pages site
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          rm -rf public
          mkdir -p public
          rsync -a --exclude='.git' --exclude='.github' main-site/ public/
          test -f public/index.html

      - name: Build combined Pages site for preview
        if: github.event_name != 'push'
        run: |
          set -euo pipefail
          rm -rf public
          mkdir -p public/preview/evia7-test
          rsync -a --exclude='.git' --exclude='.github' main-site/ public/
          rsync -a --exclude='.git' --exclude='.github' preview-site/ public/preview/evia7-test/
          test -f public/index.html
          test -f public/preview/evia7-test/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
