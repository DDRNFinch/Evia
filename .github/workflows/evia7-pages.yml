name: Deploy Evia7 to GitHub Pages

on:
  push:
    branches:
      - main
      - preview/evia7-test
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main site
        uses: actions/checkout@v6
        with:
          ref: main
          path: main-site

      - name: Checkout preview site
        uses: actions/checkout@v6
        with:
          ref: preview/evia7-test
          path: preview-site

      - name: Build combined Pages site
        run: |
          mkdir -p public/preview/evia7-test
          rsync -a --exclude='.git' --exclude='.github' main-site/ public/
          rsync -a --exclude='.git' --exclude='.github' preview-site/ public/preview/evia7-test/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
