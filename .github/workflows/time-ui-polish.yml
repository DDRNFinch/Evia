name: Time timeline UI polish

on:
  push:
    branches: [time-only-redesign]
    paths:
      - '.github/workflows/time-ui-polish.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: time-only-redesign
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply approved Time UI polish
        run: |
          python .github/time-ui-polish.py
          python .github/time-ui-polish-encoding-fix.py
      - name: Verify Time source syntax
        run: node --check evia-approved-time-monthly-packs-v1.js
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Run Time regression tests
        run: npx playwright test tests/time-only-redesign.spec.js --reporter=line
      - name: Run complete Evia smoke suite
        run: npm run test:smoke
      - name: Verify change scope
        run: |
          git diff --name-only HEAD | sort > /tmp/changed
          printf '%s\n' evia-approved-time-monthly-packs-v1.js evia-runtime-manifest.js index.html tests/time-only-redesign.spec.js | sort > /tmp/allowed
          diff -u /tmp/allowed /tmp/changed
      - name: Commit verified UI polish and remove temporary tooling
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/time-ui-polish.py .github/time-ui-polish-encoding-fix.py .github/workflows/time-ui-polish.yml
          git add evia-approved-time-monthly-packs-v1.js evia-runtime-manifest.js index.html tests/time-only-redesign.spec.js
          git commit -m 'Polish Time timeline hierarchy'
          git push origin HEAD:time-only-redesign
