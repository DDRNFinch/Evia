name: Fix KSB mapping PDF layout

on:
  push:
    branches: [fix-ksb-mapping-pdf-layout]
    paths:
      - '.github/workflows/fix-ksb-mapping-pdf-layout.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-ksb-mapping-pdf-layout
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply approved PDF layout fix
        run: python .github/fix-ksb-mapping-pdf-layout.py
      - name: Verify JavaScript syntax
        run: |
          node --check evia-evidence-ksb-index-v1.js
          node --check evia-runtime-manifest.js
          node --check tests/evidence-viewer-pack-v2.spec.js
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Run KSB evidence viewer regression
        run: npx playwright test tests/evidence-viewer-pack-v2.spec.js --reporter=line
      - name: Run complete Evia smoke suite
        run: npm run test:smoke
      - name: Verify approved app scope only
        run: |
          git diff --name-only HEAD | grep -v '^\.github/fix-ksb-mapping-pdf-layout' | sort > /tmp/changed
          printf '%s\n' evia-evidence-ksb-index-v1.js evia-runtime-manifest.js index.html tests/evidence-viewer-pack-v2.spec.js | sort > /tmp/allowed
          diff -u /tmp/allowed /tmp/changed
      - name: Commit verified fix and remove temporary tooling
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/fix-ksb-mapping-pdf-layout.py .github/workflows/fix-ksb-mapping-pdf-layout.yml
          git add evia-evidence-ksb-index-v1.js evia-runtime-manifest.js index.html tests/evidence-viewer-pack-v2.spec.js
          git commit -m 'Fix KSB mapping PDF page alignment'
          git push origin HEAD:fix-ksb-mapping-pdf-layout
