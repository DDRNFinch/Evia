name: Remove redundant Time heading

on:
  push:
    branches: [time-course-progress-v1]
    paths:
      - '.github/workflows/time-remove-redundant-heading.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: time-course-progress-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply approved Time-only change
        run: python .github/time-remove-redundant-heading.py
      - name: Verify syntax
        run: |
          node --check evia-approved-time-monthly-packs-v1.js
          node --check evia-runtime-manifest.js
          node --check tests/time-only-redesign.spec.js
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Run Time regression
        run: npx playwright test tests/time-only-redesign.spec.js --reporter=line
      - name: Run complete Evia smoke suite
        run: npm run test:smoke
      - name: Verify approved app change scope only
        run: |
          git diff --name-only HEAD | grep -v '^\.github/time-remove-redundant-heading' | grep -v '^\.github/workflows/time-remove-redundant-heading.yml' | sort > /tmp/changed
          printf '%s\n' evia-approved-time-monthly-packs-v1.js evia-runtime-manifest.js tests/time-only-redesign.spec.js | sort > /tmp/allowed
          diff -u /tmp/allowed /tmp/changed
      - name: Commit verified change and remove temporary tooling
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/time-remove-redundant-heading.py .github/time-remove-redundant-heading.yml .github/workflows/time-remove-redundant-heading.yml
          git add evia-approved-time-monthly-packs-v1.js evia-runtime-manifest.js tests/time-only-redesign.spec.js
          git commit -m 'Remove redundant Time month heading'
          git push origin HEAD:time-course-progress-v1
