name: Time milestone redesign v4

on:
  push:
    branches: [time-milestone-redesign-v4]
    paths:
      - '.github/workflows/time-milestone-redesign-v4.yml'

permissions:
  contents: write

jobs:
  redesign:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: time-milestone-redesign-v4
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply approved Time milestone redesign
        run: python .github/time-milestone-redesign-v4.py
      - name: Verify Time source syntax
        run: node --check evia-approved-time-monthly-packs-v1.js
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Run Time regression tests
        run: npx playwright test tests/time-only-redesign.spec.js --reporter=line
      - name: Run complete Evia smoke suite
        run: npm run test:smoke
      - name: Verify approved change scope only
        run: |
          git diff --name-only HEAD | sort > /tmp/changed
          printf '%s\n' evia-approved-time-monthly-packs-v1.js evia-runtime-manifest.js index.html tests/time-only-redesign.spec.js | sort > /tmp/allowed
          diff -u /tmp/allowed /tmp/changed
      - name: Commit verified redesign and remove temporary tooling
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/time-milestone-redesign-v4.py .github/workflows/time-milestone-redesign-v4.yml
          git add evia-approved-time-monthly-packs-v1.js evia-runtime-manifest.js index.html tests/time-only-redesign.spec.js
          git commit -m 'Redesign Time as milestone timeline'
          git push origin HEAD:time-milestone-redesign-v4
