name: Time-only redesign diagnostic

on:
  push:
    branches: [time-only-redesign]
    paths:
      - '.github/workflows/time-only-redesign.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: time-only-redesign
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Save approved main-state files
        run: |
          mkdir -p /tmp/evia-original
          cp service-worker.js /tmp/evia-original/service-worker.js
          cp evia-runtime-manifest.js /tmp/evia-original/evia-runtime-manifest.js
          cp evia-approved-time-monthly-packs-v1.js /tmp/evia-original/evia-approved-time-monthly-packs-v1.js
          cp index.html /tmp/evia-original/index.html
      - name: Apply candidate Time redesign
        run: |
          python .github/time-only-redesign.py
          python .github/time-only-test-fix.py
          python .github/time-only-runtime-test-fix.py
          npm install --no-audit --no-fund
      - name: Confirm Time candidate itself
        run: npx playwright test tests/time-only-redesign.spec.js --reporter=line
      - name: Isolate EPA MCQ interaction
        run: |
          set +e
          echo '=== CASE A: complete Time candidate ==='
          npx playwright test tests/epa-mcq-bank.spec.js --reporter=line
          A=$?
          echo "CASE_A=$A"

          echo '=== CASE B: original service worker only ==='
          cp /tmp/evia-original/service-worker.js service-worker.js
          npx playwright test tests/epa-mcq-bank.spec.js --reporter=line
          B=$?
          echo "CASE_B=$B"

          echo '=== CASE C: original service worker + runtime manifest ==='
          cp /tmp/evia-original/evia-runtime-manifest.js evia-runtime-manifest.js
          npx playwright test tests/epa-mcq-bank.spec.js --reporter=line
          C=$?
          echo "CASE_C=$C"

          echo '=== CASE D: original service worker + manifest + Time runtime ==='
          cp /tmp/evia-original/evia-approved-time-monthly-packs-v1.js evia-approved-time-monthly-packs-v1.js
          npx playwright test tests/epa-mcq-bank.spec.js --reporter=line
          D=$?
          echo "CASE_D=$D"

          echo '=== CASE E: full original app state ==='
          cp /tmp/evia-original/index.html index.html
          npx playwright test tests/epa-mcq-bank.spec.js --reporter=line
          E=$?
          echo "CASE_E=$E"

          echo "RESULTS A=$A B=$B C=$C D=$D E=$E"
          exit 0
