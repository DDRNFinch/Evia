# rerun after aligning the EPA identity regression with explicit first-load runtime
name: Time and runtime stability

on:
  push:
    branches: [time-only-redesign]
    paths:
      - '.github/workflows/time-only-redesign.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: time-only-redesign
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply the precise Time source boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('.github/time-only-redesign.py')
          text=path.read_text(encoding='utf-8')
          old="b_marker = '    function renderCoursePage() {'"
          new="b_marker = '    function courseMetaMappings() {'"
          if text.count(old) != 1:
              raise SystemExit('Expected one original Time removal boundary')
          path.write_text(text.replace(old,new,1),encoding='utf-8')
          PY

      - name: Build the approved Time and runtime candidate
        run: |
          python .github/time-only-redesign.py
          python .github/time-only-test-fix.py
          python .github/time-only-runtime-test-fix.py
          python .github/time-runtime-stability.py
          python - <<'PY'
          from pathlib import Path
          path=Path('tests/time-only-redesign.spec.js')
          text=path.read_text(encoding='utf-8')
          old="expect(worker).toContain(\"const C='evia-pwa-v85'\");expect(worker).toContain(\"url.searchParams.set('__evia_refresh','85')\");"
          new="expect(worker).toContain(\"const C='evia-pwa-v85'\");expect(worker).toContain(\"const RELEASE_VERSION='1.1'\");expect(worker).not.toContain('client.navigate(');expect(worker).not.toContain('__evia_refresh');"
          if text.count(old) != 1:
              raise SystemExit('Expected one old Time service-worker assertion')
          path.write_text(text.replace(old,new,1),encoding='utf-8')
          PY

      - name: Verify source boundaries and syntax
        run: |
          grep -F "function courseMetaMappings()" index.html
          grep -F "function inferredCourseMeta()" index.html
          if grep -Fq "function renderTimePage()" index.html; then
            echo 'Superseded Time renderer still exists'
            exit 1
          fi
          node --check evia-approved-time-monthly-packs-v1.js
          node --check evia-runtime-manifest.js
          node --check service-worker.js
          node --check evia-approved-updates-stable-v1.js

      - name: Install test dependencies
        run: npm install --no-audit --no-fund

      - name: Verify runtime architecture
        run: npx playwright test tests/runtime-manifest.spec.js --reporter=line

      - name: Verify Time and EPA integrations
        run: |
          npx playwright test tests/time-only-redesign.spec.js --reporter=line
          npx playwright test tests/epa-mcq-bank.spec.js --reporter=line
          npx playwright test tests/epa-menu.spec.js --reporter=line
          npx playwright test tests/epa-home-evia-v84.spec.js --repeat-each=3 --reporter=line

      - name: Verify core learner surfaces
        run: npx playwright test tests/evia-smoke.spec.js --grep "core learner surfaces" --reporter=line

      - name: Run complete Evia smoke suite
        run: npm run test:smoke

      - name: Verify only intended final files changed
        run: |
          git diff --name-only HEAD | grep -v '^.github/time-' | grep -v '^.github/workflows/time-only-redesign.yml$' | sort > /tmp/changed
          printf '%s\n' \
            evia-approved-time-monthly-packs-v1.js \
            evia-approved-updates-stable-v1.js \
            evia-release.json \
            evia-runtime-manifest.js \
            index.html \
            service-worker.js \
            tests/epa-home-evia-v84.spec.js \
            tests/epa-menu.spec.js \
            tests/runtime-manifest.spec.js \
            tests/time-only-redesign.spec.js | sort > /tmp/allowed
          unexpected="$(comm -23 /tmp/changed /tmp/allowed)"
          if [ -n "$unexpected" ]; then
            echo 'Unexpected files changed:'
            printf '%s\n' "$unexpected"
            exit 1
          fi

      - name: Commit verified branch candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            evia-approved-time-monthly-packs-v1.js \
            evia-approved-updates-stable-v1.js \
            evia-release.json \
            evia-runtime-manifest.js \
            index.html \
            service-worker.js \
            tests/epa-home-evia-v84.spec.js \
            tests/epa-menu.spec.js \
            tests/runtime-manifest.spec.js \
            tests/time-only-redesign.spec.js
          git commit -m 'Stabilize Time and runtime startup'
          git push origin HEAD:time-only-redesign
