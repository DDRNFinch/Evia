name: Time-only redesign diagnostic

on:
  push:
    branches: [time-only-redesign]
    paths:
      - '.github/workflows/time-only-redesign.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: time-only-redesign
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Save original files
        run: |
          mkdir -p /tmp/original
          cp service-worker.js /tmp/original/service-worker.js
          cp evia-runtime-manifest.js /tmp/original/evia-runtime-manifest.js
          cp evia-approved-time-monthly-packs-v1.js /tmp/original/evia-approved-time-monthly-packs-v1.js
          cp index.html /tmp/original/index.html
      - name: Apply corrected candidate
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('.github/time-only-redesign.py')
          text=path.read_text(encoding='utf-8')
          text=text.replace("b_marker = '    function renderCoursePage() {'", "b_marker = '    function courseMetaMappings() {'", 1)
          path.write_text(text,encoding='utf-8')
          PY
          python .github/time-only-redesign.py
          python .github/time-only-test-fix.py
          python .github/time-only-runtime-test-fix.py
          npm install --no-audit --no-fund
      - name: Isolate EPA homepage identity interaction
        run: |
          set +e
          echo '=== A candidate ==='
          npx playwright test tests/epa-home-evia-v84.spec.js --reporter=line
          A=$?
          echo "A=$A"
          echo '=== B restore service worker ==='
          cp /tmp/original/service-worker.js service-worker.js
          npx playwright test tests/epa-home-evia-v84.spec.js --reporter=line
          B=$?
          echo "B=$B"
          echo '=== C restore runtime manifest ==='
          cp /tmp/original/evia-runtime-manifest.js evia-runtime-manifest.js
          npx playwright test tests/epa-home-evia-v84.spec.js --reporter=line
          C=$?
          echo "C=$C"
          echo '=== D restore Time runtime ==='
          cp /tmp/original/evia-approved-time-monthly-packs-v1.js evia-approved-time-monthly-packs-v1.js
          npx playwright test tests/epa-home-evia-v84.spec.js --reporter=line
          D=$?
          echo "D=$D"
          echo '=== E restore index ==='
          cp /tmp/original/index.html index.html
          npx playwright test tests/epa-home-evia-v84.spec.js --reporter=line
          E=$?
          echo "E=$E"
          echo "RESULTS A=$A B=$B C=$C D=$D E=$E"
          exit 0
