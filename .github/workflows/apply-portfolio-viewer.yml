name: Apply approved portfolio viewer
on:
  push:
    paths:
      - '.github/workflows/apply-portfolio-viewer.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .tmp_portfolio_viewer_patch.py
      - run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          start=s.rfind('<script>')+len('<script>')
          end=s.rfind('</script>')
          Path('/tmp/evia.js').write_text(s[start:end])
          PY
          node --check /tmp/evia.js
          git diff --check
      - run: rm .tmp_portfolio_viewer_patch.py .github/workflows/apply-portfolio-viewer.yml
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Add Evia portfolio evidence viewer and Learn export
