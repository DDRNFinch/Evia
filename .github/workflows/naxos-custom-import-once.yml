name: Apply Naxos customisation import

on:
  push:
    paths:
      - '.github/workflows/naxos-custom-import-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Naxos KSB importer
        run: python .github/scripts/patch_naxos_custom_import.py
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text()
          scripts=[]
          for attrs,body in re.findall(r'<script([^>]*)>(.*?)</script>', text, re.S|re.I):
              if 'src=' not in attrs.lower() and body.strip(): scripts.append(body)
          Path('/tmp/evia-inline.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/evia-inline.js
      - name: Commit importer bridge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Import Naxos KSB course customisations"
          git push
