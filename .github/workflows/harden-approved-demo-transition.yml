name: Harden approved Evia demo transition
on:
  push:
    paths:
      - '.github/patch-approved-demo-transition.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/patch-approved-demo-transition.py
      - run: node --check evia-demo-v1.js
      - name: Verify transition without IndexedDB
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          class Store{constructor(init={}){this.m=new Map(Object.entries(init));}get length(){return this.m.size}key(i){return [...this.m.keys()][i]??null}getItem(k){return this.m.has(k)?this.m.get(k):null}setItem(k,v){this.m.set(k,String(v))}removeItem(k){this.m.delete(k)}}
          const c={console,Math,Promise,JSON,Date,setTimeout,clearTimeout,setInterval,clearInterval};c.window=c;c.navigator={};c.localStorage=new Store();c.sessionStorage=new Store();c.document={readyState:'loading',addEventListener(){},getElementById(){return null}};vm.createContext(c);vm.runInContext(fs.readFileSync('evia-demo-v1.js','utf8'),c);
          c.localStorage.setItem('eviaCompletedEvidencePathsV1','["demo"]');c.localStorage.setItem('eviaLearnerProfile','{"firstName":"Demo"}');c.localStorage.setItem('nisia-evia-auth-v1','keep');
          c.__eviaDemo.prepareForFullMode().then(()=>{if(c.localStorage.getItem('eviaDemoModeV1'))throw new Error('Demo flag remained');if(c.localStorage.getItem('eviaNaxosCourse'))throw new Error('Demo course remained');if(c.localStorage.getItem('eviaCompletedEvidencePathsV1'))throw new Error('Demo progress remained');if(c.localStorage.getItem('eviaLearnerProfile'))throw new Error('Demo profile remained');if(c.localStorage.getItem('nisia-evia-auth-v1')!=='keep')throw new Error('Nisia session was removed');console.log('Transition fallback verified');});
          NODE
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evia-demo-v1.js
          git rm .github/patch-approved-demo-transition.py .github/workflows/harden-approved-demo-transition.yml
          git commit -m "Harden Evia demo transition"
          git push
