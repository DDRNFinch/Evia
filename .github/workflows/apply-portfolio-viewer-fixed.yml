name: Apply approved portfolio viewer fixed
on:
  push:
    paths:
      - '.github/workflows/apply-portfolio-viewer-fixed.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .tmp_fix_portfolio_patch_escape.py
      - run: python .tmp_portfolio_viewer_patch.py
      - run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          start=s.rfind('<script>')+len('<script>')
          end=s.rfind('</script>')
          Path('/tmp/evia.js').write_text(s[start:end])
          required=['portfolioViewerOpen','openEvidenceViewer','editActiveEvidence','deleteActiveEvidence',"name: 'learn/learning.json'",'learning: learningEntries','clearEvidencePathComplete(deleted.path)']
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit('Missing approved markers: '+', '.join(missing))
          PY
          node --check /tmp/evia.js
          git diff --check
      - run: rm .tmp_portfolio_viewer_patch.py .tmp_fix_portfolio_patch_escape.py .github/workflows/apply-portfolio-viewer.yml .github/workflows/apply-portfolio-viewer-fixed.yml
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Add Evia portfolio evidence viewer and Learn export
