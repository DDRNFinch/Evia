name: Verify Evia 94
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check assets/evia-arp-home-score-v94.js
      - run: node --check assets/evia-count-display-v94.js
      - run: node --check assets/evia-milos-observed-arch-v94.js
      - run: node --check assets/evia-nvq-v94.js
      - run: node --check assets/evia-version-v94.js
      - run: node --check sw.js
      - run: node --test tests/home-arch-v93.test.mjs tests/milos-observed-arch-v91.test.mjs tests/nvq-ac-browser-v90.test.mjs
      - run: python -m json.tool update.json >/dev/null
