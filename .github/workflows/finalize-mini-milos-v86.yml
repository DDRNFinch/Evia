name: Finalize Mini Milos QR v86

on:
  push:
    branches: [fix/mini-milos-qr-v86]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mini-milos-qr-v86
          fetch-depth: 0
      - name: Use normal local script loading
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('assets/evia-mini-milos-v86.js')
          s=p.read_text()
          old="""async function ensureQr(){
  if(typeof window.qrcode==='function')return true;
  try{
    const cache=typeof caches!=='undefined'?await caches.open(LIB_CACHE):null;
    let response=cache?await cache.match(QRLIB):null;
    if(!response){response=await fetch(QRLIB,{cache:'force-cache'});if(response.ok&&cache)await cache.put(QRLIB,response.clone())}
    if(!response||!response.ok)throw Error('QR generator unavailable');
    const source=await response.text();(0,eval)(source);return typeof window.qrcode==='function';
  }catch(error){console.warn('Mini Milos QR library',error);return false}
}"""
          new="""async function ensureQr(){
  if(typeof window.qrcode==='function')return true;
  return await new Promise(resolve=>{
    let script=document.querySelector('script[data-evia-mm-qrcode]');
    const done=()=>resolve(typeof window.qrcode==='function');
    if(script){if(typeof window.qrcode==='function')return resolve(true);script.addEventListener('load',done,{once:true});script.addEventListener('error',()=>resolve(false),{once:true});return}
    script=document.createElement('script');script.src=QRLIB;script.async=true;script.dataset.eviaMmQrcode='1';script.addEventListener('load',done,{once:true});script.addEventListener('error',()=>resolve(false),{once:true});document.head.appendChild(script)
  })
}"""
          if old not in s:
              raise SystemExit('Expected ensureQr block not found')
          p.write_text(s.replace(old,new))
          PY
      - name: Add QR regression test
        shell: bash
        run: |
          cat > tests/mini-milos-qr.test.mjs <<'EOF'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import test from 'node:test';
          import vm from 'node:vm';

          const app = fs.readFileSync('assets/evia-mini-milos-v86.js', 'utf8');
          const html = fs.readFileSync('index.html', 'utf8');
          const sw = fs.readFileSync('sw.js', 'utf8');
          const qrSource = fs.readFileSync('assets/qrcode.js', 'utf8');

          test('Mini Milos uses Evia-local QR assets and bounded payloads', () => {
            assert.match(app, /QRLIB='\.\/assets\/qrcode\.js\?v=86'/);
            assert.match(app, /slice\(0,6\)/);
            assert.match(app, /previousList\.length\?done\.filter/);
            assert.match(app, /window\.qrcode\(0,'L'\)/);
            assert.match(app, /data-evia-mm-qrcode/);
            assert.doesNotMatch(app, /\/Milos\/assets\/qrcode\.js/);
            assert.doesNotMatch(app, /\(0,eval\)/);
            assert.doesNotMatch(html, /\/Evia_beta\//);
            assert.doesNotMatch(html, /evia-beta-isolation\.js/);
            assert.match(sw, /"\.\/assets\/qrcode\.js"/);
            assert.match(sw, /evia-shell-v86/);
          });

          test('vendored QR generator creates a sizeable Milos transfer QR', () => {
            const context = {};
            vm.createContext(context);
            vm.runInContext(qrSource, context, { filename: 'qrcode.js' });
            assert.equal(typeof context.qrcode, 'function');
            const qr = context.qrcode(0, 'L');
            qr.addData('NISI:EVIA:PROGRESS:1:' + 'A'.repeat(1800), 'Byte');
            qr.make();
            assert.ok(qr.getModuleCount() > 0);
          });
          EOF
      - name: Verify static repair
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'data-evia-mm-qrcode' assets/evia-mini-milos-v86.js
          ! grep -q '(0,eval)' assets/evia-mini-milos-v86.js
          test -s assets/qrcode.js
          ! grep -q '/Evia_beta/' index.html
      - name: Commit verified repair and remove one-use workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/finalize-mini-milos-v86.yml
          git add assets/evia-mini-milos-v86.js tests/mini-milos-qr.test.mjs
          git commit -m 'Verify Mini Milos QR sharing repair'
          git push origin HEAD:fix/mini-milos-qr-v86
      - name: Run repository tests
        shell: bash
        run: npm test
