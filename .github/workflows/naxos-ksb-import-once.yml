name: Apply Naxos KSB import support

on:
  push:
    paths:
      - '.github/workflows/naxos-ksb-import-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Evia Naxos QR importer
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          start = text.index('    function parseNaxosPayload(rawValue) {')
          end = text.index('    async function startScanner() {', start)
          encoded = ''
          replacement = base64.b64decode(encoded).decode('utf-8')
          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          PY
      - name: Commit importer update
        run: |
          if git diff --quiet -- index.html; then
            echo "No index change was required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Load Naxos KSB mapping packs in Evia"
          git push
