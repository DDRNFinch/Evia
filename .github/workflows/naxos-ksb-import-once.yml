name: Validate Naxos KSB import support

on:
  push:
    paths:
      - '.github/workflows/naxos-ksb-import-once.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Evia inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          assert 'function parseNaxosPackPointer(rawValue)' in html
          assert 'async function importNaxosKsbPack(pointer)' in html
          scripts = re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', html, re.S | re.I)
          if not scripts:
              raise SystemExit('No inline scripts found')
          for index, script in enumerate(scripts):
              Path(f'/tmp/evia-inline-{index}.js').write_text(script, encoding='utf-8')
          print(f'Extracted {len(scripts)} inline script(s)')
          PY
          for file in /tmp/evia-inline-*.js; do node --check "$file"; done
      - name: Check published Naxos KSB pack paths
        run: |
          python - <<'PY'
          import json
          from urllib.request import urlopen
          from urllib.parse import urljoin

          packs = [
              'ST0095-v1.json',
              'ST0264-SITE-v1.json',
              'ST0264-AJ-v1.json',
              'ST0171-v1.json',
          ]
          base = 'https://ddrnfinch.github.io/Naxos-Mapping_Engine/packs/'
          for name in packs:
              pack_url = urljoin(base, name)
              with urlopen(pack_url, timeout=20) as response:
                  pack = json.load(response)
              refs = [pack['ksbRegistry'], pack['facetRegistry'], pack['evidenceRules'], *pack['categoryFiles']]
              for ref in refs:
                  url = urljoin(pack_url, ref)
                  with urlopen(url, timeout=20) as response:
                      if response.status != 200:
                          raise SystemExit(f'{url} returned {response.status}')
              print(f'{name}: {len(refs)} referenced files resolved')
          PY
