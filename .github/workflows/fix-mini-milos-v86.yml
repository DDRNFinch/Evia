name: Fix Mini Milos QR v86

on:
  push:
    branches: [fix/mini-milos-qr-v86]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mini-milos-qr-v86
          fetch-depth: 0
      - name: Vendor QR generator and repair main paths
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/DDRNFinch/Milos/main/assets/qrcode.js -o assets/qrcode.js
          python - <<'PY'
          from pathlib import Path
          import json

          p = Path('index.html')
          s = p.read_text()
          s = s.replace('<meta name="apple-mobile-web-app-title" content="Evia Beta" />', '<meta name="apple-mobile-web-app-title" content="Evia" />')
          s = s.replace('<meta name="evia-app-version" content="85" />', '<meta name="evia-app-version" content="86" />')
          s = s.replace('<title>Evia Beta — Apprentice Vocational Assistant</title>', '<title>Evia — Apprentice Vocational Assistant</title>')
          s = s.replace('<script src="./assets/evia-beta-isolation.js?v=76"></script>\n', '')
          s = s.replace('/Evia_beta/', '/Evia/')
          s = s.replace('evia-mini-milos-v85.js?v=85', 'evia-mini-milos-v86.js?v=86')
          p.write_text(s)

          src = Path('assets/evia-mini-milos-v85.js')
          s = src.read_text()
          s = s.replace('const VERSION=85;', 'const VERSION=86;')
          s = s.replace("const QRLIB='/Milos/assets/qrcode.js?v=1.2';", "const QRLIB='./assets/qrcode.js?v=86';")
          dst = Path('assets/evia-mini-milos-v86.js')
          dst.write_text(s)
          src.unlink()

          p = Path('sw.js')
          s = p.read_text()
          s = s.replace('const CACHE_NAME = "evia-beta-shell-v85";', 'const CACHE_NAME = "evia-shell-v86";')
          s = s.replace('  "./assets/evia-beta-isolation.js",\n', '')
          s = s.replace('  "./assets/jsQR-1.4.0.js",', '  "./assets/jsQR-1.4.0.js",\n  "./assets/qrcode.js",')
          s = s.replace('  "./assets/evia-mini-milos-v85.js",', '  "./assets/evia-mini-milos-v86.js",')
          p.write_text(s)

          for name in ('manifest.webmanifest', 'public/manifest.webmanifest'):
              p = Path(name)
              data = json.loads(p.read_text())
              data['name'] = 'Evia — Apprentice Vocational Assistant'
              data['short_name'] = 'Evia'
              p.write_text(json.dumps(data, indent=2) + '\n')

          update = {
              'version': '86',
              'title': 'Mini Milos QR sharing repaired',
              'details': [
                  'Share with Assessor now generates its QR entirely inside Evia',
                  'The QR generator is stored and cached with Evia for offline use',
                  'Evia main now loads its own /Evia assets instead of /Evia_beta assets',
                  'Main Evia storage is no longer redirected through Beta isolation'
              ]
          }
          for name in ('update.json', 'public/update.json'):
              Path(name).write_text(json.dumps(update, indent=2) + '\n')
          PY
      - name: Verify repair
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/qrcode.js
          grep -q "const QRLIB='./assets/qrcode.js?v=86';" assets/evia-mini-milos-v86.js
          grep -q 'evia-mini-milos-v86.js?v=86' index.html
          ! grep -q '/Evia_beta/' index.html
          ! grep -q 'evia-beta-isolation.js' index.html
          grep -q '"./assets/qrcode.js"' sw.js
          grep -q 'evia-shell-v86' sw.js
          npm test
      - name: Commit repaired app
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Repair Mini Milos QR sharing in Evia v86'
          git push origin HEAD:fix/mini-milos-qr-v86
