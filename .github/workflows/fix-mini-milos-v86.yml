name: Fix Mini Milos QR v86

on:
  push:
    branches: [fix/mini-milos-qr-v86]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mini-milos-qr-v86
          fetch-depth: 0
      - name: Finalise Mini Milos QR repair
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/qrcode.js
          python - <<'PY'
          from pathlib import Path

          p = Path('assets/evia-mini-milos-v86.js')
          s = p.read_text()
          old = "function targetList(){const s=read('evia-targets-v1',{}),xs=Array.isArray(s?.targets)?s.targets:[];return xs.filter(t=>!t.completedAt).slice(0,12).map(t=>({id:String(t.id||''),title:String(t.title||'').slice(0,220),code:String(t.code||'').slice(0,32),dueDate:String(t.dueDate||s.dueDate||'').slice(0,10),status:t.completedAt?'Done':'Active'})).filter(t=>t.title)}"
          new = "function targetList(){const s=read('evia-targets-v1',{}),xs=Array.isArray(s?.targets)?s.targets:[];return xs.filter(t=>!t.completedAt).slice(0,6).map(t=>({title:String(t.title||'').replace(/\\s+/g,' ').trim().slice(0,96),code:String(t.code||'').slice(0,32),dueDate:String(t.dueDate||s.dueDate||'').slice(0,10)})).filter(t=>t.title)}"
          if old in s:
              s = s.replace(old, new)
          s = s.replace("const t=timeline(),done=codes(),base=read(BASELINE_KEY,{}),previous=new Set(Array.isArray(base[route])?base[route]:[]),changed=done.filter(x=>!previous.has(x)),l=learning(c);", "const t=timeline(),done=codes(),base=read(BASELINE_KEY,{}),previousList=Array.isArray(base[route])?base[route]:[],previous=new Set(previousList),changed=previousList.length?done.filter(x=>!previous.has(x)):[],l=learning(c);")
          old_render = "function renderQr(el,text){if(typeof window.qrcode!=='function')throw Error('QR generator is not ready. Connect once and try again.');const qr=window.qrcode(0,'M');qr.addData(text,'Byte');qr.make();el.innerHTML=qr.createSvgTag({cellSize:5,margin:16,scalable:true,alt:'Evia progress QR for Milos'});const svg=el.querySelector('svg');if(svg){svg.style.width='100%';svg.style.maxWidth='310px';svg.style.height='auto';svg.style.display='block';svg.style.margin='0 auto'}}"
          new_render = "function renderQr(el,text){if(typeof window.qrcode!=='function')throw Error('QR generator is not ready.');let qr;try{qr=window.qrcode(0,'M');qr.addData(text,'Byte');qr.make()}catch(first){qr=window.qrcode(0,'L');qr.addData(text,'Byte');qr.make()}el.innerHTML=qr.createSvgTag({cellSize:5,margin:16,scalable:true,alt:'Evia progress QR for Milos'});const svg=el.querySelector('svg');if(svg){svg.style.width='100%';svg.style.maxWidth='310px';svg.style.height='auto';svg.style.display='block';svg.style.margin='0 auto'}}"
          if old_render in s:
              s = s.replace(old_render, new_render)
          p.write_text(s)
          PY
      - name: Verify QR safeguards
        shell: bash
        run: |
          set -euo pipefail
          grep -q "const QRLIB='./assets/qrcode.js?v=86';" assets/evia-mini-milos-v86.js
          grep -q "slice(0,6)" assets/evia-mini-milos-v86.js
          grep -q "previousList.length?done.filter" assets/evia-mini-milos-v86.js
          grep -q "window.qrcode(0,'L')" assets/evia-mini-milos-v86.js
          ! grep -q '/Evia_beta/' index.html
          ! grep -q 'evia-beta-isolation.js' index.html
          grep -q '"./assets/qrcode.js"' sw.js
          grep -q 'evia-shell-v86' sw.js
      - name: Commit safeguards
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/evia-mini-milos-v86.js
          if ! git diff --cached --quiet; then
            git commit -m 'Keep Mini Milos progress QR within reliable capacity'
            git push origin HEAD:fix/mini-milos-qr-v86
          fi
      - name: Run repository tests
        shell: bash
        run: npm test
